<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>CODEX THEME ATLAS · 主题世界图集</title>
  <style>
    :root{--bg:#0b0d10;--panel:#12151a;--panel-2:#181c22;--ink:#f2efe8;--muted:#989fa9;--line:#2a3038;--accent:#dbff4c;--danger:#ff6c61;--sidebar:294px}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.55 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}
    body{overflow-x:hidden}
    button,input{font:inherit;color:inherit}
    button{cursor:pointer}
    [hidden]{display:none!important}
    :focus-visible{outline:3px solid var(--accent);outline-offset:3px}
    .shell{width:min(100% - 48px,1280px);margin-inline:auto}
    .home{min-height:100vh}
    .home-header{padding:54px 0 36px;border-bottom:1px solid var(--line)}
    .home-kicker,.meta,.detail-mark{font:600 .7rem/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.15em;text-transform:uppercase}
    .home-kicker{color:var(--accent);margin:0 0 16px}
    .home-title{max-width:11ch;margin:0;font-size:clamp(3.2rem,8vw,7.8rem);line-height:.86;letter-spacing:-.075em}
    .home-intro{display:grid;grid-template-columns:1fr .75fr;gap:40px;align-items:end;margin-top:30px}
    .home-intro p{max-width:54rem;margin:0;color:var(--muted);font-size:1.05rem}
    .home-rule{display:flex;align-items:center;justify-content:flex-end;gap:12px;color:var(--muted)}
    .home-rule::before{content:"";width:58px;height:1px;background:var(--accent)}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;padding:36px 0 72px}
    .card{position:relative;min-width:0;background:var(--panel);border:1px solid var(--line);transition:transform .2s,border-color .2s,box-shadow .2s}
    .card:hover{transform:translateY(-5px);border-color:#59616c;box-shadow:0 20px 50px rgba(0,0,0,.34)}
    .card:focus-within{border-color:var(--accent)}
    .thumb{position:relative;aspect-ratio:16/10;overflow:hidden;background:#101319;border-bottom:1px solid var(--line)}
    .thumb::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,#101319 18%,#20252d 48%,#101319 78%);background-size:220% 100%;animation:shimmer 1.4s linear infinite}
    .thumb.is-loaded::before{display:none}
    .thumb iframe{position:absolute;left:0;top:0;width:1280px;height:800px;border:0;transform-origin:0 0;pointer-events:none;background:#fff;opacity:0;transition:opacity .3s}
    .thumb.is-loaded iframe{opacity:1}
    .card-body{min-height:122px;padding:17px}
    .card-index{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted)}
    .card-index b{color:var(--accent);font:600 .7rem ui-monospace,SFMono-Regular,Menlo,monospace}
    .card h2{margin:18px 0 3px;font-size:1.26rem;line-height:1.1;letter-spacing:-.03em}
    .card p{margin:0;color:var(--muted);font-size:.82rem}
    .card-link{position:absolute;inset:0;z-index:3}
    .card-link span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
    @keyframes shimmer{to{background-position:-220% 0}}

    .detail{position:fixed;inset:0;z-index:20;display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);background:var(--bg)}
    .sidebar{position:relative;z-index:4;display:flex;flex-direction:column;min-height:0;background:#0e1115;border-right:1px solid var(--line)}
    .back{display:flex;align-items:center;gap:11px;width:100%;padding:20px 18px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;font-weight:700}
    .back::before{content:"←";color:var(--accent)}
    .search-wrap{padding:15px 14px;border-bottom:1px solid var(--line)}
    .search-label{display:block;margin-bottom:7px;color:var(--muted);font:600 .64rem ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.13em;text-transform:uppercase}
    .search{width:100%;min-height:42px;padding:9px 11px;background:var(--panel);border:1px solid var(--line);border-radius:5px}
    .theme-list{overflow:auto;padding:8px;list-style:none;margin:0}
    .theme-list button{display:grid;grid-template-columns:32px 1fr;gap:9px;width:100%;padding:10px;border:0;border-radius:4px;background:transparent;text-align:left}
    .theme-list button:hover{background:var(--panel)}
    .theme-list button[aria-current="true"]{background:var(--accent);color:#0b0d10}
    .list-number{font:600 .65rem ui-monospace,SFMono-Regular,Menlo,monospace;opacity:.72}
    .list-copy strong,.list-copy small{display:block}.list-copy strong{font-size:.78rem;letter-spacing:.07em}.list-copy small{font-size:.72rem;opacity:.72}
    .empty{padding:18px 12px;color:var(--muted);font-size:.82rem}
    .sidebar-foot{margin-top:auto;padding:14px;border-top:1px solid var(--line);color:var(--muted);font-size:.7rem}

    .detail-main{display:grid;grid-template-rows:62px minmax(0,1fr);min-width:0;min-height:0}
    .detail-bar{display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:#0e1115}
    .drawer-button{display:none;width:40px;height:40px;border:1px solid var(--line);background:var(--panel)}
    .current{min-width:0;margin-right:auto}
    .current strong,.current small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.current strong{font-size:.86rem}.current small{color:var(--muted);font-size:.68rem}
    .tool-group{display:flex;align-items:center;border:1px solid var(--line);border-radius:5px;overflow:hidden}
    .tool{height:38px;min-width:40px;padding:0 11px;border:0;border-right:1px solid var(--line);background:var(--panel);font-size:.75rem}
    .tool:last-child{border-right:0}.tool:hover{background:#232830}.tool[aria-pressed="true"]{background:var(--accent);color:#0b0d10}
    .preview{position:relative;display:grid;place-items:center;min-width:0;min-height:0;overflow:hidden;background:#171b20}
    .preview::before{content:"";position:absolute;inset:0;background-image:linear-gradient(#20252b 1px,transparent 1px),linear-gradient(90deg,#20252b 1px,transparent 1px);background-size:24px 24px}
    .frame{position:relative;width:100%;height:100%;z-index:1;transition:width .25s,height .25s,border-radius .25s}
    .frame[data-viewport="mobile"]{width:390px;height:min(844px,calc(100% - 36px));border:9px solid #080a0c;border-radius:34px;box-shadow:0 24px 65px rgba(0,0,0,.48);overflow:hidden}
    .frame iframe{width:100%;height:100%;border:0;background:#fff}
    .loading{position:absolute;z-index:3;inset:0;display:grid;place-items:center;background:#14181d;color:var(--muted);font:600 .72rem ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em}
    .loading::after{content:"";width:72px;height:2px;margin-left:16px;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:load 1s ease-in-out infinite}
    @keyframes load{50%{transform:translateX(18px);opacity:.35}}
    .scrim{display:none;position:fixed;inset:0;z-index:3;background:rgba(0,0,0,.65)}

    .detail.is-full{grid-template-columns:1fr}
    .detail.is-full .sidebar,.detail.is-full .detail-bar{display:none}
    .detail.is-full .detail-main{grid-template-rows:1fr}
    .detail.is-full .frame[data-viewport="mobile"]{height:min(844px,calc(100% - 24px))}
    @media(max-width:1080px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.detail-bar{gap:8px}.tool{padding:0 9px}.tool-label{display:none}}
    @media(max-width:760px){
      .shell{width:min(100% - 32px,1280px)}.home-header{padding-top:36px}.home-intro{grid-template-columns:1fr}.home-rule{justify-content:flex-start}.grid{grid-template-columns:1fr;gap:16px;padding-top:24px}
      .detail{grid-template-columns:1fr}.sidebar{position:fixed;inset:0 auto 0 0;width:min(88vw,var(--sidebar));transform:translateX(-105%);transition:transform .22s}.detail.drawer-open .sidebar{transform:none}.detail.drawer-open .scrim{display:block}
      .drawer-button{display:inline-grid;place-items:center}.detail-bar{padding-inline:10px}.desktop-only{display:none}.current small{display:none}
      .frame[data-viewport="mobile"]{height:min(844px,calc(100% - 16px));border-width:6px;border-radius:26px}
    }
    @media(max-width:420px){.detail-bar{gap:6px}.tool{min-width:36px;padding:0 8px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="home" data-home>
    <header class="home-header">
      <div class="shell">
        <p class="home-kicker">CODEX / THEME WORLD ARCHIVE</p>
        <h1 class="home-title">主题世界图集</h1>
        <div class="home-intro">
          <p>二十一套自包含的界面世界。每张卡片都在实时运行；选择一套进入桌面或移动视口，逐件试用它的控件与招牌装置。</p>
          <span class="home-rule">向下浏览全部主题</span>
        </div>
      </div>
    </header>
    <section class="shell grid" aria-label="主题图集" data-grid></section>
  </main>

  <section class="detail" aria-label="主题详情" data-detail hidden>
    <aside class="sidebar">
      <button class="back" type="button" data-back>全部主题</button>
      <div class="search-wrap">
        <label class="search-label" for="theme-search">搜索 · 快捷键 /</label>
        <input class="search" id="theme-search" type="search" autocomplete="off" placeholder="代号、中文名、theme-id">
      </div>
      <ul class="theme-list" data-list></ul>
      <p class="sidebar-foot">← → 切换 · Esc 后退 · / 搜索</p>
    </aside>
    <div class="scrim" data-scrim></div>
    <div class="detail-main">
      <header class="detail-bar">
        <button class="drawer-button" type="button" aria-label="打开主题目录" aria-expanded="false" data-drawer>☰</button>
        <div class="current"><strong data-current-title></strong><small data-current-subtitle></small></div>
        <div class="tool-group desktop-only" aria-label="切换主题">
          <button class="tool" type="button" aria-label="上一主题" data-prev>←</button>
          <button class="tool" type="button" aria-label="下一主题" data-next>→</button>
        </div>
        <div class="tool-group" aria-label="预览视口">
          <button class="tool" type="button" data-viewport="pc" aria-pressed="true">PC</button>
          <button class="tool" type="button" data-viewport="mobile" aria-pressed="false">Mobile</button>
        </div>
        <button class="tool" type="button" aria-label="全屏预览" data-fullscreen><span class="tool-label">全屏</span><span aria-hidden="true"> ↗</span></button>
        <button class="tool" type="button" aria-label="Open 新窗打开" data-open><span class="tool-label">Open</span><span aria-hidden="true"> ↗</span></button>
      </header>
      <div class="preview">
        <div class="loading" data-loading>LOADING THEME</div>
        <div class="frame" data-frame data-viewport="pc"><iframe title="主题预览" data-preview></iframe></div>
      </div>
    </div>
  </section>

  <script>
    (() => {
      "use strict";
      const THEMES = [
        {id:"nova",code:"NOVA",name:"科幻霓虹 HUD / Sci-fi neon"},
        {id:"abyss",code:"ABYSS",name:"克苏鲁深渊魔典 / Eldritch grimoire"},
        {id:"brass",code:"BRASS",name:"蒸汽朋克 / Steampunk"},
        {id:"prism",code:"PRISM",name:"包豪斯构成 / Bauhaus"},
        {id:"riot",code:"RIOT",name:"朋克剪报 / Punk zine"},
        {id:"hanabi",code:"HANABI",name:"二次元赛璐璐 / Anime cel"},
        {id:"sumi",code:"SUMI",name:"水墨禅 / Zen ink"},
        {id:"ormolu",code:"ORMOLU",name:"洛可可宫廷 / Rococo"},
        {id:"nocturne",code:"NOCTURNE",name:"暗夜花园 / Dark botanical"},
        {id:"pulp",code:"PULP",name:"复古廉价小说 / Pulp paperback"},
        {id:"totem",code:"TOTEM",name:"民艺图腾 / Folk craft"},
        {id:"kiln",code:"KILN",name:"陶土侘寂 / Wabi-sabi"},
        {id:"chrome",code:"CHROME",name:"千禧液态铬 / Y2K aero"},
        {id:"arcade",code:"ARCADE",name:"8-bit 街机 / Retro arcade"},
        {id:"bitmap",code:"BITMAP",name:"1-bit 位图 / One-bit dither"},
        {id:"mochi",code:"MOCHI",name:"软陶泡芙 / Claymorphic squish"},
        {id:"scribble",code:"SCRIBBLE",name:"手账涂鸦 / Notebook doodle"},
        {id:"axon",code:"AXON",name:"轴测蓝图 / Isometric blueprint"},
        {id:"corona",code:"CORONA",name:"日蚀玻璃 / Eclipse glass"},
        {id:"reliquary",code:"RELIQUARY",name:"未来圣骸 / Future reliquary"},
        {id:"gazette",code:"GAZETTE",name:"报章排印 / Broadsheet"},
      ];
      const home = document.querySelector("[data-home]");
      const grid = document.querySelector("[data-grid]");
      const detail = document.querySelector("[data-detail]");
      const sidebar = document.querySelector(".sidebar");
      const list = document.querySelector("[data-list]");
      const search = document.querySelector("#theme-search");
      const preview = document.querySelector("[data-preview]");
      const frame = document.querySelector("[data-frame]");
      const loading = document.querySelector("[data-loading]");
      const currentTitle = document.querySelector("[data-current-title]");
      const currentSubtitle = document.querySelector("[data-current-subtitle]");
      const drawerButton = document.querySelector("[data-drawer]");
      const mobileLayout = window.matchMedia("(max-width: 760px)");
      let currentIndex = -1;
      let viewport = "pc";
      let activeThumbs = 0;
      const thumbQueue = [];
      const maxThumbs = 5;

      try {
        viewport = localStorage.getItem("codex-atlas-viewport") === "mobile" ? "mobile" : "pc";
      } catch {
        viewport = "pc";
      }

      const make = (tag, className, text) => {
        const element = document.createElement(tag);
        if (className) element.className = className;
        if (text !== undefined) element.textContent = text;
        return element;
      };

      const resizeThumb = (thumb) => {
        const iframe = thumb.querySelector("iframe");
        if (!iframe) return;
        iframe.style.transform = "scale(" + String(thumb.clientWidth / 1280) + ")";
      };

      const loadNextThumbs = () => {
        while (activeThumbs < maxThumbs && thumbQueue.length) {
          const thumb = thumbQueue.shift();
          if (!thumb || thumb.dataset.loaded === "true") continue;
          thumb.dataset.loaded = "true";
          activeThumbs += 1;
          const iframe = thumb.querySelector("iframe");
          iframe.addEventListener("load", () => {
            thumb.classList.add("is-loaded");
            activeThumbs -= 1;
            loadNextThumbs();
          }, { once: true });
          iframe.src = iframe.dataset.src;
          resizeThumb(thumb);
        }
      };

      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting && entry.target.dataset.loaded !== "true" && !thumbQueue.includes(entry.target)) {
            thumbQueue.push(entry.target);
            observer.unobserve(entry.target);
          }
        });
        loadNextThumbs();
      }, { rootMargin: "0px", threshold: 0.01 });

      THEMES.forEach((theme, index) => {
        const card = make("article", "card");
        const thumb = make("div", "thumb");
        const iframe = document.createElement("iframe");
        iframe.dataset.src = theme.id + ".html";
        iframe.loading = "lazy";
        iframe.tabIndex = -1;
        iframe.title = theme.code + " 实时缩略图";
        thumb.append(iframe);

        const body = make("div", "card-body");
        const indexRow = make("div", "card-index");
        indexRow.append(make("b", "", String(index + 1).padStart(2, "0")), make("span", "meta", theme.code));
        const heading = make("h2", "", theme.name.split(" / ")[0]);
        const sub = make("p", "", theme.name.split(" / ")[1]);
        body.append(indexRow, heading, sub);

        const link = make("a", "card-link");
        link.href = "#" + theme.id;
        link.append(make("span", "", "打开 " + theme.code + " " + theme.name));
        card.append(thumb, body, link);
        grid.append(card);
        observer.observe(thumb);
      });

      const renderList = () => {
        const query = search.value.trim().toLocaleLowerCase();
        list.replaceChildren();
        const matches = THEMES.map((theme, index) => ({ theme, index })).filter(({ theme }) => {
          const haystack = (theme.code + " " + theme.name + " " + theme.id).toLocaleLowerCase();
          return !query || haystack.includes(query);
        });
        if (!matches.length) {
          const emptyItem = make("li", "empty", "没有命中的主题。");
          list.append(emptyItem);
          return matches;
        }
        matches.forEach(({ theme, index }) => {
          const item = make("li");
          const button = make("button");
          button.type = "button";
          button.dataset.index = String(index);
          button.setAttribute("aria-current", String(index === currentIndex));
          const number = make("span", "list-number", String(index + 1).padStart(2, "0"));
          const copy = make("span", "list-copy");
          copy.append(make("strong", "", theme.code), make("small", "", theme.name.split(" / ")[0]));
          button.append(number, copy);
          button.addEventListener("click", () => showTheme(index));
          item.append(button);
          list.append(item);
        });
        return matches;
      };

      const setViewport = (next) => {
        viewport = next === "mobile" ? "mobile" : "pc";
        frame.dataset.viewport = viewport;
        document.querySelectorAll("[data-viewport]").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.viewport === viewport)));
        try {
          localStorage.setItem("codex-atlas-viewport", viewport);
        } catch {
          /* The atlas remains usable without persistence. */
        }
      };

      const syncDrawerA11y = () => {
        const hidden = mobileLayout.matches && !detail.classList.contains("drawer-open");
        sidebar.inert = hidden;
        if (hidden) sidebar.setAttribute("aria-hidden", "true");
        else sidebar.removeAttribute("aria-hidden");
      };

      const closeDrawer = () => {
        detail.classList.remove("drawer-open");
        drawerButton.setAttribute("aria-expanded", "false");
        syncDrawerA11y();
      };

      const showTheme = (index, replaceHash = false) => {
        currentIndex = (index + THEMES.length) % THEMES.length;
        const theme = THEMES[currentIndex];
        home.hidden = true;
        detail.hidden = false;
        closeDrawer();
        loading.hidden = false;
        preview.style.visibility = "hidden";
        preview.src = theme.id + ".html";
        currentTitle.textContent = String(currentIndex + 1).padStart(2, "0") + " / " + theme.code;
        currentSubtitle.textContent = theme.name;
        renderList();
        const nextHash = "#" + theme.id;
        if (location.hash !== nextHash) {
          if (replaceHash) history.replaceState(null, "", nextHash);
          else history.pushState(null, "", nextHash);
        }
      };

      const showHome = (replaceHash = false) => {
        currentIndex = -1;
        detail.hidden = true;
        detail.classList.remove("is-full", "drawer-open");
        home.hidden = false;
        preview.removeAttribute("src");
        syncDrawerA11y();
        if (location.hash) {
          if (replaceHash) history.replaceState(null, "", location.pathname + location.search);
          else history.pushState(null, "", location.pathname + location.search);
        }
        requestAnimationFrame(() => document.querySelectorAll(".thumb").forEach(resizeThumb));
      };

      const moveTheme = (delta) => {
        if (currentIndex >= 0) showTheme(currentIndex + delta);
      };

      preview.addEventListener("load", () => {
        loading.hidden = true;
        preview.style.visibility = "visible";
      });
      window.addEventListener("resize", () => document.querySelectorAll(".thumb.is-loaded").forEach(resizeThumb));
      window.addEventListener("hashchange", () => {
        const id = location.hash.slice(1);
        const index = THEMES.findIndex((theme) => theme.id === id);
        if (index >= 0) showTheme(index, true);
        else showHome(true);
      });
      document.querySelector("[data-back]").addEventListener("click", () => showHome());
      document.querySelector("[data-scrim]").addEventListener("click", closeDrawer);
      drawerButton.addEventListener("click", () => {
        const open = !detail.classList.contains("drawer-open");
        detail.classList.toggle("drawer-open", open);
        drawerButton.setAttribute("aria-expanded", String(open));
        syncDrawerA11y();
      });
      mobileLayout.addEventListener("change", syncDrawerA11y);
      document.querySelectorAll("[data-prev]").forEach((button) => button.addEventListener("click", () => moveTheme(-1)));
      document.querySelectorAll("[data-next]").forEach((button) => button.addEventListener("click", () => moveTheme(1)));
      document.querySelectorAll("[data-viewport]").forEach((button) => button.addEventListener("click", () => setViewport(button.dataset.viewport)));
      document.querySelector("[data-open]").addEventListener("click", () => {
        if (currentIndex >= 0) window.open(THEMES[currentIndex].id + ".html", "_blank", "noopener");
      });
      document.querySelector("[data-fullscreen]").addEventListener("click", () => detail.classList.add("is-full"));
      search.addEventListener("input", renderList);
      search.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          const first = list.querySelector("button[data-index]");
          if (first) showTheme(Number(first.dataset.index));
        } else if (event.key === "Escape") {
          event.stopPropagation();
          if (search.value) {
            search.value = "";
            renderList();
          } else {
            search.blur();
          }
        }
      });
      document.addEventListener("keydown", (event) => {
        const inputFocused = document.activeElement === search;
        if (event.key === "/" && !inputFocused && currentIndex >= 0) {
          if (detail.classList.contains("is-full")) return;
          event.preventDefault();
          if (mobileLayout.matches) {
            detail.classList.add("drawer-open");
            drawerButton.setAttribute("aria-expanded", "true");
            syncDrawerA11y();
          }
          search.focus();
          return;
        }
        if (inputFocused) return;
        if (event.key === "ArrowLeft" && currentIndex >= 0) {
          event.preventDefault();
          moveTheme(-1);
        } else if (event.key === "ArrowRight" && currentIndex >= 0) {
          event.preventDefault();
          moveTheme(1);
        } else if (event.key === "Escape" && currentIndex >= 0) {
          event.preventDefault();
          if (detail.classList.contains("is-full")) detail.classList.remove("is-full");
          else if (detail.classList.contains("drawer-open")) closeDrawer();
          else showHome();
        }
      });

      setViewport(viewport);
      const initialIndex = THEMES.findIndex((theme) => theme.id === location.hash.slice(1));
      if (initialIndex >= 0) showTheme(initialIndex, true);
      else showHome(true);
    })();
  </script>
</body>
</html>
