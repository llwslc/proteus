<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#06110e">
  <title>The Abyssal Archive — Consult the Eye</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&amp;family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,500&amp;family=IM+Fell+English+SC&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --void: #06110e;
      --void-soft: #091914;
      --slate: #102a23;
      --slate-deep: #0a1d18;
      --slate-high: #17372f;
      --tide: #37d8c8;
      --tide-bright: #83f4e7;
      --tide-dim: #1b8e83;
      --parchment: #f0deb3;
      --parchment-muted: #c9b88f;
      --amber: #e4a94d;
      --amber-bright: #ffd27f;
      --ink: #020a08;
      --danger: #e18d66;
      --line: rgba(94, 224, 207, 0.31);
      --line-warm: rgba(228, 169, 77, 0.36);
      --shadow: 0 24px 64px rgba(0, 0, 0, 0.48);
      --serif-display: "Cinzel Decorative", "Times New Roman", serif;
      --serif-body: "EB Garamond", Georgia, serif;
      --ink-hand: "IM Fell English SC", Georgia, serif;
      --page-gutter: max(24px, calc((100% - 1180px) / 2));
      --panel-radius: 22px 17px 25px 15px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background: var(--void);
    }

    body {
      margin: 0;
      min-width: 0;
      overflow-x: clip;
      color: var(--parchment);
      background:
        radial-gradient(circle at 50% -12%, rgba(29, 147, 135, 0.22), transparent 35rem),
        radial-gradient(circle at 8% 30%, rgba(28, 112, 95, 0.09), transparent 24rem),
        radial-gradient(circle at 94% 66%, rgba(212, 151, 57, 0.055), transparent 27rem),
        linear-gradient(180deg, #071511 0%, var(--void) 38%, #030c0a 100%);
      font-family: var(--serif-body);
      font-size: 18px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      content: "";
      opacity: 0.3;
      background-image:
        repeating-linear-gradient(91deg, transparent 0 23px, rgba(102, 214, 193, 0.022) 24px 25px),
        repeating-linear-gradient(3deg, transparent 0 31px, rgba(239, 220, 176, 0.018) 32px 33px);
      mask-image: radial-gradient(circle at center, black, transparent 88%);
    }

    body::after {
      position: fixed;
      inset: 0;
      z-index: 30;
      pointer-events: none;
      content: "";
      box-shadow: inset 0 0 150px rgba(0, 0, 0, 0.9);
    }

    button,
    input {
      font: inherit;
    }

    button,
    input,
    [role="option"],
    [role="tab"] {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      color: inherit;
    }

    :focus-visible {
      outline: 3px solid var(--amber-bright);
      outline-offset: 4px;
    }

    ::selection {
      color: var(--ink);
      background: var(--tide-bright);
    }

    [hidden] {
      display: none !important;
    }

    [data-copy]:empty::before {
      content: attr(data-copy);
    }

    .status-listening[data-copy]:empty::before,
    .eyebrow[data-copy]:empty::before,
    .omen-line[data-copy]:empty::before {
      width: auto;
      height: auto;
      flex: initial;
      border-radius: 0;
      color: inherit;
      content: attr(data-copy);
      background: none;
      box-shadow: none;
      animation: none;
    }

    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    .status-bar {
      position: relative;
      z-index: 20;
      width: 100%;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(90deg, rgba(55, 216, 200, 0.05), transparent 28% 72%, rgba(228, 169, 77, 0.05)),
        rgba(3, 13, 10, 0.88);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.28);
    }

    .status-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      max-width: 1180px;
      min-height: 46px;
      margin: 0 auto;
      padding: 8px 24px;
      color: var(--parchment-muted);
      font-family: var(--ink-hand);
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .status-listening {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--tide-bright);
      text-align: right;
    }

    .status-listening::before {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--tide);
      box-shadow: 0 0 0 4px rgba(55, 216, 200, 0.1), 0 0 16px var(--tide);
      content: "";
      animation: listeningPulse 3.4s ease-in-out infinite;
    }

    .page-shell {
      position: relative;
      overflow: clip;
      isolation: isolate;
    }

    .page-shell::before,
    .page-shell::after {
      position: absolute;
      z-index: -1;
      width: 360px;
      height: 620px;
      border-radius: 50%;
      pointer-events: none;
      content: "";
      filter: blur(72px);
      opacity: 0.08;
      background: var(--tide);
    }

    .page-shell::before {
      top: 14rem;
      left: -280px;
    }

    .page-shell::after {
      top: 65rem;
      right: -300px;
    }

    .hero,
    .controls,
    .closing-inner {
      width: min(1180px, calc(100% - 48px));
      margin-inline: auto;
    }

    .hero {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(360px, 0.78fr);
      gap: clamp(40px, 7vw, 88px);
      align-items: center;
      min-height: calc(100svh - 46px);
      padding-block: 76px 84px;
    }

    .hero::after {
      position: absolute;
      right: 46%;
      bottom: 10%;
      width: 1px;
      height: 80%;
      pointer-events: none;
      content: "";
      background: linear-gradient(transparent, var(--line), transparent);
      opacity: 0.72;
    }

    .hero-copy {
      position: relative;
      z-index: 2;
    }

    .eyebrow,
    .chapter-kicker,
    .control-label,
    .field-label,
    .dial-caption {
      margin: 0;
      color: var(--amber-bright);
      font-family: var(--ink-hand);
      font-size: 0.77rem;
      line-height: 1.3;
      letter-spacing: 0.17em;
      text-transform: uppercase;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .eyebrow::before,
    .eyebrow::after {
      width: 34px;
      height: 1px;
      content: "";
      background: var(--amber);
      box-shadow: 0 0 9px rgba(228, 169, 77, 0.35);
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      max-width: 760px;
      margin-bottom: 24px;
      color: var(--parchment);
      font-family: var(--serif-display);
      font-size: clamp(3.2rem, 7.2vw, 6.75rem);
      font-weight: 900;
      line-height: 0.92;
      letter-spacing: -0.055em;
      text-wrap: balance;
      text-shadow:
        0 2px 0 rgba(0, 0, 0, 0.7),
        0 0 30px rgba(55, 216, 200, 0.08);
    }

    h1 .tide-word {
      display: block;
      color: var(--tide-bright);
      font-style: italic;
      text-shadow: 0 0 24px rgba(55, 216, 200, 0.28);
    }

    .hero-deck {
      max-width: 650px;
      margin-bottom: 32px;
      color: var(--parchment-muted);
      font-size: clamp(1.08rem, 2vw, 1.3rem);
      line-height: 1.56;
      text-wrap: pretty;
    }

    .hero-actions,
    .button-coven,
    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
    }

    .omen-line {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      min-height: 30px;
      margin: 28px 0 0;
      color: var(--tide-bright);
      font-style: italic;
      font-size: 0.98rem;
    }

    .omen-line::before {
      flex: 0 0 auto;
      color: var(--amber);
      content: "✦";
      font-style: normal;
    }

    .btn {
      position: relative;
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 12px 20px;
      border: 1px solid transparent;
      border-radius: 12px 8px 14px 7px;
      overflow: hidden;
      cursor: pointer;
      font-family: var(--ink-hand);
      font-size: 0.79rem;
      line-height: 1.1;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition:
        color 180ms ease,
        border-color 180ms ease,
        background-color 180ms ease,
        box-shadow 180ms ease,
        transform 120ms ease;
    }

    .btn::after {
      position: absolute;
      inset: 4px;
      border: 1px solid currentColor;
      border-radius: inherit;
      pointer-events: none;
      content: "";
      opacity: 0.17;
      transform: rotate(-0.4deg);
    }

    .btn:not(:disabled):active {
      transform: translateY(2px) scale(0.985);
    }

    .btn--tide {
      color: #02110e;
      border-color: var(--tide-bright);
      background:
        radial-gradient(circle at 20% 0%, #9af8ed, transparent 42%),
        var(--tide);
      box-shadow:
        0 0 0 1px rgba(55, 216, 200, 0.17),
        0 8px 24px rgba(12, 161, 146, 0.19),
        inset 0 -5px 10px rgba(0, 63, 56, 0.19);
    }

    .btn--parchment {
      color: #14211b;
      border-color: #f5e3b9;
      background:
        linear-gradient(97deg, transparent 0 4%, rgba(72, 45, 15, 0.08) 5% 7%, transparent 8%),
        var(--parchment);
      box-shadow: inset 0 0 20px rgba(102, 62, 17, 0.13);
    }

    .btn--amber {
      color: var(--amber-bright);
      border-color: var(--amber);
      background: rgba(112, 70, 17, 0.12);
      box-shadow: inset 0 0 16px rgba(228, 169, 77, 0.07);
    }

    .btn--bare {
      min-height: 44px;
      padding-inline: 8px;
      color: var(--parchment);
      border-color: transparent;
      border-bottom-color: rgba(240, 222, 179, 0.45);
      border-radius: 0;
      background: transparent;
    }

    .btn--bare::after {
      display: none;
    }

    .btn--seal {
      width: 88px;
      min-height: 88px;
      padding: 14px;
      color: var(--amber-bright);
      border: 1px solid var(--amber);
      border-radius: 48% 52% 46% 54%;
      background:
        radial-gradient(circle, rgba(228, 169, 77, 0.18), transparent 62%),
        #172219;
      line-height: 1.16;
      text-align: center;
      box-shadow: inset 0 0 0 5px #0d1712, inset 0 0 0 6px rgba(228, 169, 77, 0.44);
      transform: rotate(-2deg);
    }

    .btn--seal:active {
      transform: rotate(-2deg) translateY(2px) scale(0.98) !important;
    }

    .btn:disabled {
      color: #79857c;
      border-color: #46564e;
      cursor: not-allowed;
      background:
        repeating-linear-gradient(135deg, transparent 0 7px, rgba(205, 222, 211, 0.035) 8px 9px),
        #13201b;
      box-shadow: none;
      filter: saturate(0.25);
      opacity: 0.62;
    }

    .sigil-stage {
      position: relative;
      display: grid;
      width: min(100%, 460px);
      aspect-ratio: 1;
      place-items: center;
      justify-self: center;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      color: inherit;
      background:
        radial-gradient(circle at center, rgba(55, 216, 200, 0.16) 0 8%, transparent 9% 24%, rgba(55, 216, 200, 0.08) 25%, transparent 54%),
        radial-gradient(circle, rgba(17, 67, 56, 0.55), rgba(2, 12, 9, 0.08) 66%, transparent 67%);
      filter: drop-shadow(0 0 34px rgba(55, 216, 200, 0.12));
      animation: abyssBreath 5.8s ease-in-out infinite;
    }

    .sigil-stage::before,
    .sigil-stage::after {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      content: "";
    }

    .sigil-stage::before {
      inset: 7%;
      border: 1px solid rgba(55, 216, 200, 0.56);
      box-shadow:
        inset 0 0 28px rgba(55, 216, 200, 0.08),
        0 0 18px rgba(55, 216, 200, 0.1);
      clip-path: polygon(0 0, 46% 0, 50% 5%, 54% 0, 100% 0, 100% 46%, 95% 50%, 100% 54%, 100% 100%, 54% 100%, 50% 95%, 46% 100%, 0 100%, 0 54%, 5% 50%, 0 46%);
      animation: sigilTurn 34s linear infinite;
    }

    .sigil-stage::after {
      inset: 18%;
      border: 1px dashed rgba(228, 169, 77, 0.42);
      box-shadow: 0 0 10px rgba(228, 169, 77, 0.07);
      animation: sigilTurnReverse 50s linear infinite;
    }

    .rune {
      position: absolute;
      z-index: 2;
      color: var(--amber);
      font-family: var(--serif-display);
      font-size: 1.15rem;
      text-shadow: 0 0 12px rgba(228, 169, 77, 0.5);
    }

    .rune--north {
      top: 2.5%;
    }

    .rune--east {
      right: 4%;
      transform: rotate(90deg);
    }

    .rune--south {
      bottom: 2.5%;
      transform: rotate(180deg);
    }

    .rune--west {
      left: 4%;
      transform: rotate(-90deg);
    }

    .eye {
      position: relative;
      z-index: 4;
      display: grid;
      width: 45%;
      aspect-ratio: 1;
      place-items: center;
      border: 2px solid var(--tide-bright);
      border-radius: 100% 8% 100% 8%;
      background:
        radial-gradient(circle at 38% 30%, rgba(255, 255, 255, 0.16), transparent 11%),
        radial-gradient(circle, #b7f6df 0 7%, #27a99b 8% 27%, #0b554d 28% 43%, #071814 44% 55%, transparent 56%),
        linear-gradient(145deg, rgba(218, 238, 215, 0.28), rgba(14, 83, 71, 0.3)),
        var(--slate-high);
      box-shadow:
        0 0 0 8px rgba(5, 24, 19, 0.92),
        0 0 0 10px rgba(55, 216, 200, 0.26),
        0 0 44px rgba(55, 216, 200, 0.48),
        inset 0 0 32px rgba(1, 10, 7, 0.88);
      transform: rotate(45deg) scaleY(1);
      transition: transform 360ms cubic-bezier(0.65, 0, 0.35, 1);
    }

    .eye::before {
      width: 18%;
      height: 54%;
      border-radius: 50%;
      content: "";
      background: #010503;
      box-shadow: 0 0 10px #020806;
      transform: rotate(-45deg);
      transition: height 240ms ease;
    }

    .eye::after {
      position: absolute;
      width: 5%;
      height: 18%;
      border-radius: 50%;
      content: "";
      background: rgba(240, 255, 239, 0.87);
      transform: translate(-190%, -50%) rotate(-45deg);
      filter: blur(0.2px);
    }

    .sigil-stage.is-blinking .eye {
      transform: rotate(45deg) scaleY(0.055);
    }

    .sigil-caption {
      position: absolute;
      bottom: 13%;
      z-index: 5;
      color: var(--parchment-muted);
      font-family: var(--ink-hand);
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .controls {
      padding-block: 46px 120px;
    }

    .section-intro {
      position: relative;
      max-width: 760px;
      margin: 0 auto 66px;
      text-align: center;
    }

    .section-intro::before {
      display: block;
      width: 92px;
      height: 32px;
      margin: 0 auto 20px;
      content: "";
      background:
        radial-gradient(circle, var(--amber) 0 3px, transparent 4px),
        linear-gradient(90deg, transparent, var(--line-warm) 35% 65%, transparent) center / 100% 1px no-repeat;
    }

    .section-intro h2,
    .chapter-heading h2 {
      color: var(--parchment);
      font-family: var(--serif-display);
      text-wrap: balance;
    }

    .section-intro h2 {
      margin-bottom: 16px;
      font-size: clamp(2rem, 4.8vw, 4.1rem);
      line-height: 1.06;
    }

    .section-intro p {
      margin-bottom: 0;
      color: var(--parchment-muted);
      font-size: 1.12rem;
    }

    .chapter {
      position: relative;
      margin-top: 84px;
    }

    .chapter + .chapter {
      padding-top: 84px;
      border-top: 1px solid rgba(55, 216, 200, 0.18);
    }

    .chapter + .chapter::before {
      position: absolute;
      top: -7px;
      left: 50%;
      width: 13px;
      height: 13px;
      border: 1px solid var(--amber);
      content: "";
      background: var(--void);
      transform: translateX(-50%) rotate(45deg);
      box-shadow: 0 0 15px rgba(228, 169, 77, 0.2);
    }

    .chapter-heading {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 22px;
      align-items: start;
      margin-bottom: 30px;
    }

    .folio-number {
      display: grid;
      width: 54px;
      height: 54px;
      place-items: center;
      border: 1px solid var(--line-warm);
      border-radius: 52% 48% 46% 54%;
      color: var(--amber-bright);
      font-family: var(--serif-display);
      font-size: 0.87rem;
      background: rgba(228, 169, 77, 0.045);
      transform: rotate(-3deg);
    }

    .chapter-kicker {
      margin-bottom: 6px;
    }

    .chapter-heading h2 {
      margin-bottom: 0;
      font-size: clamp(1.55rem, 3.3vw, 2.65rem);
      line-height: 1.12;
    }

    .chapter-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      align-items: stretch;
    }

    .slate-panel {
      position: relative;
      min-width: 0;
      padding: clamp(22px, 3.2vw, 34px);
      border: 1px solid rgba(83, 190, 173, 0.26);
      border-radius: var(--panel-radius);
      isolation: isolate;
      overflow: visible;
      background:
        radial-gradient(ellipse at 12% 0%, rgba(109, 189, 165, 0.09), transparent 35%),
        radial-gradient(circle at 92% 100%, rgba(0, 0, 0, 0.32), transparent 38%),
        repeating-linear-gradient(173deg, transparent 0 17px, rgba(198, 229, 211, 0.015) 18px 19px),
        linear-gradient(140deg, rgba(22, 58, 49, 0.92), rgba(9, 27, 22, 0.96));
      box-shadow:
        var(--shadow),
        inset 0 1px rgba(255, 255, 255, 0.035),
        inset 0 -18px 34px rgba(0, 0, 0, 0.17);
    }

    .slate-panel::before {
      position: absolute;
      inset: 5px 7px 7px 5px;
      z-index: -1;
      border: 1px solid rgba(122, 229, 209, 0.1);
      border-radius: 18px 14px 21px 11px;
      pointer-events: none;
      content: "";
      transform: rotate(0.13deg);
    }

    .slate-panel::after {
      position: absolute;
      top: -1px;
      left: 12%;
      width: 34%;
      height: 5px;
      border-radius: 50%;
      pointer-events: none;
      content: "";
      opacity: 0.6;
      background: rgba(55, 216, 200, 0.17);
      box-shadow: 0 3px 9px rgba(55, 216, 200, 0.25);
      filter: blur(1.3px);
      animation: inkSeep 8s ease-in-out infinite alternate;
    }

    .slate-panel--wide {
      grid-column: 1 / -1;
    }

    .control-label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
      color: var(--tide-bright);
    }

    .control-label::after {
      height: 1px;
      flex: 1 1 auto;
      content: "";
      opacity: 0.45;
      background: linear-gradient(90deg, var(--tide-dim), transparent);
    }

    .panel-note {
      margin: -8px 0 24px;
      color: var(--parchment-muted);
      font-size: 0.96rem;
    }

    .field-stack {
      display: grid;
      gap: 22px;
    }

    .text-field {
      position: relative;
      display: grid;
      gap: 9px;
    }

    .field-label {
      color: var(--parchment);
      letter-spacing: 0.1em;
    }

    .ink-input {
      width: 100%;
      min-height: 52px;
      padding: 12px 52px 12px 15px;
      border: 0;
      border-bottom: 2px solid var(--tide-dim);
      border-radius: 8px 13px 3px 5px;
      color: var(--parchment);
      caret-color: var(--amber-bright);
      background:
        linear-gradient(90deg, rgba(55, 216, 200, 0.06), transparent),
        rgba(1, 12, 9, 0.68);
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.35);
      transition: border-color 180ms ease, box-shadow 180ms ease, background-color 180ms ease;
    }

    .ink-input::placeholder {
      color: #9aab9e;
      opacity: 1;
      font-style: italic;
    }

    .ink-input:focus {
      border-color: var(--tide-bright);
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.35), 0 6px 20px rgba(55, 216, 200, 0.08);
      background-color: rgba(55, 216, 200, 0.035);
    }

    .input-eye {
      position: absolute;
      right: 16px;
      bottom: 17px;
      width: 24px;
      height: 14px;
      border: 1px solid var(--tide);
      border-radius: 90% 5%;
      pointer-events: none;
      transform: rotate(45deg);
    }

    .input-eye::after {
      position: absolute;
      inset: 4px 8px;
      border-radius: 50%;
      content: "";
      background: var(--amber);
    }

    fieldset {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    legend {
      margin-bottom: 13px;
      padding: 0;
    }

    .choice-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .choice {
      position: relative;
      display: grid;
      min-width: 0;
      min-height: 74px;
      grid-template-columns: 25px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      padding: 12px;
      border: 1px solid rgba(201, 184, 143, 0.24);
      border-radius: 12px 8px 14px 7px;
      cursor: pointer;
      background: rgba(2, 12, 9, 0.35);
      transition: border-color 180ms ease, background-color 180ms ease, transform 150ms ease;
    }

    .choice:has(input:checked) {
      border-color: var(--tide);
      background: rgba(55, 216, 200, 0.085);
      box-shadow: inset 0 0 16px rgba(55, 216, 200, 0.04);
    }

    .choice input {
      position: relative;
      display: grid;
      width: 24px;
      height: 16px;
      appearance: none;
      place-items: center;
      border: 1px solid var(--parchment-muted);
      border-radius: 90% 5%;
      cursor: pointer;
      background: #06130f;
      transform: rotate(45deg);
    }

    .choice input::after {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      content: "";
      background: var(--tide-bright);
      box-shadow: 0 0 8px var(--tide);
      transform: scale(0);
      transition: transform 150ms ease;
    }

    .choice input:checked::after {
      transform: scale(1);
    }

    .choice span {
      min-width: 0;
      line-height: 1.15;
    }

    .binary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .check-row,
    .switch-row {
      display: flex;
      min-height: 70px;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 13px 15px;
      border: 1px solid rgba(201, 184, 143, 0.2);
      border-radius: 9px 14px 8px 13px;
      background: rgba(2, 12, 9, 0.33);
    }

    .check-row {
      cursor: pointer;
    }

    .check-row input {
      display: grid;
      width: 25px;
      height: 25px;
      flex: 0 0 auto;
      appearance: none;
      place-items: center;
      border: 1px solid var(--amber);
      cursor: pointer;
      background: #071510;
      transform: rotate(45deg);
      box-shadow: inset 0 0 0 4px #071510;
    }

    .check-row input::after {
      width: 11px;
      height: 11px;
      content: "";
      background: var(--amber-bright);
      clip-path: polygon(0 47%, 36% 74%, 100% 0, 100% 33%, 39% 100%, 0 70%);
      opacity: 0;
      transform: rotate(-45deg) scale(0.2);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .check-row input:checked {
      background: rgba(228, 169, 77, 0.23);
      box-shadow: 0 0 16px rgba(228, 169, 77, 0.17);
    }

    .check-row input:checked::after {
      opacity: 1;
      transform: rotate(-45deg) scale(1);
    }

    .switch-copy {
      min-width: 0;
    }

    .switch-state {
      display: block;
      margin-top: 3px;
      color: var(--parchment-muted);
      font-size: 0.82rem;
      font-style: italic;
    }

    .eye-switch {
      position: relative;
      display: grid;
      width: 64px;
      height: 39px;
      flex: 0 0 auto;
      appearance: none;
      place-items: center;
      border: 1px solid #65776c;
      border-radius: 100% 8%;
      cursor: pointer;
      background: #06120e;
      transform: rotate(0deg);
      transition: border-color 200ms ease, box-shadow 200ms ease, transform 200ms ease;
    }

    .eye-switch::before {
      width: 13px;
      height: 5px;
      border-radius: 50%;
      content: "";
      background: #6b796f;
      transition: height 220ms ease, width 220ms ease, background-color 220ms ease, box-shadow 220ms ease;
    }

    .eye-switch[aria-checked="true"] {
      border-color: var(--tide);
      background: radial-gradient(circle, rgba(55, 216, 200, 0.12), transparent 66%), #071713;
      box-shadow: 0 0 17px rgba(55, 216, 200, 0.2);
    }

    .eye-switch[aria-checked="true"]::before {
      width: 13px;
      height: 25px;
      background: var(--tide-bright);
      box-shadow: 0 0 12px var(--tide);
    }

    .range-wrap {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: end;
    }

    .range-main {
      min-width: 0;
    }

    .range-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 13px;
    }

    .range-value {
      color: var(--tide-bright);
      font-family: var(--serif-display);
      font-size: 1.25rem;
    }

    .depth-range {
      width: 100%;
      height: 30px;
      margin: 0;
      appearance: none;
      cursor: pointer;
      background: transparent;
    }

    .depth-range::-webkit-slider-runnable-track {
      height: 7px;
      border: 1px solid rgba(55, 216, 200, 0.42);
      border-radius: 30% 70% 40% 60%;
      background:
        repeating-linear-gradient(90deg, transparent 0 8%, rgba(240, 222, 179, 0.16) 8.5% 9%),
        linear-gradient(90deg, var(--tide-dim), rgba(7, 25, 20, 0.82));
      box-shadow: inset 0 1px 4px #000;
    }

    .depth-range::-moz-range-track {
      height: 7px;
      border: 1px solid rgba(55, 216, 200, 0.42);
      border-radius: 30% 70% 40% 60%;
      background:
        repeating-linear-gradient(90deg, transparent 0 8%, rgba(240, 222, 179, 0.16) 8.5% 9%),
        linear-gradient(90deg, var(--tide-dim), rgba(7, 25, 20, 0.82));
      box-shadow: inset 0 1px 4px #000;
    }

    .depth-range::-webkit-slider-thumb {
      width: 25px;
      height: 25px;
      margin-top: -10px;
      appearance: none;
      border: 2px solid var(--tide-bright);
      border-radius: 90% 8%;
      background: radial-gradient(circle, #020806 0 28%, var(--amber) 30% 45%, var(--slate) 47%);
      box-shadow: 0 0 14px rgba(55, 216, 200, 0.42);
      transform: rotate(45deg);
    }

    .depth-range::-moz-range-thumb {
      width: 23px;
      height: 23px;
      border: 2px solid var(--tide-bright);
      border-radius: 90% 8%;
      background: radial-gradient(circle, #020806 0 28%, var(--amber) 30% 45%, var(--slate) 47%);
      box-shadow: 0 0 14px rgba(55, 216, 200, 0.42);
      transform: rotate(45deg);
    }

    .range-marks {
      display: flex;
      justify-content: space-between;
      color: #adbdad;
      font-family: var(--ink-hand);
      font-size: 0.64rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .custom-select {
      position: relative;
    }

    .select-trigger {
      display: flex;
      width: 100%;
      min-height: 54px;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 12px 15px;
      border: 1px solid var(--line);
      border-radius: 8px 14px 7px 12px;
      cursor: pointer;
      color: var(--parchment);
      text-align: left;
      background:
        linear-gradient(90deg, rgba(55, 216, 200, 0.06), transparent),
        #071712;
      box-shadow: inset 0 0 16px rgba(0, 0, 0, 0.24);
    }

    .select-trigger[aria-expanded="true"] {
      border-color: var(--tide);
      box-shadow: 0 0 17px rgba(55, 216, 200, 0.11), inset 0 0 16px rgba(0, 0, 0, 0.24);
    }

    .select-mark {
      position: relative;
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      border: 1px solid var(--amber);
      transform: rotate(45deg);
      transition: transform 180ms ease;
    }

    .select-mark::after {
      position: absolute;
      inset: 5px;
      content: "";
      border-right: 1px solid var(--amber-bright);
      border-bottom: 1px solid var(--amber-bright);
    }

    .select-trigger[aria-expanded="true"] .select-mark {
      transform: rotate(225deg);
    }

    .select-menu {
      position: absolute;
      top: calc(100% + 9px);
      right: 0;
      left: 0;
      z-index: 25;
      margin: 0;
      padding: 7px;
      border: 1px solid var(--tide-dim);
      border-radius: 11px 7px 14px 8px;
      list-style: none;
      background:
        radial-gradient(circle at top, rgba(55, 216, 200, 0.09), transparent 45%),
        #071410;
      box-shadow: 0 20px 42px rgba(0, 0, 0, 0.58), inset 0 0 20px rgba(55, 216, 200, 0.025);
    }

    .select-option {
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid transparent;
      border-radius: 7px 9px 6px 10px;
      cursor: pointer;
      color: var(--parchment-muted);
    }

    .select-option[aria-selected="true"] {
      color: var(--tide-bright);
      border-color: rgba(55, 216, 200, 0.24);
      background: rgba(55, 216, 200, 0.08);
    }

    .select-option:focus {
      color: var(--parchment);
      background: rgba(228, 169, 77, 0.08);
      outline: 2px solid var(--amber);
      outline-offset: -2px;
    }

    .dial-wrap {
      display: grid;
      gap: 24px;
      align-content: start;
    }

    .attention-dial {
      position: relative;
      display: grid;
      width: min(100%, 260px);
      aspect-ratio: 1;
      place-items: center;
      justify-self: center;
      border: 1px solid rgba(228, 169, 77, 0.42);
      border-radius: 50% 48% 53% 47%;
      background:
        repeating-conic-gradient(from -112deg, rgba(240, 222, 179, 0.34) 0 1deg, transparent 1deg 12deg),
        radial-gradient(circle, #10271f 0 53%, #07130f 54% 62%, rgba(228, 169, 77, 0.32) 63% 64%, #081510 65%);
      box-shadow: inset 0 0 32px rgba(0, 0, 0, 0.65), 0 12px 30px rgba(0, 0, 0, 0.33);
    }

    .attention-dial::after {
      position: absolute;
      bottom: 19%;
      width: 16px;
      height: 16px;
      border: 2px solid var(--amber-bright);
      border-radius: 50%;
      content: "";
      background: var(--ink);
      box-shadow: 0 0 11px rgba(228, 169, 77, 0.3);
    }

    .dial-needle {
      position: absolute;
      bottom: calc(19% + 7px);
      left: calc(50% - 2px);
      width: 4px;
      height: 34%;
      border-radius: 50% 50% 0 0;
      transform-origin: 50% 100%;
      transform: rotate(-78deg);
      background: linear-gradient(var(--tide-bright), var(--tide));
      box-shadow: 0 0 10px rgba(55, 216, 200, 0.5);
      transition: transform 420ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .dial-readout {
      position: absolute;
      bottom: 31%;
      color: var(--parchment);
      font-family: var(--serif-display);
      font-size: clamp(1.1rem, 3vw, 1.7rem);
    }

    .dial-caption {
      position: absolute;
      top: 66%;
      width: 74%;
      color: var(--parchment-muted);
      text-align: center;
      letter-spacing: 0.08em;
    }

    .progress-stack {
      display: grid;
      gap: 14px;
    }

    .progress-head {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: baseline;
    }

    .progress-track {
      position: relative;
      height: 22px;
      overflow: hidden;
      border: 1px solid rgba(55, 216, 200, 0.34);
      border-radius: 45% 55% 42% 58%;
      background:
        repeating-linear-gradient(90deg, transparent 0 9%, rgba(240, 222, 179, 0.08) 9.2% 9.7%),
        rgba(0, 7, 5, 0.68);
      box-shadow: inset 0 3px 9px rgba(0, 0, 0, 0.65);
    }

    .progress-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 36%;
      border-radius: inherit;
      background:
        radial-gradient(circle at 90% 20%, rgba(236, 255, 250, 0.55), transparent 10px),
        linear-gradient(90deg, #126e65, var(--tide));
      box-shadow: 0 0 18px rgba(55, 216, 200, 0.4);
      transition: width 500ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .progress-fill::after {
      position: absolute;
      inset: 0;
      content: "";
      opacity: 0.35;
      background: linear-gradient(110deg, transparent 25%, rgba(255, 255, 255, 0.54) 44%, transparent 62%);
      animation: tideGlint 3.4s ease-in-out infinite;
    }

    .tab-book {
      position: relative;
      padding: 20px;
      border: 1px solid var(--line-warm);
      border-radius: 10px 18px 12px 16px;
      background:
        linear-gradient(90deg, transparent 49.5%, rgba(50, 31, 12, 0.22) 50%, transparent 50.5%),
        linear-gradient(145deg, rgba(240, 222, 179, 0.98), rgba(202, 181, 134, 0.94));
      box-shadow: inset 0 0 36px rgba(70, 42, 13, 0.16), 0 24px 42px rgba(0, 0, 0, 0.28);
      color: #17231d;
    }

    .tab-list {
      display: flex;
      gap: 6px;
      align-items: end;
      margin: -45px 10px 18px;
      padding: 0;
    }

    .tab {
      min-height: 44px;
      padding: 9px 17px 7px;
      border: 1px solid rgba(228, 169, 77, 0.5);
      border-bottom: 0;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      color: var(--parchment-muted);
      font-family: var(--ink-hand);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: #17261f;
      transition: color 160ms ease, background-color 160ms ease, transform 160ms ease;
    }

    .tab[aria-selected="true"] {
      color: #15221c;
      background: var(--parchment);
      transform: translateY(1px);
    }

    .tab-panel {
      min-height: 205px;
      padding: clamp(18px, 3vw, 32px);
      border: 1px solid rgba(45, 39, 25, 0.2);
      border-radius: 8px 13px 9px 12px;
      background:
        radial-gradient(circle at 82% 20%, rgba(44, 88, 68, 0.08), transparent 30%),
        rgba(255, 245, 215, 0.16);
    }

    .tab-panel h3 {
      margin-bottom: 12px;
      color: #15221c;
      font-family: var(--serif-display);
      font-size: clamp(1.35rem, 3vw, 2rem);
      line-height: 1.15;
    }

    .tab-panel p {
      margin-bottom: 0;
      color: #35453c;
      font-size: 1.08rem;
    }

    .marginalia {
      margin-top: 18px !important;
      padding-left: 15px;
      border-left: 2px solid #8c6327;
      color: #6c4b20 !important;
      font-family: var(--ink-hand);
      font-size: 0.89rem !important;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .tooltip-wrap {
      position: relative;
      display: inline-flex;
    }

    .tooltip-trigger {
      display: grid;
      width: 46px;
      height: 46px;
      place-items: center;
      border: 1px solid var(--amber);
      border-radius: 50% 46% 53% 48%;
      cursor: help;
      color: var(--amber-bright);
      font-family: var(--serif-display);
      background: rgba(228, 169, 77, 0.08);
      box-shadow: inset 0 0 13px rgba(228, 169, 77, 0.05);
    }

    .tooltip-bubble {
      position: absolute;
      right: 0;
      bottom: calc(100% + 13px);
      z-index: 28;
      width: min(270px, calc(100vw - 52px));
      padding: 13px 15px;
      border: 1px solid var(--amber);
      border-radius: 12px 8px 13px 7px;
      color: var(--parchment);
      font-size: 0.9rem;
      line-height: 1.35;
      background: #101b15;
      box-shadow: 0 16px 34px rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transform: translateY(7px);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .tooltip-bubble::after {
      position: absolute;
      right: 15px;
      bottom: -6px;
      width: 10px;
      height: 10px;
      border-right: 1px solid var(--amber);
      border-bottom: 1px solid var(--amber);
      content: "";
      background: #101b15;
      transform: rotate(45deg);
    }

    .tooltip-wrap:hover .tooltip-bubble,
    .tooltip-wrap:focus-within .tooltip-bubble,
    .tooltip-wrap.is-visible .tooltip-bubble {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .apparition-panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 28px;
      align-items: center;
    }

    .apparition-copy h3 {
      margin-bottom: 10px;
      font-family: var(--serif-display);
      font-size: clamp(1.35rem, 3vw, 2rem);
    }

    .apparition-copy p {
      max-width: 690px;
      margin-bottom: 0;
      color: var(--parchment-muted);
    }

    dialog {
      width: min(560px, calc(100% - 32px));
      max-height: min(740px, calc(100dvh - 32px));
      padding: 0;
      border: 1px solid var(--tide);
      border-radius: 22px 15px 24px 13px;
      overflow: visible;
      color: var(--parchment);
      background:
        radial-gradient(circle at 50% 0%, rgba(55, 216, 200, 0.16), transparent 45%),
        repeating-linear-gradient(176deg, transparent 0 20px, rgba(239, 220, 176, 0.018) 21px 22px),
        #0b201a;
      box-shadow: 0 0 90px rgba(55, 216, 200, 0.18), 0 32px 90px rgba(0, 0, 0, 0.72);
    }

    dialog[open] {
      animation: modalRise 280ms ease both;
    }

    dialog::backdrop {
      background:
        radial-gradient(circle at 50% 45%, rgba(19, 91, 78, 0.32), rgba(0, 5, 4, 0.9)),
        rgba(0, 7, 5, 0.84);
      backdrop-filter: blur(5px);
    }

    .dialog-inner {
      position: relative;
      max-height: min(740px, calc(100dvh - 32px));
      padding: clamp(28px, 6vw, 50px);
      overflow-y: auto;
    }

    .dialog-inner::before {
      display: grid;
      width: 94px;
      height: 60px;
      margin: 0 auto 24px;
      place-items: center;
      border: 1px solid var(--tide);
      border-radius: 100% 7%;
      color: var(--tide-bright);
      content: "◉";
      background: radial-gradient(circle, rgba(55, 216, 200, 0.15), transparent 65%);
      box-shadow: 0 0 22px rgba(55, 216, 200, 0.17);
    }

    .dialog-close {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 2;
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 1px solid rgba(240, 222, 179, 0.32);
      border-radius: 50%;
      cursor: pointer;
      color: var(--parchment);
      background: rgba(2, 10, 8, 0.43);
    }

    .dialog-inner h2 {
      margin-bottom: 15px;
      font-family: var(--serif-display);
      font-size: clamp(1.7rem, 6vw, 2.8rem);
      line-height: 1.08;
      text-align: center;
    }

    .dialog-inner > p {
      margin-bottom: 28px;
      color: var(--parchment-muted);
      font-size: 1.06rem;
      text-align: center;
    }

    .dialog-actions {
      justify-content: center;
    }

    .toast-region {
      position: fixed;
      top: 66px;
      right: max(24px, calc((100% - 1180px) / 2));
      z-index: 100;
      display: grid;
      width: min(360px, calc(100% - 48px));
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      position: relative;
      display: grid;
      grid-template-columns: 10px minmax(0, 1fr) auto;
      gap: 13px;
      align-items: center;
      min-height: 68px;
      padding: 12px 12px 12px 15px;
      border: 1px solid var(--tide);
      border-radius: 13px 8px 15px 7px;
      color: var(--parchment);
      background:
        radial-gradient(circle at left, rgba(55, 216, 200, 0.13), transparent 55%),
        #0a1d17;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.58);
      pointer-events: auto;
      animation: toastIn 260ms ease both;
    }

    .toast::before {
      width: 8px;
      height: 34px;
      border-radius: 60% 40%;
      content: "";
      background: var(--tide);
      box-shadow: 0 0 12px rgba(55, 216, 200, 0.5);
    }

    .toast.is-leaving {
      animation: toastOut 180ms ease both;
    }

    .toast-message {
      line-height: 1.25;
    }

    .toast-close {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      color: var(--parchment-muted);
      background: transparent;
    }

    .closing {
      border-top: 1px solid rgba(55, 216, 200, 0.2);
      background:
        linear-gradient(90deg, rgba(55, 216, 200, 0.035), transparent 30% 70%, rgba(228, 169, 77, 0.035)),
        #030d0a;
    }

    .closing-inner {
      display: flex;
      min-height: 112px;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      padding-block: 24px;
      color: var(--parchment-muted);
      font-style: italic;
    }

    .closing-mark {
      color: var(--amber);
      font-family: var(--ink-hand);
      font-size: 0.74rem;
      letter-spacing: 0.14em;
      text-align: right;
      text-transform: uppercase;
    }

    @media (hover: hover) {
      .btn:not(:disabled):hover {
        transform: translateY(-2px);
      }

      .btn--tide:hover {
        box-shadow: 0 0 24px rgba(55, 216, 200, 0.32), inset 0 -5px 10px rgba(0, 63, 56, 0.19);
      }

      .btn--parchment:hover {
        background-color: #fff0c8;
      }

      .btn--amber:hover,
      .btn--seal:hover {
        color: #fff2cb;
        background-color: rgba(228, 169, 77, 0.17);
        box-shadow: 0 0 19px rgba(228, 169, 77, 0.13);
      }

      .btn--bare:hover {
        color: var(--tide-bright);
        border-bottom-color: var(--tide);
      }

      .sigil-stage:hover .eye {
        box-shadow:
          0 0 0 8px rgba(5, 24, 19, 0.92),
          0 0 0 10px rgba(55, 216, 200, 0.38),
          0 0 58px rgba(55, 216, 200, 0.62),
          inset 0 0 32px rgba(1, 10, 7, 0.88);
      }

      .choice:hover,
      .check-row:hover,
      .switch-row:hover {
        border-color: rgba(55, 216, 200, 0.46);
      }

      .select-option:hover {
        color: var(--parchment);
        background: rgba(228, 169, 77, 0.07);
      }

      .tab:hover {
        color: var(--parchment);
        transform: translateY(-2px);
      }

      .tab[aria-selected="true"]:hover {
        color: #15221c;
        transform: translateY(1px);
      }
    }

    @media (max-width: 860px) {
      .hero {
        grid-template-columns: 1fr;
        min-height: auto;
        padding-block: 72px 94px;
        text-align: center;
      }

      .hero::after {
        right: auto;
        bottom: 46%;
        left: 10%;
        width: 80%;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--line), transparent);

        margin-inline: auto;

      .hero-actions,
      .omen-line {
        justify-content: center;
      }

      .sigil-stage {
        width: min(100%, 430px);
      }

      .chapter-grid {
        grid-template-columns: 1fr;
      }

      .slate-panel--wide {
        grid-column: auto;
      }
    }

    @media (max-width: 620px) {
      :root {
        --page-gutter: 16px;
      }

      body {
        font-size: 17px;
      }

      .status-inner {
        min-height: 54px;
        gap: 10px;
        padding: 9px 16px;
        font-size: 0.6rem;
        letter-spacing: 0.1em;
      }

      .hero,
      .controls,
      .closing-inner {
        width: calc(100% - 32px);
      }

      .hero {
        gap: 58px;
        padding-block: 58px 78px;
      }

      .hero::after {
        bottom: 43%;
      }

      h1 {
        font-size: clamp(3rem, 15vw, 4.7rem);
      }

      .eyebrow {
        font-size: 0.68rem;
        letter-spacing: 0.11em;
      }

      .eyebrow::before,
      .eyebrow::after {
        width: 18px;
      }

      .hero-actions {
        display: grid;
        width: 100%;
      }

      .hero-actions .btn {
        width: 100%;
      }

      .sigil-caption {
        bottom: 11%;
        font-size: 0.58rem;
      }

      .controls {
        padding-block: 20px 84px;
      }

      .section-intro {
        margin-bottom: 50px;
      }

      .chapter,
      .chapter + .chapter {
        margin-top: 64px;
      }

      .chapter + .chapter {
        padding-top: 64px;
      }

      .chapter-heading {
        gap: 14px;
      }

      .folio-number {
        width: 46px;
        height: 46px;
      }

      .slate-panel {
        padding: 22px 18px;
      }

      .button-coven {
        display: grid;
        grid-template-columns: 1fr;
      }

      .button-coven .btn:not(.btn--seal) {
        width: 100%;
      }

      .button-coven .btn--seal {
        justify-self: center;
      }

      .choice-list,
      .binary-grid {
        grid-template-columns: 1fr;
      }

      .range-wrap {
        grid-template-columns: 1fr;
      }

      .tab-book {
        margin-top: 26px;
        padding: 14px;
      }

      .tab-list {
        gap: 4px;
        margin: -41px 4px 14px;
      }

      .tab {
        min-width: 0;
        flex: 1 1 0;
        padding-inline: 8px;
        letter-spacing: 0.06em;
      }

      .apparition-panel {
        grid-template-columns: 1fr;
      }

      .apparition-panel .action-row {
        display: grid;
      }

      .apparition-panel .btn {
        width: 100%;
      }

      .toast-region {
        top: 64px;
        right: 16px;
        width: calc(100% - 32px);
      }

      .closing-inner {
        min-height: 132px;
        flex-direction: column;
        justify-content: center;
        text-align: center;
      }

      .closing-mark {
        text-align: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @keyframes listeningPulse {
      0%,
      100% {
        opacity: 0.55;
        transform: scale(0.86);
      }
      50% {
        opacity: 1;
        transform: scale(1.08);
      }
    }

    @keyframes abyssBreath {
      0%,
      100% {
        filter: drop-shadow(0 0 25px rgba(55, 216, 200, 0.1));
      }
      50% {
        filter: drop-shadow(0 0 44px rgba(55, 216, 200, 0.22));
      }
    }

    @keyframes sigilTurn {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes sigilTurnReverse {
      to {
        transform: rotate(-360deg);
      }
    }

    @keyframes inkSeep {
      from {
        width: 18%;
        opacity: 0.34;
      }
      to {
        width: 56%;
        opacity: 0.74;
      }
    }

    @keyframes tideGlint {
      0%,
      28% {
        transform: translateX(-120%);
      }
      75%,
      100% {
        transform: translateX(130%);
      }
    }

    @keyframes modalRise {

        opacity: 0;
        transform: translateY(16px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateX(18px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes toastOut {
      to {
        opacity: 0;
        transform: translateX(16px);
      }

  </style>

<body>
  <header class="status-bar" aria-label="Archive status">

  <div class="toast-region" id="toastRegion" aria-live="polite" aria-label="Whispers from the archive"></div>

  <script>
    (() => {
      "use strict";

      const copyNodes = document.querySelectorAll("[data-copy]");
      copyNodes.forEach((node) => {
        node.textContent = node.dataset.copy;
      });

      document.querySelectorAll("[data-placeholder]").forEach((field) => {
        field.placeholder = field.dataset.placeholder;
      });

      const storageKey = "abyss-archive-state-v1";
      const safeStorage = {
        read() {
          try {
            return JSON.parse(localStorage.getItem(storageKey) || "{}");
          } catch (error) {
            return {};
          }
        },
        write(value) {
          try {
            localStorage.setItem(storageKey, JSON.stringify(value));
          } catch (error) {
            return;
          }
        }
      };

      const state = Object.assign({
        name: "",
        tribute: "memory",
        salt: false,
        eyeOpen: false,
        depth: 42,
        chamber: "choir",
        progress: 36,
        tab: "omen"
      }, safeStorage.read());

      const persist = () => safeStorage.write(state);
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

      const toastRegion = document.getElementById("toastRegion");
      const activeToastTimers = new WeakMap();

      function removeToast(toast) {
        if (!toast || !toast.isConnected) {
          return;
        }
        const timer = activeToastTimers.get(toast);
        if (timer) {
          window.clearTimeout(timer);
        }
        toast.classList.add("is-leaving");
        const delay = reduceMotion.matches ? 0 : 190;
        window.setTimeout(() => toast.remove(), delay);
      }

      function showToast(message) {
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.setAttribute("role", "status");

        const messageNode = document.createElement("span");
        messageNode.className = "toast-message";
        messageNode.textContent = message;

        const closeButton = document.createElement("button");
        closeButton.className = "toast-close";
        closeButton.type = "button";
        closeButton.setAttribute("aria-label", "Dismiss this whisper");
        closeButton.textContent = "×";
        closeButton.addEventListener("click", () => removeToast(toast));

        toast.append(document.createElement("span"), messageNode, closeButton);
        toastRegion.prepend(toast);

        while (toastRegion.children.length > 3) {
          toastRegion.lastElementChild.remove();
        }

        const timer = window.setTimeout(() => removeToast(toast), 4600);
        activeToastTimers.set(toast, timer);
      }

      const witnessEye = document.getElementById("witnessEye");
      const askButton = document.getElementById("askButton");
      const omenLine = document.getElementById("omenLine");
      const omens = [
        "A patient door is learning the shape of your shadow.",
        "The ninth bell rings where no tower remains.",
        "Something below has mistaken your question for an invitation.",
        "Your reflection arrived several breaths before you did."
      ];
      let omenIndex = 0;
      let blinkTimer = 0;

      function blinkWitness() {
        window.clearTimeout(blinkTimer);
        witnessEye.classList.add("is-blinking");
        const blinkLength = reduceMotion.matches ? 10 : 360;
        blinkTimer = window.setTimeout(() => witnessEye.classList.remove("is-blinking"), blinkLength);
      }

      function revealOmen() {
        blinkWitness();
        omenLine.textContent = omens[omenIndex % omens.length];
        omenIndex += 1;
      }

      witnessEye.addEventListener("click", revealOmen);
      askButton.addEventListener("click", revealOmen);

      document.getElementById("descendButton").addEventListener("click", () => {
        const target = document.getElementById("instruments");
        target.scrollIntoView({ behavior: reduceMotion.matches ? "auto" : "smooth", block: "start" });
        window.setTimeout(() => document.getElementById("trueName").focus({ preventScroll: true }), reduceMotion.matches ? 0 : 520);
      });

      document.querySelectorAll(".ritual-button").forEach((button) => {
        button.addEventListener("click", () => showToast(button.dataset.toast));
      });

      const trueName = document.getElementById("trueName");
      trueName.value = typeof state.name === "string" ? state.name : "";
      trueName.addEventListener("input", () => {
        state.name = trueName.value;
        persist();
      });

      const tributeRadios = Array.from(document.querySelectorAll('input[name="tribute"]'));
      if (tributeRadios.some((radio) => radio.value === state.tribute)) {
        tributeRadios.forEach((radio) => {
          radio.checked = radio.value === state.tribute;
        });
      }
      tributeRadios.forEach((radio) => {
        radio.addEventListener("change", () => {
          if (radio.checked) {
            state.tribute = radio.value;
            persist();
          }
        });
      });

      const saltVow = document.getElementById("saltVow");
      saltVow.checked = Boolean(state.salt);
      saltVow.addEventListener("change", () => {
        state.salt = saltVow.checked;
        persist();
      });

      const eyeSwitch = document.getElementById("eyeSwitch");
      const eyeSwitchState = document.getElementById("eyeSwitchState");

      function renderEyeSwitch() {
        const isOpen = Boolean(state.eyeOpen);
        eyeSwitch.setAttribute("aria-checked", String(isOpen));
        eyeSwitchState.textContent = isOpen ? "The eye is watching" : "The lid is closed";
      }

      renderEyeSwitch();
      eyeSwitch.addEventListener("click", () => {
        state.eyeOpen = !state.eyeOpen;
        renderEyeSwitch();
        persist();
        if (state.eyeOpen) {
          blinkWitness();
          showToast("The warding eye has opened.");
        }
      });

      const depthRange = document.getElementById("depthRange");
      const depthValue = document.getElementById("depthValue");
      const attentionDial = document.getElementById("attentionDial");
      const dialNeedle = document.getElementById("dialNeedle");
      const dialReadout = document.getElementById("dialReadout");

      function clamp(value, minimum, maximum) {
        return Math.min(maximum, Math.max(minimum, value));
      }

      function renderDepth() {
        const depth = clamp(Number(state.depth) || 0, 0, 100);
        state.depth = depth;
        depthRange.value = String(depth);
        depthValue.textContent = `${depth} fathoms`;
        dialReadout.textContent = `${depth}%`;
        attentionDial.setAttribute("aria-valuenow", String(depth));
        dialNeedle.style.transform = `rotate(${-78 + depth * 1.56}deg)`;
      }

      renderDepth();
      depthRange.addEventListener("input", () => {
        state.depth = Number(depthRange.value);
        renderDepth();
        persist();
      });

      const selectRoot = document.getElementById("choirSelect");
      const selectTrigger = document.getElementById("selectTrigger");
      const selectCurrent = document.getElementById("selectCurrent");
      const selectMenu = document.getElementById("selectMenu");
      const selectOptions = Array.from(selectMenu.querySelectorAll('[role="option"]'));
      let focusedOptionIndex = 0;

      function selectedOption() {
        return selectOptions.find((option) => option.dataset.value === state.chamber) || selectOptions[0];
      }

      function renderSelection() {
        const selected = selectedOption();
        state.chamber = selected.dataset.value;
        selectCurrent.textContent = selected.dataset.copy;
        selectOptions.forEach((option) => {
          option.setAttribute("aria-selected", String(option === selected));
        });
        focusedOptionIndex = selectOptions.indexOf(selected);
      }

      function openSelect(preferredIndex = focusedOptionIndex) {
        selectMenu.hidden = false;
        selectTrigger.setAttribute("aria-expanded", "true");
        focusedOptionIndex = clamp(preferredIndex, 0, selectOptions.length - 1);
        selectOptions[focusedOptionIndex].focus();
      }

      function closeSelect(restoreFocus = true) {
        selectMenu.hidden = true;
        selectTrigger.setAttribute("aria-expanded", "false");
        if (restoreFocus) {
          selectTrigger.focus();
        }
      }

      function chooseOption(option) {
        state.chamber = option.dataset.value;
        renderSelection();
        persist();
        closeSelect();
        showToast(`${option.dataset.copy} is listening.`);
      }

      renderSelection();

      selectTrigger.addEventListener("click", () => {
        if (selectMenu.hidden) {
          openSelect();
        } else {
          closeSelect();
        }
      });

      selectTrigger.addEventListener("keydown", (event) => {
        const currentIndex = selectOptions.indexOf(selectedOption());
        if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          event.preventDefault();
          openSelect(event.key === "ArrowDown" ? Math.min(currentIndex + 1, selectOptions.length - 1) : Math.max(currentIndex - 1, 0));
        } else if (event.key === "Home" || event.key === "End") {
          event.preventDefault();
          openSelect(event.key === "Home" ? 0 : selectOptions.length - 1);
        }
      });

      selectMenu.addEventListener("keydown", (event) => {
        if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          event.preventDefault();
          const step = event.key === "ArrowDown" ? 1 : -1;
          focusedOptionIndex = (focusedOptionIndex + step + selectOptions.length) % selectOptions.length;
          selectOptions[focusedOptionIndex].focus();
        } else if (event.key === "Home" || event.key === "End") {
          event.preventDefault();
          focusedOptionIndex = event.key === "Home" ? 0 : selectOptions.length - 1;
          selectOptions[focusedOptionIndex].focus();
        } else if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          chooseOption(selectOptions[focusedOptionIndex]);
        } else if (event.key === "Escape") {
          event.preventDefault();
          closeSelect();
        } else if (event.key === "Tab") {
          closeSelect(false);
        }
      });

      selectOptions.forEach((option, index) => {
        option.addEventListener("focus", () => {
          focusedOptionIndex = index;
        });
        option.addEventListener("click", () => chooseOption(option));
      });

      document.addEventListener("pointerdown", (event) => {
        if (!selectMenu.hidden && !selectRoot.contains(event.target)) {
          closeSelect(false);
        }
      });

      const progressBar = document.getElementById("inkProgress");
      const progressFill = document.getElementById("progressFill");
      const progressValue = document.getElementById("progressValue");

      function renderProgress() {
        const value = clamp(Number(state.progress) || 0, 0, 100);
        state.progress = value;
        progressFill.style.width = `${value}%`;
        progressValue.textContent = `${value}%`;
        progressBar.setAttribute("aria-valuenow", String(value));
      }

      renderProgress();

      document.getElementById("feedInkButton").addEventListener("click", () => {
        state.progress = state.progress >= 100 ? 17 : clamp(state.progress + 17, 0, 100);
        renderProgress();
        persist();
        showToast(state.progress >= 100 ? "The margin is fully awake." : "The ink drinks and advances.");
      });

      document.getElementById("drainInkButton").addEventListener("click", () => {
        state.progress = clamp(state.progress - 13, 0, 100);
        renderProgress();
        persist();
        showToast(state.progress === 0 ? "The margin lies pale and quiet." : "A dark thread leaves the page.");
      });

      const tabs = Array.from(document.querySelectorAll('[role="tab"]'));
      const panels = tabs.map((tab) => document.getElementById(tab.getAttribute("aria-controls")));

      function activateTab(tab, moveFocus = false) {
        const requested = tabs.includes(tab) ? tab : tabs[0];
        tabs.forEach((candidate, index) => {
          const active = candidate === requested;
          candidate.setAttribute("aria-selected", String(active));
          candidate.tabIndex = active ? 0 : -1;
          panels[index].hidden = !active;
        });
        state.tab = requested.dataset.tab;
        persist();
        if (moveFocus) {
          requested.focus();
        }
      }

      activateTab(tabs.find((tab) => tab.dataset.tab === state.tab) || tabs[0]);

      tabs.forEach((tab) => {
        tab.addEventListener("click", () => activateTab(tab));
        tab.addEventListener("keydown", (event) => {
          const currentIndex = tabs.indexOf(tab);
          let nextIndex = null;
          if (event.key === "ArrowRight") {
            nextIndex = (currentIndex + 1) % tabs.length;
          } else if (event.key === "ArrowLeft") {
            nextIndex = (currentIndex - 1 + tabs.length) % tabs.length;
          } else if (event.key === "Home") {
            nextIndex = 0;
          } else if (event.key === "End") {
            nextIndex = tabs.length - 1;
          }
          if (nextIndex !== null) {
            event.preventDefault();
            activateTab(tabs[nextIndex], true);
          }
        });
      });

      const tooltipWrap = document.getElementById("tooltipWrap");
      const tooltipTrigger = document.getElementById("tooltipTrigger");
      tooltipTrigger.addEventListener("click", () => {
        tooltipWrap.classList.toggle("is-visible");
      });

      document.addEventListener("pointerdown", (event) => {
        if (!tooltipWrap.contains(event.target)) {
          tooltipWrap.classList.remove("is-visible");
        }
      });

      const covenantDialog = document.getElementById("covenantDialog");
      const openDialogButton = document.getElementById("openDialogButton");
      const dialogCloseButton = document.getElementById("dialogCloseButton");
      const acceptMarkButton = document.getElementById("acceptMarkButton");
      const declineMarkButton = document.getElementById("declineMarkButton");
      let dialogOpener = null;

      function openDialog() {
        dialogOpener = document.activeElement;
        covenantDialog.showModal();
        dialogCloseButton.focus();
      }

      function closeDialog(message = "") {
        if (covenantDialog.open) {
          covenantDialog.close();
        }
        if (dialogOpener instanceof HTMLElement) {
          dialogOpener.focus();
        }
        if (message) {
          showToast(message);
        }
      }

      openDialogButton.addEventListener("click", openDialog);
      dialogCloseButton.addEventListener("click", () => closeDialog());
      declineMarkButton.addEventListener("click", () => closeDialog("You leave with your name unaltered."));
      acceptMarkButton.addEventListener("click", () => {
        state.salt = true;
        saltVow.checked = true;
        persist();
        closeDialog("The covenant marks you in salt and tide.");
      });

      covenantDialog.addEventListener("cancel", (event) => {
        event.preventDefault();
        closeDialog();
      });

      covenantDialog.addEventListener("click", (event) => {
        if (event.target === covenantDialog) {
          closeDialog();
        }
      });

      covenantDialog.addEventListener("keydown", (event) => {
        if (event.key !== "Tab") {
          return;
        }
        const focusable = Array.from(covenantDialog.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), [tabindex]:not([tabindex="-1"])')).filter((element) => !element.hidden);
        if (!focusable.length) {
          event.preventDefault();
          return;
        }
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      });

      document.getElementById("showToastButton").addEventListener("click", () => {
        showToast("A lesser whisper coils at the page edge.");
      });

      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") {
          return;
        }
        if (covenantDialog.open) {
          return;
        }
        if (!selectMenu.hidden) {
          event.preventDefault();
          closeSelect();
          return;
        }
        if (tooltipWrap.classList.contains("is-visible")) {
          event.preventDefault();
          tooltipWrap.classList.remove("is-visible");
          tooltipTrigger.focus();
        }
      });
    })();
  </script>
</body>
</html>
