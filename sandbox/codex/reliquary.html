<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title></title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&amp;family=Cormorant+Garamond:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
  <style>
    :root {
      --obsidian: #070a09;
      --obsidian-soft: #0d1210;
      --obsidian-raised: #131915;
      --bone: #f3eee1;
      --bone-muted: #c9c2b2;
      --gold: #c9ad61;
      --gold-bright: #f0d787;
      --gold-dark: #6d5c32;
      --venom: #8cff6c;
      --venom-deep: #2c6f2b;
      --artery: #ff5f59;
      --artery-deep: #7d2423;
      --glass: rgba(226, 240, 223, 0.055);
      --line: rgba(243, 238, 225, 0.18);
      --line-strong: rgba(243, 238, 225, 0.38);
      --serif: "Cormorant Garamond", Georgia, serif;
      --narrow: "Barlow Condensed", "Arial Narrow", sans-serif;
      --mono: "IBM Plex Mono", Consolas, monospace;
      --ease-organic: cubic-bezier(.2, .75, .22, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background: var(--obsidian);
    }

    body {
      margin: 0;
      min-width: 0;
      overflow-x: hidden;
      color: var(--bone);
      background:
        radial-gradient(circle at 50% 8%, rgba(140, 255, 108, 0.07), transparent 26rem),
        radial-gradient(circle at 88% 36%, rgba(201, 173, 97, 0.08), transparent 30rem),
        linear-gradient(180deg, #090d0b 0%, var(--obsidian) 58%, #090807 100%);
      font-family: var(--narrow);
      font-size: 18px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      content: "";
      opacity: 0.17;
      background-image:
        repeating-radial-gradient(circle at 13% 37%, transparent 0 2px, rgba(255, 255, 255, 0.05) 3px, transparent 4px),
        repeating-linear-gradient(103deg, transparent 0 17px, rgba(201, 173, 97, 0.025) 18px, transparent 19px);
      background-size: 37px 41px, 59px 61px;
      mix-blend-mode: screen;
    }

    body.modal-open {
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button,
    label {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      color: inherit;
    }

    button:not(:disabled),
    input:not(:disabled),
    label[for] {
      cursor: pointer;
    }

    [hidden] {
      display: none !important;
    }

    .shell {
      width: min(100%, 1180px);
      margin-inline: auto;
      padding-inline: 24px;
    }

    .skip-link {
      position: fixed;
      top: 8px;
      left: 16px;
      z-index: 100;
      padding: 8px 12px;
      color: var(--obsidian);
      background: var(--venom);
      font-family: var(--mono);
      font-size: 12px;
      transform: translateY(-180%);
      transition: transform 180ms ease;
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .world-bar {
      position: relative;
      z-index: 12;
      width: 100%;
      border-bottom: 1px solid rgba(201, 173, 97, 0.52);
      background: rgba(7, 10, 9, 0.88);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(14px);
    }

    .world-bar::after {
      position: absolute;
      right: 0;
      bottom: -1px;
      left: 0;
      height: 1px;
      content: "";
      background: linear-gradient(90deg, transparent, var(--venom), transparent);
      opacity: 0.35;
    }

    .world-bar__inner {
      display: flex;
      min-height: 48px;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .world-mark,
    .world-state {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .world-mark::before {
      width: 9px;
      height: 9px;
      border: 1px solid var(--gold);
      content: "";
      transform: rotate(45deg);
      box-shadow: inset 0 0 0 2px var(--obsidian), inset 0 0 0 5px var(--gold);
    }

    .world-state {
      color: var(--bone-muted);
      text-align: right;
    }

    .status-pulse {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--venom);
      box-shadow: 0 0 0 3px rgba(140, 255, 108, 0.1), 0 0 14px rgba(140, 255, 108, 0.75);
      animation: status-breath 2.4s ease-in-out infinite;
    }

    .hero {
      position: relative;
      display: grid;
      min-height: min(760px, calc(100vh - 48px));
      grid-template-columns: minmax(0, 0.92fr) minmax(420px, 1.08fr);
      align-items: center;
      gap: clamp(30px, 5vw, 78px);
      padding-block: clamp(76px, 10vw, 132px) 90px;
    }

    .hero::before {
      position: absolute;
      top: 72px;
      bottom: 68px;
      left: 50%;
      width: 1px;
      pointer-events: none;
      content: "";
      background: linear-gradient(transparent, rgba(201, 173, 97, 0.18) 18%, rgba(201, 173, 97, 0.18) 82%, transparent);
    }

    .hero-copy {
      position: relative;
      z-index: 3;
    }

    .kicker {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 22px;
      color: var(--venom);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .kicker::before {
      width: 38px;
      height: 1px;
      content: "";
      background: var(--venom);
      box-shadow: 7px -3px 0 -0.25px var(--venom);
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      max-width: 660px;
      margin-bottom: 22px;
      color: var(--bone);
      font-family: var(--serif);
      font-size: clamp(62px, 8.2vw, 118px);
      font-weight: 600;
      line-height: 0.76;
      letter-spacing: -0.052em;
      text-wrap: balance;
    }

    h1 em {
      display: block;
      margin-left: clamp(28px, 6vw, 82px);
      color: transparent;
      font-style: italic;
      -webkit-text-stroke: 1px var(--gold);
      text-shadow: 0 0 28px rgba(201, 173, 97, 0.13);
    }

    .hero-deck {
      max-width: 530px;
      margin-bottom: 30px;
      color: var(--bone-muted);
      font-size: clamp(18px, 2vw, 23px);
      line-height: 1.5;
      letter-spacing: 0.01em;
    }

    .hero-actions,
    .button-grid,
    .inline-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .micro-ledger {
      display: grid;
      max-width: 520px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      margin-top: 38px;
      border: 1px solid rgba(201, 173, 97, 0.28);
      background: rgba(201, 173, 97, 0.28);
    }

    .ledger-cell {
      min-height: 62px;
      padding: 10px 12px;
      background: rgba(8, 12, 10, 0.94);
    }

    .ledger-label,
    .ledger-value {
      display: block;
    }

    .ledger-label {
      margin-bottom: 3px;
      color: var(--bone-muted);
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .ledger-value {
      color: var(--gold-bright);
      font-family: var(--mono);
      font-size: 12px;
    }

    .reliquary-stage {
      position: relative;
      isolation: isolate;
      display: grid;
      min-height: 570px;
      place-items: center;
      overflow: hidden;
    }

    .reliquary-stage::before {
      position: absolute;
      inset: 7% 4%;
      z-index: -3;
      border: 1px solid rgba(243, 238, 225, 0.14);
      clip-path: polygon(0 14px, 14px 14px, 14px 0, calc(100% - 14px) 0, calc(100% - 14px) 14px, 100% 14px, 100% calc(100% - 14px), calc(100% - 14px) calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 14px calc(100% - 14px), 0 calc(100% - 14px));
      content: "";
      background:
        linear-gradient(90deg, transparent 49.8%, rgba(140, 255, 108, 0.08) 50%, transparent 50.2%),
        linear-gradient(transparent 49.8%, rgba(140, 255, 108, 0.07) 50%, transparent 50.2%);
      box-shadow: inset 0 0 64px rgba(201, 173, 97, 0.035);
    }

    .reliquary-stage::after {
      position: absolute;
      inset: 13% 10%;
      z-index: -2;
      border-radius: 50%;
      content: "";
      background: radial-gradient(circle, rgba(140, 255, 108, 0.12), rgba(140, 255, 108, 0.025) 34%, transparent 65%);
      filter: blur(18px);
      animation: core-aura 5s ease-in-out infinite;
    }

    .stage-index {
      position: absolute;
      z-index: 4;
      color: var(--bone-muted);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .stage-index--top {
      top: 9%;
      left: 8%;
    }

    .stage-index--bottom {
      right: 8%;
      bottom: 9%;
      text-align: right;
    }

    .orbit {
      position: absolute;
      width: 430px;
      height: 430px;
      border: 1px solid rgba(201, 173, 97, 0.24);
      border-radius: 50%;
      transform: rotate(-12deg);
    }

    .orbit::before,
    .orbit::after {
      position: absolute;
      border-radius: 50%;
      content: "";
    }

    .orbit::before {
      inset: 25px;
      border: 1px dashed rgba(243, 238, 225, 0.16);
    }

    .orbit::after {
      top: 50%;
      left: -3px;
      width: 7px;
      height: 7px;
      background: var(--venom);
      box-shadow: 426px 0 0 var(--artery), 213px -213px 0 var(--gold);
      animation: orbit-blink 3.3s steps(2, end) infinite;
    }

    .orbit--inner {
      width: 322px;
      height: 322px;
      border-color: rgba(140, 255, 108, 0.17);
      transform: rotate(28deg);
    }

    .specimen-layer {
      position: absolute;
      z-index: -1;
      width: 180px;
      height: 360px;
      border: 1px solid rgba(243, 238, 225, 0.16);
      border-radius: 48% 48% 42% 42% / 20% 20% 72% 72%;
      background: linear-gradient(90deg, transparent, rgba(243, 238, 225, 0.035), transparent);
      transition: transform 760ms var(--ease-organic), opacity 500ms ease;
    }

    .specimen-layer--one {
      transform: translate(-18px, 12px) rotate(-4deg);
      opacity: 0.7;
    }

    .specimen-layer--two {
      transform: translate(18px, -10px) rotate(4deg);
      opacity: 0.55;
    }

    .layers-raised .specimen-layer--one {
      transform: translate(-78px, -28px) rotate(-10deg);
      opacity: 0.9;
    }

    .layers-raised .specimen-layer--two {
      transform: translate(78px, -52px) rotate(10deg);
      opacity: 0.76;
    }

    .relic {
      position: relative;
      z-index: 2;
      width: 242px;
      height: 444px;
      filter: drop-shadow(0 28px 44px rgba(0, 0, 0, 0.72));
    }

    .relic-spine {
      position: absolute;
      top: 55px;
      bottom: 48px;
      left: 50%;
      width: 22px;
      z-index: 2;
      border: 1px solid var(--gold-dark);
      border-radius: 12px;
      background:
        repeating-linear-gradient(180deg, rgba(243, 238, 225, 0.95) 0 8px, rgba(201, 173, 97, 0.65) 9px 11px, #181b17 12px 20px);
      box-shadow: inset 3px 0 0 rgba(255, 255, 255, 0.24), 0 0 22px rgba(201, 173, 97, 0.18);
      transform: translateX(-50%);
    }

    .carapace {
      position: absolute;
      top: 24px;
      bottom: 20px;
      width: 122px;
      z-index: 3;
      border: 1px solid rgba(240, 215, 135, 0.64);
      background:
        radial-gradient(circle at 48% 38%, rgba(140, 255, 108, 0.12), transparent 26%),
        linear-gradient(120deg, rgba(243, 238, 225, 0.48), transparent 18%),
        linear-gradient(154deg, #775d42 0%, #d1c68f 11%, #342b2b 22%, #6a7870 34%, #1a1717 48%, #a58b54 68%, #2e443d 78%, #100f0e 100%);
      box-shadow:
        inset 0 0 0 4px rgba(7, 10, 9, 0.38),
        inset 0 0 30px rgba(0, 0, 0, 0.68),
        0 0 0 1px rgba(243, 238, 225, 0.08),
        0 0 28px rgba(201, 173, 97, 0.12);
      transition: transform 840ms var(--ease-organic), filter 500ms ease;
    }

    .carapace::before,
    .carapace::after {
      position: absolute;
      content: "";
    }

    .carapace::before {
      inset: 12px;
      border: 1px dashed rgba(240, 215, 135, 0.58);
    }

    .carapace::after {
      top: 22%;
      bottom: 20%;
      width: 11px;
      border: 1px solid rgba(243, 238, 225, 0.42);
      background:
        radial-gradient(circle, var(--bone) 0 2px, transparent 2.5px) center top / 7px 18px repeat-y,
        linear-gradient(90deg, #bcae8f, #f3eee1 48%, #9f9273);
      box-shadow: 0 0 9px rgba(243, 238, 225, 0.18);
    }

    .carapace--left {
      left: 0;
      border-radius: 78% 22% 28% 72% / 16% 32% 68% 84%;
      clip-path: polygon(25% 0, 100% 10%, 87% 31%, 100% 50%, 87% 70%, 100% 91%, 22% 100%, 0 77%, 8% 51%, 0 22%);
      transform-origin: 100% 50%;
    }

    .carapace--left::after {
      right: 3px;
    }

    .carapace--right {
      right: 0;
      border-radius: 22% 78% 72% 28% / 32% 16% 84% 68%;
      clip-path: polygon(0 10%, 75% 0, 100% 22%, 92% 51%, 100% 77%, 78% 100%, 0 91%, 13% 70%, 0 50%, 13% 31%);
      transform-origin: 0 50%;
    }

    .carapace--right::after {
      left: 3px;
    }

    .is-unsealed .carapace--left {
      transform: translateX(-36px) rotate(-7deg);
      filter: saturate(1.18) brightness(1.08);
    }

    .is-unsealed .carapace--right {
      transform: translateX(36px) rotate(7deg);
      filter: saturate(1.18) brightness(1.08);
    }

    .rib {
      position: absolute;
      top: calc(92px + var(--rib) * 39px);
      z-index: 4;
      width: 79px;
      height: 30px;
      border-top: 5px solid var(--bone);
      opacity: 0.78;
      filter: drop-shadow(0 0 4px rgba(243, 238, 225, 0.25));
      transition: transform 640ms var(--ease-organic);
    }

    .rib--left {
      left: 20px;
      border-left: 2px solid var(--gold);
      border-radius: 80% 0 0;
      transform: rotate(calc(-4deg - var(--rib) * 1.2deg));
      transform-origin: right center;
    }

    .rib--right {
      right: 20px;
      border-right: 2px solid var(--gold);
      border-radius: 0 80% 0 0;
      transform: rotate(calc(4deg + var(--rib) * 1.2deg));
      transform-origin: left center;
    }

    .is-unsealed .rib--left {
      transform: translateX(-22px) rotate(-15deg);
    }

    .is-unsealed .rib--right {
      transform: translateX(22px) rotate(15deg);
    }

    .iris-core {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 8;
      width: 102px;
      height: 102px;
      padding: 0;
      border: 1px solid var(--gold-bright);
      border-radius: 50%;
      appearance: none;
      background:
        radial-gradient(circle, #020503 0 12%, var(--venom) 13% 16%, #0c1a10 17% 29%, transparent 30%),
        repeating-conic-gradient(from 5deg, #d8c374 0 7deg, #2f352a 8deg 20deg);
      box-shadow:
        inset 0 0 0 6px #0a0c0a,
        inset 0 0 0 8px rgba(243, 238, 225, 0.34),
        0 0 0 9px rgba(201, 173, 97, 0.14),
        0 0 26px rgba(140, 255, 108, 0.44);
      transform: translate(-50%, -50%) rotate(0deg);
      transition: transform 760ms var(--ease-organic), box-shadow 360ms ease;
    }

    .iris-core::before,
    .iris-core::after {
      position: absolute;
      inset: 16px;
      border-radius: 50%;
      content: "";
    }

    .iris-core::before {
      border: 1px dashed rgba(140, 255, 108, 0.78);
    }

    .iris-core::after {
      inset: 38px;
      background: var(--obsidian);
      box-shadow: 0 0 0 3px var(--venom), 0 0 18px var(--venom);
      transform: scale(0.9);
      transition: transform 680ms var(--ease-organic), background 240ms ease;
    }

    .iris-core:hover {
      box-shadow:
        inset 0 0 0 6px #0a0c0a,
        inset 0 0 0 8px rgba(243, 238, 225, 0.52),
        0 0 0 11px rgba(201, 173, 97, 0.18),
        0 0 38px rgba(140, 255, 108, 0.66);
    }

    .iris-core:active {
      transform: translate(-50%, -50%) scale(0.94) rotate(7deg);
    }

    .is-unsealed .iris-core {
      transform: translate(-50%, -50%) rotate(48deg) scale(1.08);
    }

    .is-unsealed .iris-core::after {
      background: var(--venom);
      transform: scale(0.46);
    }

    .neural-line {
      position: absolute;
      z-index: 5;
      width: 2px;
      height: 92px;
      overflow: visible;
      background: linear-gradient(transparent, var(--venom), transparent);
      box-shadow: 0 0 12px rgba(140, 255, 108, 0.6);
      opacity: 0.68;
      transform-origin: bottom center;
    }

    .neural-line::before,
    .neural-line::after {
      position: absolute;
      width: 5px;
      height: 5px;
      border: 1px solid var(--venom);
      border-radius: 50%;
      content: "";
    }

    .neural-line::before {
      top: 16%;
      left: -2px;
    }

    .neural-line::after {
      right: -2px;
      bottom: 8%;
    }

    .neural-line--a {
      top: 120px;
      left: 74px;
      transform: rotate(-28deg);
    }

    .neural-line--b {
      right: 70px;
      bottom: 112px;
      transform: rotate(31deg);
    }

    .neural-line--c {
      bottom: 42px;
      left: 50%;
      height: 72px;
      transform: rotate(7deg);
    }

    .is-pulsing .neural-line {
      animation: neural-flare 820ms steps(5, end) 2;
    }

    .fragment {
      position: absolute;
      z-index: 7;
      width: 8px;
      height: 14px;
      opacity: 0;
      background: var(--artery);
      clip-path: polygon(50% 0, 100% 72%, 65% 100%, 0 78%);
    }

    .fragment--a {
      top: 25%;
      left: 36%;
    }

    .fragment--b {
      top: 47%;
      right: 31%;
    }

    .fragment--c {
      bottom: 19%;
      left: 43%;
    }

    .alert-mode .fragment {
      animation: decay-fall 1.55s ease-in infinite;
    }

    .alert-mode .fragment--b {
      animation-delay: 330ms;
    }

    .alert-mode .fragment--c {
      animation-delay: 710ms;
    }

    .alert-mode .reliquary-stage::after {
      background: radial-gradient(circle, rgba(255, 95, 89, 0.16), rgba(255, 95, 89, 0.03) 38%, transparent 68%);
    }

    .btn {
      position: relative;
      isolation: isolate;
      min-height: 46px;
      padding: 11px 19px;
      border: 1px solid transparent;
      appearance: none;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      line-height: 1.2;
      text-transform: uppercase;
      transition: color 180ms ease, background 180ms ease, border-color 180ms ease, box-shadow 180ms ease, transform 120ms ease;
    }

    .btn::before,
    .btn::after {
      position: absolute;
      z-index: -1;
      content: "";
      transition: inherit;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .btn:active:not(:disabled) {
      transform: translateY(1px) scale(0.985);
    }

    .btn--primary {
      color: #090a08;
      border-color: var(--gold-bright);
      background: linear-gradient(110deg, var(--gold-dark), var(--gold-bright) 32%, #aa8e49 62%, var(--gold));
      box-shadow: inset 0 0 0 2px rgba(7, 10, 9, 0.26), 0 8px 24px rgba(201, 173, 97, 0.16);
      clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px);
    }

    .btn--primary:hover {
      color: #030503;
      background: linear-gradient(110deg, var(--gold), #fff2b5 35%, var(--gold-bright));
      box-shadow: inset 0 0 0 2px rgba(7, 10, 9, 0.32), 0 0 26px rgba(201, 173, 97, 0.32);
    }

    .btn--secondary {
      color: var(--bone);
      border-color: var(--bone-muted);
      background: rgba(243, 238, 225, 0.055);
      box-shadow: inset 5px 0 0 var(--bone), inset -5px 0 0 var(--bone);
    }

    .btn--secondary::before {
      inset: 4px 9px;
      border-top: 1px dashed rgba(243, 238, 225, 0.35);
      border-bottom: 1px dashed rgba(243, 238, 225, 0.35);
    }

    .btn--secondary:hover {
      color: var(--obsidian);
      background: var(--bone);
    }

    .btn--neural {
      color: var(--venom);
      border-color: rgba(140, 255, 108, 0.5);
      background: rgba(140, 255, 108, 0.045);
      border-radius: 40px 6px 40px 6px;
      box-shadow: inset 0 0 18px rgba(140, 255, 108, 0.04);
    }

    .btn--neural::after {
      top: 50%;
      right: 10px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--venom);
      box-shadow: 0 0 10px var(--venom);
    }

    .btn--neural:hover {
      border-color: var(--venom);
      background: rgba(140, 255, 108, 0.12);
      box-shadow: inset 0 0 18px rgba(140, 255, 108, 0.09), 0 0 22px rgba(140, 255, 108, 0.12);
    }

    .btn--danger {
      color: #ffe6e2;
      border-color: var(--artery);
      background:
        repeating-linear-gradient(135deg, rgba(255, 95, 89, 0.14) 0 7px, rgba(255, 95, 89, 0.02) 7px 14px),
        rgba(125, 36, 35, 0.22);
    }

    .btn--danger:hover,
    .btn--danger[aria-pressed="true"] {
      color: #160403;
      background: var(--artery);
      box-shadow: 0 0 22px rgba(255, 95, 89, 0.3);
    }

    .btn--disabled,
    .btn:disabled {
      color: #77776f;
      border-color: #3b3e39;
      background: #151815;
      cursor: not-allowed;
      opacity: 0.72;
      box-shadow: inset 0 0 0 3px #0b0e0c;
    }

    .btn--compact {
      min-height: 38px;
      padding: 8px 13px;
      font-size: 9px;
    }

    .controls-wrap {
      position: relative;
      padding-block: 28px 110px;
    }

    .controls-wrap::before {
      position: absolute;
      top: 0;
      right: 24px;
      left: 24px;
      height: 1px;
      content: "";
      background: linear-gradient(90deg, transparent, var(--gold) 15%, var(--gold) 85%, transparent);
      opacity: 0.45;
    }

    .section-heading {
      display: grid;
      grid-template-columns: minmax(0, 0.65fr) minmax(300px, 0.35fr);
      gap: 40px;
      align-items: end;
      margin-bottom: 42px;
    }

    .section-heading h2 {
      margin-bottom: 0;
      font-family: var(--serif);
      font-size: clamp(46px, 6vw, 76px);
      font-weight: 600;
      line-height: 0.88;
      letter-spacing: -0.035em;
    }

    .section-heading p {
      margin-bottom: 2px;
      color: var(--bone-muted);
      font-size: 18px;
    }

    .control-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .control-panel {
      position: relative;
      min-width: 0;
      border: 1px solid var(--line);
      background:
        linear-gradient(135deg, rgba(243, 238, 225, 0.045), transparent 35%),
        rgba(12, 16, 14, 0.84);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.72), 0 22px 62px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(10px);
    }

    .control-panel::before,
    .control-panel::after {
      position: absolute;
      width: 13px;
      height: 13px;
      pointer-events: none;
      content: "";
    }

    .control-panel::before {
      top: -1px;
      left: -1px;
      border-top: 2px solid var(--gold);
      border-left: 2px solid var(--gold);
    }

    .control-panel::after {
      right: -1px;
      bottom: -1px;
      border-right: 2px solid var(--gold);
      border-bottom: 2px solid var(--gold);
    }

    .control-panel--wide {
      grid-column: 1 / -1;
    }

    .panel-head {
      display: flex;
      min-height: 54px;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.16);
    }

    .panel-code {
      color: var(--venom);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .panel-head h3 {
      margin: 0;
      color: var(--bone);
      font-family: var(--serif);
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .panel-body {
      padding: 24px;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(120px, 1fr));
    }

    .button-grid .btn {
      width: 100%;
    }

    .control-note {
      margin: 18px 0 0;
      color: var(--bone-muted);
      font-family: var(--mono);
      font-size: 10px;
      line-height: 1.65;
    }

    .form-stack {
      display: grid;
      gap: 22px;
    }

    .field-label,
    legend {
      display: block;
      margin-bottom: 8px;
      color: var(--bone);
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    fieldset {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .specimen-input {
      position: relative;
    }

    .specimen-input::before,
    .specimen-input::after {
      position: absolute;
      top: 50%;
      z-index: 2;
      width: 9px;
      height: 30px;
      pointer-events: none;
      content: "";
      border-top: 1px solid var(--gold);
      border-bottom: 1px solid var(--gold);
      transform: translateY(-50%);
    }

    .specimen-input::before {
      left: 8px;
      border-left: 2px solid var(--gold);
    }

    .specimen-input::after {
      right: 8px;
      border-right: 2px solid var(--gold);
    }

    .text-input {
      width: 100%;
      min-height: 50px;
      padding: 11px 28px;
      border: 1px solid var(--line-strong);
      border-radius: 0;
      outline: none;
      color: var(--bone);
      background:
        linear-gradient(90deg, rgba(243, 238, 225, 0.06), transparent 24%, transparent 76%, rgba(243, 238, 225, 0.06)),
        #0b100d;
      caret-color: var(--venom);
      font-family: var(--mono);
      font-size: 13px;
      letter-spacing: 0.04em;
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }

    .text-input:hover {
      border-color: rgba(243, 238, 225, 0.62);
    }

    .text-input:focus {
      border-color: var(--venom);
      box-shadow: inset 0 0 22px rgba(140, 255, 108, 0.06), 0 0 0 2px rgba(140, 255, 108, 0.15);
    }

    .field-readout {
      min-height: 18px;
      margin-top: 7px;
      color: var(--venom);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.08em;
    }

    .radio-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .iris-radio {
      position: relative;
      min-width: 0;
    }

    .iris-radio input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .iris-radio label {
      display: flex;
      min-height: 72px;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      color: var(--bone-muted);
      background: rgba(243, 238, 225, 0.025);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.06em;
      transition: border-color 180ms ease, background 180ms ease, color 180ms ease, transform 120ms ease;
    }

    .iris-radio label::before {
      width: 27px;
      height: 27px;
      flex: 0 0 auto;
      border: 1px solid var(--gold-dark);
      border-radius: 50%;
      content: "";
      background: radial-gradient(circle, transparent 0 4px, var(--obsidian) 5px 8px, rgba(201, 173, 97, 0.35) 9px 11px, transparent 12px);
      box-shadow: inset 0 0 0 3px var(--obsidian);
      transition: background 220ms ease, box-shadow 220ms ease, transform 220ms ease;
    }

    .iris-radio label:hover {
      color: var(--bone);
      border-color: var(--gold);
    }

    .iris-radio input:checked + label {
      color: var(--venom);
      border-color: var(--venom);
      background: rgba(140, 255, 108, 0.06);
    }

    .iris-radio input:checked + label::before {
      background: radial-gradient(circle, var(--venom) 0 4px, #122412 5px 8px, var(--gold-bright) 9px 11px, transparent 12px);
      box-shadow: inset 0 0 0 3px var(--obsidian), 0 0 12px rgba(140, 255, 108, 0.4);
      transform: rotate(38deg);
    }

    .iris-radio input:focus-visible + label {
      outline: 2px solid var(--venom);
      outline-offset: 3px;
    }

    .bone-check {
      display: flex;
      align-items: center;
      gap: 12px;
      width: fit-content;
      max-width: 100%;
      color: var(--bone-muted);
      font-size: 16px;
    }

    .bone-check input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .bone-box {
      position: relative;
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      border: 1px solid var(--gold);
      background: linear-gradient(135deg, #efe7d4, #a89e86);
      clip-path: polygon(18% 0, 85% 5%, 100% 28%, 93% 85%, 68% 100%, 8% 88%, 0 20%);
      box-shadow: inset 0 0 0 4px rgba(7, 10, 9, 0.2);
    }

    .bone-box::before,
    .bone-box::after {
      position: absolute;
      content: "";
      opacity: 0;
      transition: opacity 160ms ease, transform 180ms var(--ease-organic);
    }

    .bone-box::before {
      top: 13px;
      left: 7px;
      width: 17px;
      height: 2px;
      background: var(--obsidian);
      transform: rotate(-49deg) scaleX(0);
      transform-origin: left center;
    }

    .bone-box::after {
      top: 15px;
      left: 5px;
      width: 8px;
      height: 2px;
      background: var(--obsidian);
      transform: rotate(47deg) scaleX(0);
      transform-origin: left center;
    }

    .bone-check input:checked + .bone-box::before,
    .bone-check input:checked + .bone-box::after {
      opacity: 1;
      transform: rotate(-49deg) scaleX(1);
    }

    .bone-check input:checked + .bone-box::after {
      transform: rotate(47deg) scaleX(1);
    }

    .bone-check input:focus-visible + .bone-box {
      outline: 2px solid var(--venom);
      outline-offset: 4px;
    }

    .mechanism-stack {
      display: grid;
      gap: 26px;
    }

    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .switch-copy strong,
    .switch-copy small {
      display: block;
    }

    .switch-copy strong {
      margin-bottom: 2px;
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 600;
    }

    .switch-copy small {
      color: var(--bone-muted);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.06em;
    }

    .vertebra-switch {
      position: relative;
      flex: 0 0 auto;
    }

    .vertebra-switch input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .vertebra-track {
      position: relative;
      display: block;
      width: 98px;
      height: 38px;
      border: 1px solid var(--gold-dark);
      border-radius: 20px;
      background:
        repeating-linear-gradient(90deg, transparent 0 14px, rgba(201, 173, 97, 0.4) 14px 16px),
        #0a0d0b;
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.78);
      transition: border-color 220ms ease, box-shadow 220ms ease;
    }

    .vertebra-track::before {
      position: absolute;
      top: 4px;
      left: 5px;
      width: 28px;
      height: 28px;
      border: 1px solid #e8dfca;
      border-radius: 48% 52% 42% 58%;
      content: "";
      background:
        radial-gradient(circle, #2f312d 0 3px, transparent 4px),
        linear-gradient(135deg, var(--bone), #8e8675);
      box-shadow: inset 0 0 0 4px rgba(7, 10, 9, 0.2), 0 2px 9px rgba(0, 0, 0, 0.65);
      transition: transform 420ms var(--ease-organic), background 220ms ease, box-shadow 220ms ease;
    }

    .vertebra-switch input:checked + .vertebra-track {
      border-color: var(--venom);
      box-shadow: inset 0 0 18px rgba(140, 255, 108, 0.12), 0 0 16px rgba(140, 255, 108, 0.12);
    }

    .vertebra-switch input:checked + .vertebra-track::before {
      background:
        radial-gradient(circle, var(--venom) 0 3px, transparent 4px),
        linear-gradient(135deg, #e8f4d9, #738966);
      box-shadow: inset 0 0 0 4px rgba(7, 10, 9, 0.2), 0 0 14px rgba(140, 255, 108, 0.48);
      transform: translateX(59px) rotate(168deg);
    }

    .vertebra-switch input:focus-visible + .vertebra-track {
      outline: 2px solid var(--venom);
      outline-offset: 4px;
    }

    .slider-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
    }

    .slider-label {
      grid-column: 1 / -1;
      margin-bottom: -7px;
    }

    .neural-slider {
      width: 100%;
      height: 32px;
      margin: 0;
      appearance: none;
      outline: none;
      background: transparent;
    }

    .neural-slider::-webkit-slider-runnable-track {
      height: 5px;
      border: 1px solid rgba(140, 255, 108, 0.56);
      border-radius: 0;
      background:
        repeating-linear-gradient(90deg, transparent 0 9%, rgba(140, 255, 108, 0.35) 9% 10%),
        #101812;
      box-shadow: 0 0 9px rgba(140, 255, 108, 0.12);
    }

    .neural-slider::-moz-range-track {
      height: 5px;
      border: 1px solid rgba(140, 255, 108, 0.56);
      border-radius: 0;
      background:
        repeating-linear-gradient(90deg, transparent 0 9%, rgba(140, 255, 108, 0.35) 9% 10%),
        #101812;
      box-shadow: 0 0 9px rgba(140, 255, 108, 0.12);
    }

    .neural-slider::-webkit-slider-thumb {
      width: 22px;
      height: 22px;
      margin-top: -9px;
      border: 2px solid var(--obsidian);
      border-radius: 50% 36% 50% 42%;
      appearance: none;
      background: var(--venom);
      box-shadow: 0 0 0 1px var(--gold), 0 0 16px rgba(140, 255, 108, 0.62);
      transition: transform 130ms ease;
    }

    .neural-slider::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border: 2px solid var(--obsidian);
      border-radius: 50% 36% 50% 42%;
      background: var(--venom);
      box-shadow: 0 0 0 1px var(--gold), 0 0 16px rgba(140, 255, 108, 0.62);
    }

    .neural-slider:hover::-webkit-slider-thumb,
    .neural-slider:active::-webkit-slider-thumb {
      transform: scale(1.13) rotate(18deg);
    }

    .neural-slider:focus-visible {
      outline: 2px solid var(--venom);
      outline-offset: 2px;
    }

    .slider-output {
      min-width: 62px;
      padding: 7px 9px;
      border-left: 2px solid var(--gold);
      color: var(--venom);
      background: rgba(140, 255, 108, 0.04);
      font-family: var(--mono);
      font-size: 11px;
      text-align: right;
    }

    .custom-select {
      position: relative;
    }

    .select-trigger {
      position: relative;
      display: flex;
      width: 100%;
      min-height: 50px;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 10px 42px 10px 16px;
      border: 1px solid var(--line-strong);
      border-radius: 0;
      color: var(--bone);
      background:
        linear-gradient(110deg, rgba(243, 238, 225, 0.065), transparent 32%),
        rgba(6, 10, 8, 0.9);
      font-family: var(--mono);
      font-size: 11px;
      text-align: left;
    }

    .select-trigger::before,
    .select-trigger::after {
      position: absolute;
      content: "";
    }

    .select-trigger::before {
      top: 9px;
      right: 12px;
      width: 18px;
      height: 18px;
      border: 1px solid var(--gold);
      transform: rotate(45deg);
      transition: transform 240ms var(--ease-organic), background 160ms ease;
    }

    .select-trigger::after {
      top: 16px;
      right: 18px;
      width: 6px;
      height: 6px;
      border-right: 1px solid var(--venom);
      border-bottom: 1px solid var(--venom);
      transform: rotate(45deg);
    }

    .select-trigger[aria-expanded="true"] {
      border-color: var(--venom);
      box-shadow: 0 0 0 2px rgba(140, 255, 108, 0.1);
    }

    .select-trigger[aria-expanded="true"]::before {
      background: rgba(140, 255, 108, 0.1);
      transform: rotate(135deg);
    }

    .select-list {
      position: absolute;
      top: calc(100% + 7px);
      right: 0;
      left: 0;
      z-index: 18;
      margin: 0;
      padding: 6px;
      border: 1px solid var(--gold);
      background: rgba(7, 11, 9, 0.98);
      box-shadow: 8px 9px 0 rgba(201, 173, 97, 0.12), 0 20px 44px rgba(0, 0, 0, 0.7);
      list-style: none;
      backdrop-filter: blur(14px);
    }

    .select-option {
      position: relative;
      display: block;
      width: 100%;
      min-height: 42px;
      padding: 9px 12px 9px 31px;
      border: 0;
      color: var(--bone-muted);
      background: transparent;
      font-family: var(--mono);
      font-size: 10px;
      text-align: left;
    }

    .select-option::before {
      position: absolute;
      top: 50%;
      left: 11px;
      width: 7px;
      height: 7px;
      border: 1px solid var(--gold);
      content: "";
      transform: translateY(-50%) rotate(45deg);
    }

    .select-option:hover,
    .select-option:focus-visible,
    .select-option[aria-selected="true"] {
      outline: none;
      color: var(--obsidian);
      background: var(--bone);
    }

    .select-option[aria-selected="true"]::before {
      border-color: var(--obsidian);
      background: var(--venom);
      box-shadow: 0 0 0 2px var(--bone);
    }

    .archive-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.18fr) minmax(300px, 0.82fr);
      gap: 26px;
    }

    .tabs {
      min-width: 0;
      border: 1px solid var(--line);
      background:
        repeating-linear-gradient(90deg, transparent 0 31px, rgba(243, 238, 225, 0.025) 32px),
        rgba(4, 8, 6, 0.5);
    }

    .tab-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border-bottom: 1px solid var(--line);
    }

    .tab-button {
      position: relative;
      min-width: 0;
      min-height: 48px;
      padding: 10px;
      border: 0;
      border-right: 1px solid var(--line);
      color: var(--bone-muted);
      background: transparent;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .tab-button:last-child {
      border-right: 0;
    }

    .tab-button::after {
      position: absolute;
      right: 10px;
      bottom: -1px;
      left: 10px;
      height: 3px;
      content: "";
      background: var(--venom);
      opacity: 0;
      transform: scaleX(0.25);
      transition: opacity 180ms ease, transform 240ms var(--ease-organic);
    }

    .tab-button:hover {
      color: var(--bone);
      background: rgba(243, 238, 225, 0.04);
    }

    .tab-button[aria-selected="true"] {
      color: var(--venom);
      background: rgba(140, 255, 108, 0.055);
    }

    .tab-button[aria-selected="true"]::after {
      opacity: 1;
      transform: scaleX(1);
    }

    .tab-panel {
      min-height: 190px;
      padding: 24px;
    }

    .tab-panel h4 {
      margin: 0 0 10px;
      font-family: var(--serif);
      font-size: 30px;
      font-weight: 600;
    }

    .tab-panel p {
      max-width: 54ch;
      margin-bottom: 22px;
      color: var(--bone-muted);
      font-size: 17px;
    }

    .archive-stamp {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 7px 10px;
      border: 1px solid var(--gold);
      color: var(--gold-bright);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transform: rotate(-1deg);
    }

    .archive-stamp::before {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      content: "";
      background: var(--venom);
      box-shadow: 0 0 8px var(--venom);
    }

    .instrument-stack {
      display: grid;
      align-content: start;
      gap: 18px;
    }

    .instrument {
      border: 1px solid var(--line);
      padding: 18px;
      background: rgba(243, 238, 225, 0.025);
    }

    .instrument-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 13px;
    }

    .instrument-title {
      color: var(--bone);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .instrument-value {
      color: var(--venom);
      font-family: var(--mono);
      font-size: 11px;
    }

    .segment-progress {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 3px;
      height: 17px;
      align-items: stretch;
      padding: 3px;
      border-top: 1px solid var(--gold-dark);
      border-bottom: 1px solid var(--gold-dark);
      background: #080b09;
    }

    .progress-segment {
      background: #252923;
      clip-path: polygon(0 0, 82% 0, 100% 50%, 82% 100%, 0 100%, 14% 50%);
      transition: background 180ms ease, box-shadow 180ms ease;
    }

    .progress-segment.is-active {
      background: var(--venom);
      box-shadow: 0 0 9px rgba(140, 255, 108, 0.65);
    }

    .meter-wrap {
      display: grid;
      grid-template-columns: 110px minmax(0, 1fr);
      align-items: center;
      gap: 18px;
    }

    .relic-meter {
      position: relative;
      display: grid;
      width: 110px;
      height: 110px;
      place-items: center;
      border-radius: 50%;
      background: conic-gradient(var(--venom) 0 calc(var(--meter-value) * 1%), rgba(243, 238, 225, 0.08) calc(var(--meter-value) * 1%) 100%);
      box-shadow: 0 0 20px rgba(140, 255, 108, 0.08);
    }

    .relic-meter::before {
      position: absolute;
      inset: 10px;
      border: 1px solid var(--gold-dark);
      border-radius: 50%;
      content: "";
      background:
        repeating-conic-gradient(from -1deg, transparent 0 8deg, rgba(201, 173, 97, 0.46) 9deg 10deg),
        var(--obsidian-soft);
      box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.7);
    }

    .relic-meter::after {
      position: absolute;
      inset: 24px;
      border: 1px solid var(--line);
      border-radius: 50%;
      content: "";
      background: var(--obsidian);
    }

    .meter-value {
      position: relative;
      z-index: 2;
      color: var(--bone);
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 600;

    .meter-copy {

      font-family: var(--mono);
      font-size: 9px;
      line-height: 1.65;

    .apparatus-actions {

      margin-top: 24px;

    .action-card {
      position: relative;
      min-width: 0;
      min-height: 116px;
      padding: 16px;
      border: 1px solid var(--line);
      color: var(--bone);
      background: rgba(243, 238, 225, 0.025);
      text-align: left;
      transition: transform 150ms ease, border-color 180ms ease, background 180ms ease;

    .action-card::before {
      position: absolute;
      top: 13px;
      right: 13px;
      width: 11px;
      height: 11px;
      border: 1px solid var(--gold);
      content: "";
      transform: rotate(45deg);

    .action-card strong,
    .action-card small {
      display: block;
      max-width: calc(100% - 26px);

    .action-card strong {
      margin-bottom: 7px;
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 600;
    }

    .action-card small {
      color: var(--bone-muted);
      font-family: var(--mono);
      font-size: 9px;
      line-height: 1.5;
    }

    .action-card:hover {
      border-color: var(--gold);
      background: rgba(201, 173, 97, 0.06);
      transform: translateY(-2px);
    }

    .action-card:active {
      transform: translateY(1px);
    }

    .action-card--alert::before {
      border-color: var(--artery);
    }

    .action-card--signal::before {
      border-color: var(--venom);
      border-radius: 50%;
      box-shadow: 0 0 9px rgba(140, 255, 108, 0.5);
    }

    .tooltip-wrap {
      position: relative;
    }

    .tooltip {
      position: absolute;
      right: 8px;
      bottom: calc(100% + 10px);
      z-index: 25;
      width: min(230px, calc(100vw - 50px));
      padding: 10px 12px;
      border: 1px solid var(--venom);
      color: var(--bone);
      background: rgba(5, 10, 7, 0.98);
      box-shadow: 6px 6px 0 rgba(140, 255, 108, 0.12);
      font-family: var(--mono);
      font-size: 9px;
      line-height: 1.55;
      opacity: 0;
      pointer-events: none;
      transform: translateY(5px);
      transition: opacity 160ms ease, transform 180ms ease;
    }

    .tooltip-wrap:hover .tooltip,
    .tooltip-wrap:focus-within .tooltip {
      opacity: 1;
      transform: translateY(0);
    }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 80;
      display: grid;
      width: min(390px, calc(100vw - 48px));
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--venom);
      color: var(--bone);
      background:
        linear-gradient(110deg, rgba(140, 255, 108, 0.1), transparent 45%),
        rgba(7, 11, 9, 0.97);
      box-shadow: 10px 10px 0 rgba(140, 255, 108, 0.09), 0 18px 46px rgba(0, 0, 0, 0.72);
      font-family: var(--mono);
      font-size: 10px;
      animation: toast-arrive 340ms var(--ease-organic);

    .toast-mark {
      width: 14px;
      height: 14px;
      border: 1px solid var(--gold);
      background: var(--venom);
      box-shadow: inset 0 0 0 3px var(--obsidian), 0 0 12px rgba(140, 255, 108, 0.54);
      transform: rotate(45deg);
    }

    .toast-close,
    .dialog-close {
      display: grid;
      width: 34px;
      height: 34px;
      padding: 0;
      place-items: center;
      border: 1px solid var(--line-strong);
      color: var(--bone);
      background: transparent;
      font-family: var(--mono);
      font-size: 15px;
    }

    .toast-close:hover,
    .dialog-close:hover {
      color: var(--obsidian);
      border-color: var(--bone);
      background: var(--bone);
    }

    dialog {
      width: min(620px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      padding: 0;
      overflow: auto;
      border: 1px solid var(--gold);
      color: var(--bone);
      background:
        linear-gradient(135deg, rgba(243, 238, 225, 0.08), transparent 34%),
        #090e0b;
      box-shadow: 0 36px 100px rgba(0, 0, 0, 0.92), inset 0 0 50px rgba(201, 173, 97, 0.035);
    }

    dialog::backdrop {
      background:
        radial-gradient(circle at center, rgba(140, 255, 108, 0.075), rgba(0, 0, 0, 0.88)),
        rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(6px);
    }

    .dialog-frame {
      position: relative;
      padding: 28px;
    }

    .dialog-frame::before,
    .dialog-frame::after {
      position: absolute;
      inset: 10px;
      pointer-events: none;
      content: "";
    }

    .dialog-frame::before {
      border: 1px solid rgba(243, 238, 225, 0.13);
    }

    .dialog-frame::after {
      inset: 17px;
      border-top: 1px dashed rgba(201, 173, 97, 0.35);
      border-bottom: 1px dashed rgba(201, 173, 97, 0.35);
    }

    .dialog-head,
    .dialog-body,
    .dialog-actions {
      position: relative;
      z-index: 1;
    }

    .dialog-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    .dialog-kicker {
      display: block;
      margin-bottom: 5px;
      color: var(--artery);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .dialog-head h2 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(34px, 7vw, 50px);
      font-weight: 600;
      line-height: 0.92;
    }

    .dialog-body {
      padding-block: 24px;
    }

    .dialog-body p {
      color: var(--bone-muted);
      font-size: 18px;
    }

    .seal-diagram {
      position: relative;
      display: grid;
      width: 116px;
      height: 116px;
      margin: 22px auto;
      place-items: center;
      border: 1px solid var(--gold);
      border-radius: 50%;
      background:
        repeating-conic-gradient(transparent 0 14deg, rgba(201, 173, 97, 0.3) 15deg 16deg),
        radial-gradient(circle, rgba(255, 95, 89, 0.18), transparent 60%);
      animation: seal-turn 12s linear infinite;
    }

    .seal-diagram::before {
      width: 58px;
      height: 58px;
      border: 1px solid var(--bone);
      content: "";
      transform: rotate(45deg);
      box-shadow: inset 0 0 0 8px var(--obsidian), inset 0 0 0 10px var(--artery);
    }

    .dialog-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 12px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    footer {
      position: relative;
      width: 100%;
      border-top: 1px solid rgba(201, 173, 97, 0.42);
      background: #050706;
    }

    .footer-inner {
      display: flex;
      min-height: 110px;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      color: var(--bone-muted);
    }

    .footer-line {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(20px, 3vw, 29px);
      font-style: italic;
    }

    .footer-code {
      color: var(--venom);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.14em;
      text-align: right;
      text-transform: uppercase;
    }

    .noscript-message {
      position: relative;
      z-index: 50;
      max-width: 760px;
      margin: 30px auto;
      padding: 24px;
      border: 1px solid var(--gold);
      color: var(--bone);
      background: var(--obsidian-soft);
    }

    .noscript-message h1 {
      margin-bottom: 16px;
      font-size: 54px;
      line-height: 0.9;
    }

    .noscript-message p {
      color: var(--bone-muted);
    }

    :focus-visible {
      outline: 2px solid var(--venom);
      outline-offset: 4px;
    }

    @keyframes status-breath {
      0%,
      100% {
        opacity: 0.55;
        transform: scale(0.82);
      }
      50% {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    @keyframes core-aura {
      0%,
      100% {
        opacity: 0.48;
        transform: scale(0.94);
      }
      50% {
        opacity: 1;
        transform: scale(1.08);
      }
    }

    @keyframes orbit-blink {
      0%,
      72%,
      100% {
        opacity: 0.42;
      }
      74%,
      92% {
        opacity: 1;
      }
    }

    @keyframes neural-flare {
      0% {
        filter: brightness(0.8);
        opacity: 0.45;
      }
      42% {
        filter: brightness(2.3);
        opacity: 1;
      }
      100% {
        filter: brightness(0.9);
        opacity: 0.58;
      }
    }

    @keyframes decay-fall {
      0% {
        opacity: 0;
        transform: translate(0, -8px) rotate(0);
      }
      20% {
        opacity: 0.88;
      }
      100% {
        opacity: 0;
        transform: translate(34px, 104px) rotate(170deg) scale(0.35);
      }
    }

    @keyframes toast-arrive {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes seal-turn {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 980px) {
      .hero {
        grid-template-columns: minmax(0, 0.9fr) minmax(350px, 1.1fr);
        gap: 20px;
      }

      .button-grid {
        grid-template-columns: repeat(3, minmax(130px, 1fr));
      }

      .archive-layout {
        grid-template-columns: 1fr;
      }

      .instrument-stack {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .instrument:last-child {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 760px) {
      .shell {
        padding-inline: 16px;
      }

      .world-bar__inner {
        min-height: 56px;
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
        gap: 3px;
      }

      .world-state {
        padding-left: 19px;
        text-align: left;
      }

      .hero {
        min-height: 0;
        grid-template-columns: 1fr;
        gap: 12px;
        padding-block: 66px 62px;
      }

      .hero::before {
        display: none;
      }

      h1 {
        max-width: 520px;
        font-size: clamp(58px, 20vw, 86px);
      }

      .hero-deck {
        font-size: 19px;
      }

      .micro-ledger {
        margin-top: 28px;
      }

      .reliquary-stage {
        min-height: 520px;
        margin-inline: -16px;
      }

      .orbit {
        width: 390px;
        height: 390px;
      }

      .orbit--inner {
        width: 292px;
        height: 292px;
      }

      .relic {
        transform: scale(0.9);
      }

      .section-heading {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .control-grid {
        grid-template-columns: 1fr;
      }

      .control-panel--wide {
        grid-column: auto;
      }

      .button-grid,
      .apparatus-actions,
      .instrument-stack {
        grid-template-columns: 1fr;
      }

      .instrument:last-child {
        grid-column: auto;
      }

      .panel-body {
        padding: 20px 16px;
      }

      .archive-layout {
        gap: 18px;
      }

      .footer-inner {
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
        padding-block: 28px;
      }

      .footer-code {
        text-align: left;
      }
    }

    @media (max-width: 430px) {
      .world-state {
        font-size: 8px;
      }

      .hero-actions {
        display: grid;
        grid-template-columns: 1fr;
      }

      .hero-actions .btn {
        width: 100%;
      }

      .micro-ledger {
        grid-template-columns: 1fr;
      }

      .ledger-cell {
        min-height: 50px;
      }

      .reliquary-stage {
        min-height: 475px;
      }

      .relic {
        transform: scale(0.81);
      }

      .orbit {
        width: 350px;
        height: 350px;
      }

      .orbit--inner {
        width: 260px;
        height: 260px;
      }

      .stage-index {
        font-size: 8px;
      }

      .radio-grid,
      .tab-list {
        grid-template-columns: 1fr;
      }

      .tab-button {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .tab-button:last-child {
        border-bottom: 0;
      }

      .switch-row {
        align-items: flex-start;
        flex-direction: column;
      }

      .slider-row {
        gap: 10px;
      }

      .meter-wrap {
        grid-template-columns: 1fr;
        justify-items: center;
        text-align: center;
      }

      .toast {
        right: 16px;
        bottom: 16px;
        width: calc(100vw - 32px);
      }

      .dialog-frame {
        padding: 23px;
      }

      .dialog-actions {
        display: grid;
      }

      .dialog-actions .btn {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
  <noscript>
    <style>
      .world-bar,

        display: none;
      }
    </style>
  </noscript>
</head>

    (() => {
      "use strict";

      const copy = {

        panelFourTitle: "Readout & intervention",
        tabProvenance: "Provenance",
        tabAnatomy: "Anatomy",
        tabProtocol: "Protocol",
        provenanceTitle: "Recovered without a shadow",

        provenanceStamp: "Witnessed / ledger 883",
        anatomyTitle: "Bone learns; metal remembers",

        anatomyStamp: "Morphology / unresolved",
        protocolTitle: "Preservation is a negotiated state",
        protocolBody: "Never expose the iris without an active spine lock. If arterial red appears, close the chamber and allow every loose fragment to finish falling.",
        protocolStamp: "Custody / mandatory",
        progressTitle: "Archive scan",
        scanButton: "Continue scan",
        scanComplete: "Scan complete",
        meterTitle: "Relic integrity meter",
        meterBody: "The dial weighs shell tension, bone memory, and neural coherence.",
        meterButton: "Rebalance",
        modalActionTitle: "Open vessel",
        modalActionBody: "Review a locked containment decision.",
        toastActionTitle: "Emit signal",
        toastActionBody: "Send a brief custody notice.",
        tooltipActionTitle: "Read field note",
        tooltipActionBody: "Hold focus over this archive shard.",
        tooltipText: "Field note 7-B: the iris dilates when its catalog number is spoken.",
        toastDefault: "Custody signal received. RQ-09 remains coherent.",
        toastPulse: "Neural pulse captured and indexed.",
        toastArchive: "A new neural echo has entered the local ledger.",
        toastSeal: "Containment vessel closed under arterial protocol.",
        toastMeter: "Integrity meter rebalanced against the bone memory.",
        closeGlyph: "×",
        dialogKicker: "Arterial protocol / confirmation",
        dialogTitle: "Close the living vessel?",
        dialogBody: "The iris will seal, lifted strata will descend, and all loose decay fragments will be trapped inside the chamber.",
        dialogCancel: "Keep vessel open",
        dialogConfirm: "Close containment",
        footerLine: "What survives becomes sacred; what answers becomes evidence.",
        footerCode: "Reliquary RQ-09 · archive remains local"
      };

      const selectOptions = [
        { value: "crown", label: copy.optionCrown },
        { value: "rib", label: copy.optionRib },
        { value: "pollen", label: copy.optionPollen },
        { value: "void", label: copy.optionVoid }
      ];

      const defaults = {
        unsealed: false,
        layers: false,
        quarantine: false,
        accession: "",
        origin: "orbital",
        preserveBone: true,
        spineLock: true,
        amplitude: 62,
        specimen: "crown",
        tab: "provenance",
        progress: 42,
        integrity: 78
      };

      const storageKey = "reliquary-rq09-state-v1";
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      let state = { ...defaults };
      let toastTimer = 0;
      let scanTimer = 0;
      let lastModalFocus = null;

      const byId = (id) => document.getElementById(id);
      const stage = byId("reliquaryStage");
      const globalStatus = byId("globalStatus");
      const heroUnseal = byId("heroUnseal");
      const irisCore = byId("irisCore");
      const primaryActuator = byId("primaryActuator");
      const layerActuator = byId("layerActuator");
      const dangerActuator = byId("dangerActuator");
      const actuatorReadout = byId("actuatorReadout");
      const accessionInput = byId("accessionInput");
      const accessionReadout = byId("accessionReadout");
      const boneCheck = byId("boneCheck");
      const vertebraSwitch = byId("vertebraSwitch");
      const switchStatus = byId("switchStatus");
      const neuralSlider = byId("neuralSlider");
      const sliderOutput = byId("sliderOutput");
      const selectTrigger = byId("selectTrigger");
      const selectList = byId("selectList");
      const selectValue = byId("selectValue");
      const progress = byId("scanProgress");
      const progressValue = byId("progressValue");
      const meter = byId("integrityMeter");
      const meterValue = byId("meterValue");
      const toast = byId("toast");
      const toastText = byId("toastText");
      const dialog = byId("sealDialog");

      function injectCopy() {
        document.querySelector("title").textContent = copy.pageTitle;
        document.querySelectorAll("[data-copy]").forEach((node) => {
          const value = copy[node.dataset.copy];
          if (typeof value === "string") {
            node.textContent = value;
          }
        });
      }

      function loadState() {
        try {
          const stored = JSON.parse(localStorage.getItem(storageKey));
          if (stored && typeof stored === "object") {
            state = { ...defaults, ...stored };
          }
        } catch (error) {
          state = { ...defaults };
        }

        state.amplitude = Math.min(100, Math.max(0, Number(state.amplitude) || defaults.amplitude));
        state.progress = Math.min(100, Math.max(0, Number(state.progress) || 0));
        state.integrity = Math.min(100, Math.max(0, Number(state.integrity) || defaults.integrity));
        if (!selectOptions.some((option) => option.value === state.specimen)) {
          state.specimen = defaults.specimen;
        }
        if (!["provenance", "anatomy", "protocol"].includes(state.tab)) {
          state.tab = defaults.tab;
        }
        if (!["orbital", "tidal", "unknown"].includes(state.origin)) {
          state.origin = defaults.origin;
        }
      }

      function saveState() {
        try {
          localStorage.setItem(storageKey, JSON.stringify(state));
        } catch (error) {
          return;
        }
      }

      function setStatus(message) {
        globalStatus.textContent = message;
      }

      function syncReliquary() {
        stage.classList.toggle("is-unsealed", state.unsealed);
        stage.classList.toggle("layers-raised", state.layers);
        document.body.classList.toggle("alert-mode", state.quarantine);
        heroUnseal.setAttribute("aria-pressed", String(state.unsealed));
        irisCore.setAttribute("aria-pressed", String(state.unsealed));
        primaryActuator.setAttribute("aria-pressed", String(state.unsealed));
        layerActuator.setAttribute("aria-pressed", String(state.layers));
        dangerActuator.setAttribute("aria-pressed", String(state.quarantine));
        heroUnseal.querySelector("span").textContent = state.unsealed ? copy.heroReseal : copy.heroUnseal;
        if (state.quarantine) {
          setStatus(copy.statusQuarantine);
        } else if (state.unsealed) {
          setStatus(copy.statusUnsealed);
        } else {
          setStatus(copy.statusStable);
        }
      }

      function setUnsealed(next, readout = true) {
        state.unsealed = Boolean(next);
        syncReliquary();
        if (readout) {
          actuatorReadout.textContent = state.unsealed ? copy.actuatorOpen : copy.actuatorClosed;
        }
        saveState();
      }

      function setLayers(next) {
        state.layers = Boolean(next);
        syncReliquary();
        actuatorReadout.textContent = state.layers ? copy.actuatorLayersUp : copy.actuatorLayersDown;
        saveState();
      }

      function pulseRelic() {
        stage.classList.remove("is-pulsing");
        window.requestAnimationFrame(() => {
          stage.classList.add("is-pulsing");
        });
        setStatus(copy.statusPulsing);
        byId("pulseReadout").textContent = `${state.amplitude.toFixed(1)} µV / answering`;
        showToast(copy.toastPulse);
        window.setTimeout(() => {
          stage.classList.remove("is-pulsing");
          byId("pulseReadout").textContent = `${state.amplitude.toFixed(1)} µV / calm`;
          syncReliquary();
        }, reduceMotion.matches ? 20 : 1700);
      }

      function updateAccession() {
        state.accession = accessionInput.value;
        const mark = state.accession.trim();
        accessionReadout.textContent = mark ? `${copy.accessionPrefix}${mark.toUpperCase()}` : copy.accessionEmpty;
        saveState();
      }

      function updateSwitch() {
        state.spineLock = vertebraSwitch.checked;
        switchStatus.textContent = state.spineLock ? copy.switchLive : copy.switchDormant;
        saveState();
      }

      function updateAmplitude() {
        state.amplitude = Number(neuralSlider.value);
        sliderOutput.textContent = `${state.amplitude} µV`;
        byId("pulseReadout").textContent = `${state.amplitude.toFixed(1)} µV / calm`;
        state.integrity = Math.round(58 + state.amplitude * 0.32);
        renderMeter();
        saveState();
      }

      function renderSelect() {
        selectList.textContent = "";
        selectOptions.forEach((option, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "select-option";
          button.setAttribute("role", "option");
          button.setAttribute("aria-selected", String(state.specimen === option.value));
          button.tabIndex = -1;
          button.dataset.value = option.value;
          button.dataset.index = String(index);
          button.textContent = option.label;
          button.addEventListener("click", () => chooseOption(option.value));
          button.addEventListener("keydown", onOptionKeydown);
          selectList.append(button);
        });
        const current = selectOptions.find((option) => option.value === state.specimen) || selectOptions[0];
        selectValue.textContent = current.label;
      }

      function openSelect(focusIndex) {
        selectList.hidden = false;
        selectTrigger.setAttribute("aria-expanded", "true");
        const options = [...selectList.querySelectorAll(".select-option")];
        const selectedIndex = Math.max(0, selectOptions.findIndex((option) => option.value === state.specimen));
        const target = Number.isInteger(focusIndex) ? focusIndex : selectedIndex;
        options[Math.min(options.length - 1, Math.max(0, target))]?.focus();
      }

      function closeSelect(restoreFocus = false) {
        selectList.hidden = true;
        selectTrigger.setAttribute("aria-expanded", "false");
        if (restoreFocus) {
          selectTrigger.focus();
        }
      }

      function chooseOption(value) {
        state.specimen = value;
        renderSelect();
        closeSelect(true);
        saveState();
      }

      function onOptionKeydown(event) {
        const options = [...selectList.querySelectorAll(".select-option")];
        const currentIndex = options.indexOf(event.currentTarget);
        let nextIndex = currentIndex;

        if (event.key === "ArrowDown") {
          nextIndex = (currentIndex + 1) % options.length;
        } else if (event.key === "ArrowUp") {
          nextIndex = (currentIndex - 1 + options.length) % options.length;
        } else if (event.key === "Home") {
          nextIndex = 0;
        } else if (event.key === "End") {
          nextIndex = options.length - 1;
        } else if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          chooseOption(event.currentTarget.dataset.value);
          return;
        } else if (event.key === "Escape") {
          event.preventDefault();
          closeSelect(true);
          return;
        } else if (event.key === "Tab") {
          closeSelect(false);
          return;
        } else {
          return;
        }

        event.preventDefault();
        options[nextIndex].focus();
      }

      function selectTab(name, focusTab = false) {
        const tabs = [...document.querySelectorAll('[role="tab"]')];
        tabs.forEach((tab) => {
          const tabName = tab.id.replace("tab", "").toLowerCase();
          const selected = tabName === name;
          tab.setAttribute("aria-selected", String(selected));
          tab.tabIndex = selected ? 0 : -1;
          const panel = byId(tab.getAttribute("aria-controls"));
          panel.hidden = !selected;
          if (selected && focusTab) {
            tab.focus();
          }
        });
        state.tab = name;
        saveState();
      }

      function renderProgress() {
        const value = Math.round(state.progress);
        progress.setAttribute("aria-valuenow", String(value));
        progressValue.textContent = `${value}%`;
        const activeCount = Math.ceil(value / 10);
        progress.querySelectorAll(".progress-segment").forEach((segment, index) => {
          segment.classList.toggle("is-active", index < activeCount);
        });
        const scanLabel = byId("scanButton").querySelector("span");
        scanLabel.textContent = value >= 100 ? copy.scanComplete : copy.scanButton;
      }

      function startScan() {
        window.clearInterval(scanTimer);
        if (state.progress >= 100) {
          state.progress = 0;
        }
        if (reduceMotion.matches) {
          state.progress = 100;
          renderProgress();
          saveState();
          showToast(copy.toastArchive);
          return;
        }
        scanTimer = window.setInterval(() => {
          state.progress = Math.min(100, state.progress + 4);
          renderProgress();
          saveState();
          if (state.progress >= 100) {
            window.clearInterval(scanTimer);
            showToast(copy.toastArchive);
          }
        }, 90);
      }

      function renderMeter() {
        const value = Math.round(state.integrity);
        meter.style.setProperty("--meter-value", String(value));
        meter.setAttribute("aria-valuenow", String(value));
        meterValue.textContent = `${value}%`;
      }

      function rebalanceMeter() {
        state.integrity = state.integrity >= 92 ? 64 : Math.min(100, state.integrity + 7);
        renderMeter();
        saveState();
        showToast(copy.toastMeter);
      }

      function showToast(message) {
        window.clearTimeout(toastTimer);
        toastText.textContent = message;
        toast.hidden = false;
        toastTimer = window.setTimeout(() => {
          toast.hidden = true;
        }, reduceMotion.matches ? 4000 : 4600);
      }

      function hideToast() {
        window.clearTimeout(toastTimer);
        toast.hidden = true;
      }

      function openDialog() {
        closeSelect(false);
        lastModalFocus = document.activeElement;
        document.body.classList.add("modal-open");
        dialog.showModal();
        byId("dialogClose").focus();
      }

      function closeDialog() {
        if (dialog.open) {
          dialog.close();
        }
        document.body.classList.remove("modal-open");
        if (lastModalFocus instanceof HTMLElement) {
          lastModalFocus.focus();
        }
      }

      function confirmSeal() {
        state.unsealed = false;
        state.layers = false;
        state.quarantine = true;
        syncReliquary();
        actuatorReadout.textContent = copy.actuatorDangerOn;
        saveState();
        closeDialog();
        showToast(copy.toastSeal);
      }

      function trapDialogFocus(event) {
        if (event.key === "Escape") {
          event.preventDefault();
          closeDialog();
          return;
        }
        if (event.key !== "Tab") {
          return;
        }
        const focusable = [...dialog.querySelectorAll("button:not(:disabled), input:not(:disabled), [tabindex]:not([tabindex='-1'])")]
          .filter((element) => !element.hidden);
        if (!focusable.length) {
          return;
        }
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      }

      function hydrateState() {
        accessionInput.value = state.accession;
        const origin = document.querySelector(`input[name="origin"][value="${state.origin}"]`);
        if (origin) {
          origin.checked = true;
        }
        boneCheck.checked = Boolean(state.preserveBone);
        vertebraSwitch.checked = Boolean(state.spineLock);
        neuralSlider.value = String(state.amplitude);
        updateAccession();
        updateSwitch();
        sliderOutput.textContent = `${state.amplitude} µV`;
        byId("pulseReadout").textContent = `${state.amplitude.toFixed(1)} µV / calm`;
        renderSelect();
        selectTab(state.tab);
        renderProgress();
        renderMeter();
        syncReliquary();
      }

      function bindEvents() {
        heroUnseal.addEventListener("click", () => setUnsealed(!state.unsealed));
        irisCore.addEventListener("click", () => setUnsealed(!state.unsealed));
        primaryActuator.addEventListener("click", () => setUnsealed(!state.unsealed));
        byId("heroPulse").addEventListener("click", pulseRelic);
        layerActuator.addEventListener("click", () => setLayers(!state.layers));
        byId("archiveActuator").addEventListener("click", () => {
          state.progress = Math.min(100, state.progress + 9);
          renderProgress();
          saveState();
          actuatorReadout.textContent = copy.actuatorArchived;
          showToast(copy.toastArchive);
        });
        dangerActuator.addEventListener("click", () => {
          state.quarantine = !state.quarantine;
          syncReliquary();
          actuatorReadout.textContent = state.quarantine ? copy.actuatorDangerOn : copy.actuatorDangerOff;
          saveState();
        });

        accessionInput.addEventListener("input", updateAccession);
        document.querySelectorAll('input[name="origin"]').forEach((radio) => {
          radio.addEventListener("change", () => {
            state.origin = radio.value;
            saveState();
          });
        });
        boneCheck.addEventListener("change", () => {
          state.preserveBone = boneCheck.checked;
          saveState();
        });
        vertebraSwitch.addEventListener("change", updateSwitch);
        neuralSlider.addEventListener("input", updateAmplitude);

        selectTrigger.addEventListener("click", () => {
          if (selectList.hidden) {
            openSelect();
          } else {
            closeSelect(false);
          }
        });
        selectTrigger.addEventListener("keydown", (event) => {
          if (event.key === "ArrowDown" || event.key === "ArrowUp") {
            event.preventDefault();
            const selectedIndex = selectOptions.findIndex((option) => option.value === state.specimen);
            const offset = event.key === "ArrowDown" ? 1 : -1;
            openSelect((selectedIndex + offset + selectOptions.length) % selectOptions.length);
          } else if (event.key === "Escape" && !selectList.hidden) {
            event.preventDefault();
            closeSelect(true);
          }
        });
        document.addEventListener("pointerdown", (event) => {
          if (!byId("customSelect").contains(event.target)) {
            closeSelect(false);
          }
        });

        document.querySelectorAll('[role="tab"]').forEach((tab) => {
          tab.addEventListener("click", () => {
            selectTab(tab.id.replace("tab", "").toLowerCase());
          });
          tab.addEventListener("keydown", (event) => {
            const tabs = [...document.querySelectorAll('[role="tab"]')];
            const index = tabs.indexOf(event.currentTarget);
            let next = index;
            if (event.key === "ArrowRight") {
              next = (index + 1) % tabs.length;
            } else if (event.key === "ArrowLeft") {
              next = (index - 1 + tabs.length) % tabs.length;
            } else if (event.key === "Home") {
              next = 0;
            } else if (event.key === "End") {
              next = tabs.length - 1;
            } else {
              return;
            }
            event.preventDefault();
            selectTab(tabs[next].id.replace("tab", "").toLowerCase(), true);
          });
        });

        byId("scanButton").addEventListener("click", startScan);
        byId("meterButton").addEventListener("click", rebalanceMeter);
        byId("openModal").addEventListener("click", openDialog);
        byId("showToast").addEventListener("click", () => showToast(copy.toastDefault));
        byId("toastClose").addEventListener("click", hideToast);
        byId("dialogClose").addEventListener("click", closeDialog);
        byId("dialogCancel").addEventListener("click", closeDialog);
        byId("dialogConfirm").addEventListener("click", confirmSeal);
        dialog.addEventListener("keydown", trapDialogFocus);
        dialog.addEventListener("cancel", (event) => {
          event.preventDefault();
          closeDialog();
        });
        dialog.addEventListener("close", () => {
          document.body.classList.remove("modal-open");
        });
      }

      injectCopy();
      loadState();
      hydrateState();
      bindEvents();
    })();
  </script>
</body>
</html>
