                  <span data-copy="Pigment lore"></span>
                </button>
                <button class="tab-button" id="tab-rhythm" type="button" role="tab" aria-selected="false" aria-controls="panel-rhythm" tabindex="-1" data-tab="rhythm">
                  <span data-copy="Beat code"></span>
                </button>
              </div>
              <section class="tab-panel" id="panel-stitch" role="tabpanel" aria-labelledby="tab-stitch" tabindex="0">
                <h4 data-copy="Cross the returning path"></h4>
                <p data-copy="Run the blue thread outward, turn at the vermilion marker, and return through every second opening."></p>
                <div class="panel-pattern" aria-hidden="true"></div>
              </section>
              <section class="tab-panel" id="panel-pigment" role="tabpanel" aria-labelledby="tab-pigment" tabindex="0" hidden>
                <h4 data-copy="Let color keep its edge"></h4>
                <p data-copy="Ochre names the ground. Indigo names the distance. Vermilion is reserved for the living signal."></p>
                <div class="panel-pattern" aria-hidden="true"></div>
              </section>
              <section class="tab-panel" id="panel-rhythm" role="tabpanel" aria-labelledby="tab-rhythm" tabindex="0" hidden>
                <h4 data-copy="Four steps, one answer"></h4>
                <p data-copy="Strike, wait, turn, return. Leave enough silence between calls for another hand to enter the pattern."></p>
                <div class="panel-pattern" aria-hidden="true"></div>
              </section>
            </div>
          </div>

          <div class="control-card span-5">
            <span class="card-label" data-copy="Shared band progress"></span>
            <div class="progress-shell">
              <div class="progress-track" id="bandProgress" role="progressbar" aria-label="Shared band completion" aria-valuemin="0" aria-valuemax="100" aria-valuenow="62">
                <div class="progress-fill" id="progressFill"></div>
                <span class="progress-label" id="progressLabel" data-copy="62% WOVEN"></span>
              </div>
            </div>
            <div class="stepper">
              <button class="mini-button" id="progressDown" type="button" aria-label="Remove one woven band step">
                <span aria-hidden="true" data-copy="−"></span>
              </button>
              <span class="step-caption" data-copy="Move in eight-thread steps"></span>
              <button class="mini-button" id="progressUp" type="button" aria-label="Add one woven band step">
                <span aria-hidden="true" data-copy="+"></span>
              </button>
            </div>
          </div>

          <div class="control-card span-12">
            <span class="card-label" data-copy="Hearth resonance meter"></span>
            <div class="meter-layout">
              <div class="ritual-meter" id="hearthMeter" role="meter" aria-label="Hearth resonance" aria-valuemin="0" aria-valuemax="100" aria-valuenow="65">
                <span class="meter-needle" aria-hidden="true"></span>
              </div>
              <div class="meter-readout">
                <output class="meter-value" id="meterValue" data-copy="65"></output>
                <span class="meter-unit" data-copy="Resonance marks"></span>
                <div class="stepper">
                  <button class="mini-button" id="meterDown" type="button" aria-label="Lower hearth resonance">
                    <span aria-hidden="true" data-copy="−"></span>
                  </button>
                  <button class="mini-button" id="meterUp" type="button" aria-label="Raise hearth resonance">
                    <span aria-hidden="true" data-copy="+"></span>
                  </button>
                </div>
                <p class="field-hint" id="meterStatus" role="status" aria-live="polite" data-copy="The hearth carries a steady gathering tone."></p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="control-section" aria-labelledby="signals-title">
        <div class="control-header">
          <div>
            <span class="control-index" data-copy="IV / SEND"></span>
            <h3 id="signals-title" data-copy="Ceremony Signals"></h3>
            <p data-copy="Open a vow, send a field notice, or ask the guide knot for quiet context."></p>
          </div>
        </div>
        <div class="signal-grid">
          <article class="signal-tile">
            <div>
              <h4 data-copy="Circle vow"></h4>
              <p data-copy="A focused layer for binding one deliberate promise."></p>
            </div>
            <button class="button button-primary" id="openModal" type="button">
              <span data-copy="Open the vow"></span>
            </button>
          </article>
          <article class="signal-tile">
            <div>
              <h4 data-copy="Field notice"></h4>
              <p data-copy="A brief signal that arrives without breaking the work."></p>
            </div>
            <button class="craft-button weave" id="showToast" type="button">
              <span data-copy="Send notice"></span>
            </button>
          </article>
          <article class="signal-tile">
            <div>
              <h4 data-copy="Guide knot"></h4>
              <p data-copy="Hover, focus, or pin the knot to reveal its teaching."></p>
            </div>
            <div class="tooltip-wrap" id="tooltipWrap" data-pinned="false">
              <button class="tooltip-trigger" id="tooltipTrigger" type="button" aria-describedby="guideTooltip" aria-pressed="false">
                <span data-copy="Ask the knot"></span>
              </button>
              <span class="tooltip" id="guideTooltip" role="tooltip" data-copy="A strong pattern leaves one open thread so the next maker has somewhere to begin."></span>
            </div>
          </article>
        </div>
        <p class="nojs-note" data-copy="The workshop story and guardian remain visible without scripts; interactive rituals wake when scripts are available."></p>
      </section>
    </section>
  </main>

  <footer class="footer">
    <div class="shell footer-inner">
      <p class="footer-statement" data-copy="Leave the pattern stronger, stranger, and more open than you found it."></p>
      <span class="footer-mark" aria-hidden="true"></span>
    </div>
  </footer>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="ritual-dialog" id="ritualDialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" aria-describedby="dialogDescription" tabindex="-1">
      <button class="dialog-close" id="closeModal" type="button" aria-label="Close the circle vow">
        <span aria-hidden="true" data-copy="×"></span>
      </button>
      <h2 id="dialogTitle" data-copy="Bind a circle vow"></h2>
      <p id="dialogDescription" data-copy="Name one promise the circle can return to when the path becomes unclear."></p>
      <div class="dialog-field">
        <label class="field-label" for="vowInput" data-copy="The vow"></label>
        <input class="text-field" id="vowInput" type="text" maxlength="84" data-placeholder="We will leave one thread open">
      </div>
      <label class="check-option">
        <input id="witnessVow" type="checkbox">
        <span class="check-mark" aria-hidden="true"></span>
        <span data-copy="Mark this vow as witnessed"></span>
      </label>
      <div class="action-row">
        <button class="button button-primary" id="bindVow" type="button">
          <span data-copy="Bind the vow"></span>
        </button>
        <button class="button button-secondary" id="cancelModal" type="button">
          <span data-copy="Return to the loom"></span>
        </button>
      </div>
    </div>
  </div>

  <aside class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true" hidden>
    <span class="toast-mark" aria-hidden="true"></span>
    <span class="toast-message" id="toastMessage" data-copy="Field notice sent: the eastern loom is ready."></span>
    <button class="toast-close" id="toastClose" type="button" aria-label="Dismiss field notice">
      <span aria-hidden="true" data-copy="×"></span>
    </button>
  </aside>

  <script>
    (() => {
      "use strict";

      const storageKey = "totem-kinwood-state-v1";
      const defaults = {
        awake: false,
        phrase: "",
        route: "ridge",
        token: false,
        night: false,
        rhythm: 45,
        material: "clay",
        tab: "stitch",
        progress: 62,
        meter: 65
      };

      const allowedMaterials = ["clay", "indigo", "bone", "wood"];
      const allowedTabs = ["stitch", "pigment", "rhythm"];
      const allowedRoutes = ["ridge", "river", "grove"];
      let state = { ...defaults };
      let toastTimer = 0;
      let lastFocused = null;

      const byId = (id) => document.getElementById(id);
      const setText = (node, value) => {
        if (node) {
          node.textContent = String(value);
        }
      };
      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

      document.querySelectorAll("[data-copy]").forEach((node) => {
        setText(node, node.dataset.copy);
      });

      document.querySelectorAll("[data-placeholder]").forEach((node) => {
        node.placeholder = node.dataset.placeholder;
      });

      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || "null");
        if (saved && typeof saved === "object") {
          state = { ...defaults, ...saved };
        }
      } catch (error) {
        state = { ...defaults };
      }

      state.awake = Boolean(state.awake);
      state.phrase = typeof state.phrase === "string" ? state.phrase.slice(0, 72) : "";
      state.route = allowedRoutes.includes(state.route) ? state.route : defaults.route;
      state.token = Boolean(state.token);
      state.night = Boolean(state.night);
      state.rhythm = clamp(Number.isFinite(Number(state.rhythm)) ? Number(state.rhythm) : defaults.rhythm, 0, 100);
      state.material = allowedMaterials.includes(state.material) ? state.material : defaults.material;
      state.tab = allowedTabs.includes(state.tab) ? state.tab : defaults.tab;
      state.progress = clamp(Number.isFinite(Number(state.progress)) ? Number(state.progress) : defaults.progress, 0, 100);
      state.meter = clamp(Number.isFinite(Number(state.meter)) ? Number(state.meter) : defaults.meter, 0, 100);

      const persist = () => {
        try {
          localStorage.setItem(storageKey, JSON.stringify(state));
        } catch (error) {
          return;
        }
      };

      const guardian = byId("guardian");
      const guardianToggle = byId("guardianToggle");
      const guardianToggleLabel = guardianToggle.querySelector("[data-copy]");
      const guardianStatus = byId("guardianStatus");

      const renderGuardian = () => {
        guardian.classList.toggle("awake", state.awake);
        guardianToggle.setAttribute("aria-pressed", String(state.awake));
        setText(guardianToggleLabel, state.awake ? "Let the guardian rest" : "Wake the guardian");
        setText(
          guardianStatus,
          state.awake
            ? "The guardian answers in four bright steps. Your choices are kept on this device."
            : "The guardian rests between beats. Your choices are kept on this device."
        );
      };

      guardianToggle.addEventListener("click", () => {
        state.awake = !state.awake;
        renderGuardian();
        persist();
      });

      renderGuardian();

      const buttonCard = byId("buttonCard");
      const benchReadout = byId("benchReadout");

      document.querySelectorAll("[data-bench-action]").forEach((button) => {
        button.addEventListener("click", () => {
          setText(benchReadout, `${button.dataset.benchAction}. The grain holds the mark.`);
          buttonCard.classList.remove("is-struck");
          void buttonCard.offsetWidth;
          buttonCard.classList.add("is-struck");
        });
      });

      buttonCard.addEventListener("animationend", () => {
        buttonCard.classList.remove("is-struck");
      });

      const phraseInput = byId("carvedPhrase");
      const phrasePreview = byId("phrasePreview");

      const renderPhrase = () => {
        phraseInput.value = state.phrase;
        setText(
          phrasePreview,
          state.phrase.trim()
            ? `“${state.phrase.trim()}”`
            : "Your uncut phrase will appear here."
        );
      };

      phraseInput.addEventListener("input", () => {
        state.phrase = phraseInput.value.slice(0, 72);
        renderPhrase();
        persist();
      });

      renderPhrase();

      const routeInputs = Array.from(document.querySelectorAll('input[name="route"]'));
      routeInputs.forEach((input) => {
        input.checked = input.value === state.route;
        input.addEventListener("change", () => {
          if (input.checked) {
            state.route = input.value;
            persist();
          }
        });
      });

      const tokenInput = byId("carryToken");
      const tokenStatus = byId("tokenStatus");

      const renderToken = () => {
        tokenInput.checked = state.token;
        setText(
          tokenStatus,
          state.token
            ? "The maker's token is knotted safely to your bundle."
            : "No token is tied to your bundle."
        );
      };

      tokenInput.addEventListener("change", () => {
        state.token = tokenInput.checked;
        renderToken();
        persist();
      });

      renderToken();

      const watchSwitch = byId("watchSwitch");
      const watchState = byId("watchState");

      const renderWatch = () => {
        document.body.classList.toggle("night-weave", state.night);
        watchSwitch.setAttribute("aria-checked", String(state.night));
        setText(watchState, state.night ? "Indigo night" : "Day weave");
      };

      watchSwitch.addEventListener("click", () => {
        state.night = !state.night;
        renderWatch();
        persist();
      });

      renderWatch();

      const rhythmRange = byId("rhythmRange");
      const rhythmOutput = byId("rhythmOutput");

      const renderRhythm = () => {
        rhythmRange.value = String(state.rhythm);
        rhythmRange.style.setProperty("--range-pct", `${state.rhythm}%`);
        setText(rhythmOutput, `${state.rhythm}%`);
      };

      rhythmRange.addEventListener("input", () => {
        state.rhythm = Number(rhythmRange.value);
        renderRhythm();
        persist();
      });

      renderRhythm();

      const materialTrigger = byId("materialTrigger");
      const materialList = byId("materialList");
      const materialValue = byId("materialValue");
      const materialHint = byId("materialHint");
      const materialOptions = Array.from(materialList.querySelectorAll('[role="option"]'));
      const materialCopy = {
        clay: {
          label: "Ochre clay",
          hint: "Ochre clay holds a warm, grounded mark."
        },
        indigo: {
          label: "Indigo cloth",
          hint: "Indigo cloth carries a signal across the dark."
        },
        bone: {
          label: "Bone paper",
          hint: "Bone paper keeps every cut crisp and quiet."
        },
        wood: {
          label: "Cedar grain",
          hint: "Cedar grain lets each mark follow a living line."
        }
      };

      const renderMaterial = () => {
        const copy = materialCopy[state.material];
        setText(materialValue, copy.label);
        setText(materialHint, copy.hint);
        materialOptions.forEach((option) => {
          option.setAttribute("aria-selected", String(option.dataset.value === state.material));
        });
      };

      const openMaterial = (preferredIndex) => {
        materialList.hidden = false;
        materialTrigger.setAttribute("aria-expanded", "true");
        const currentIndex = materialOptions.findIndex((option) => option.dataset.value === state.material);
        const index = Number.isInteger(preferredIndex) ? preferredIndex : Math.max(0, currentIndex);
        materialOptions[clamp(index, 0, materialOptions.length - 1)].focus();
      };

      const closeMaterial = (returnFocus = false) => {
        materialList.hidden = true;
        materialTrigger.setAttribute("aria-expanded", "false");
        if (returnFocus) {
          materialTrigger.focus();
        }
      };

      const chooseMaterial = (option) => {
        state.material = option.dataset.value;
        renderMaterial();
        persist();
        closeMaterial(true);
      };

      materialTrigger.addEventListener("click", () => {
        if (materialList.hidden) {
          openMaterial();
        } else {
          closeMaterial();
        }
      });

      materialTrigger.addEventListener("keydown", (event) => {
        if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          event.preventDefault();
          const selected = materialOptions.findIndex((option) => option.dataset.value === state.material);
          const direction = event.key === "ArrowDown" ? 1 : -1;
          openMaterial(clamp(selected + direction, 0, materialOptions.length - 1));
        } else if (event.key === "Escape" && !materialList.hidden) {
          event.preventDefault();
          closeMaterial(true);
        }
      });

      materialOptions.forEach((option, index) => {
        option.addEventListener("click", () => chooseMaterial(option));
        option.addEventListener("keydown", (event) => {
          let nextIndex = index;
          if (event.key === "ArrowDown") {
            nextIndex = (index + 1) % materialOptions.length;
          } else if (event.key === "ArrowUp") {
            nextIndex = (index - 1 + materialOptions.length) % materialOptions.length;
          } else if (event.key === "Home") {
            nextIndex = 0;
          } else if (event.key === "End") {
            nextIndex = materialOptions.length - 1;
          } else if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            chooseMaterial(option);
            return;
          } else if (event.key === "Escape") {
            event.preventDefault();
            closeMaterial(true);
            return;
          } else if (event.key === "Tab") {
            closeMaterial();
            return;
          } else {
            return;
          }
          event.preventDefault();
          materialOptions[nextIndex].focus();
        });
      });

      document.addEventListener("pointerdown", (event) => {
        if (!byId("materialSelect").contains(event.target) && !materialList.hidden) {
          closeMaterial();
        }
      });

      renderMaterial();

      const tabButtons = Array.from(document.querySelectorAll('[role="tab"]'));
      const tabPanels = allowedTabs.map((tab) => byId(`panel-${tab}`));

      const activateTab = (tabName, moveFocus = false) => {
        const nextTab = allowedTabs.includes(tabName) ? tabName : defaults.tab;
        state.tab = nextTab;
        tabButtons.forEach((button, index) => {
          const selected = button.dataset.tab === nextTab;
          button.setAttribute("aria-selected", String(selected));
          button.tabIndex = selected ? 0 : -1;
          tabPanels[index].hidden = !selected;
          if (selected && moveFocus) {
            button.focus();
          }
        });
        persist();
      };

      tabButtons.forEach((button, index) => {
        button.addEventListener("click", () => activateTab(button.dataset.tab));
        button.addEventListener("keydown", (event) => {
          let nextIndex = index;
          if (event.key === "ArrowRight" || event.key === "ArrowDown") {
            nextIndex = (index + 1) % tabButtons.length;
          } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
            nextIndex = (index - 1 + tabButtons.length) % tabButtons.length;
          } else if (event.key === "Home") {
            nextIndex = 0;
          } else if (event.key === "End") {
            nextIndex = tabButtons.length - 1;
          } else {
            return;
          }
          event.preventDefault();
          activateTab(tabButtons[nextIndex].dataset.tab, true);
        });
      });

      activateTab(state.tab);

      const bandProgress = byId("bandProgress");
      const progressFill = byId("progressFill");
      const progressLabel = byId("progressLabel");

      const renderProgress = () => {
        progressFill.style.width = `${state.progress}%`;
        bandProgress.setAttribute("aria-valuenow", String(state.progress));
        setText(progressLabel, `${state.progress}% WOVEN`);
      };

      const changeProgress = (amount) => {
        state.progress = clamp(state.progress + amount, 0, 100);
        renderProgress();
        persist();
      };

      byId("progressDown").addEventListener("click", () => changeProgress(-8));
      byId("progressUp").addEventListener("click", () => changeProgress(8));
      renderProgress();

      const hearthMeter = byId("hearthMeter");
      const meterValue = byId("meterValue");
      const meterStatus = byId("meterStatus");

      const meterMessage = () => {
        if (state.meter < 30) {
          return "The hearth is quiet; add a few careful beats.";
        }
        if (state.meter > 80) {
          return "The hearth runs bright; leave room for the circle to answer.";
        }
        return "The hearth carries a steady gathering tone.";
      };

      const renderMeter = () => {
        hearthMeter.setAttribute("aria-valuenow", String(state.meter));
        hearthMeter.style.setProperty("--meter-angle", `${state.meter * 2.7}deg`);
        hearthMeter.style.setProperty("--needle-angle", `${-135 + state.meter * 2.7}deg`);
        setText(meterValue, state.meter);
        setText(meterStatus, meterMessage());
      };

      const changeMeter = (amount) => {
        state.meter = clamp(state.meter + amount, 0, 100);
        renderMeter();
        persist();
      };

      byId("meterDown").addEventListener("click", () => changeMeter(-5));
      byId("meterUp").addEventListener("click", () => changeMeter(5));
      renderMeter();

      const modalBackdrop = byId("modalBackdrop");
      const ritualDialog = byId("ritualDialog");
      const vowInput = byId("vowInput");

      const pageRegions = [document.querySelector(".status-bar"), document.querySelector("main"), document.querySelector(".footer")];

      const setPageInert = (inert) => {
        pageRegions.forEach((region) => {
          if (region) {
            region.inert = inert;
          }
        });
      };

      const openModal = () => {
        lastFocused = document.activeElement;
        modalBackdrop.hidden = false;
        document.body.style.overflow = "hidden";
        setPageInert(true);
        requestAnimationFrame(() => vowInput.focus());
      };

      const closeModal = () => {
        modalBackdrop.hidden = true;
        document.body.style.overflow = "";
        setPageInert(false);
        if (lastFocused && typeof lastFocused.focus === "function") {
          lastFocused.focus();
        }
      };

      const focusableInDialog = () => Array.from(
        ritualDialog.querySelectorAll('button:not(:disabled), input:not(:disabled), [href], [tabindex]:not([tabindex="-1"])')
      ).filter((node) => !node.hidden && node.getClientRects().length > 0);

      byId("openModal").addEventListener("click", openModal);
      byId("closeModal").addEventListener("click", closeModal);
      byId("cancelModal").addEventListener("click", closeModal);
      modalBackdrop.addEventListener("pointerdown", (event) => {
        if (event.target === modalBackdrop) {
          closeModal();
        }
      });

      const toast = byId("toast");
      const toastMessage = byId("toastMessage");

      const hideToast = () => {
        window.clearTimeout(toastTimer);
        toast.classList.remove("is-visible");
        window.setTimeout(() => {
          toast.hidden = true;
        }, 190);
      };

      const showToast = (message) => {
        window.clearTimeout(toastTimer);
        setText(toastMessage, message);
        toast.hidden = false;
        requestAnimationFrame(() => toast.classList.add("is-visible"));
        toastTimer = window.setTimeout(hideToast, 4300);
      };

      byId("showToast").addEventListener("click", () => {
        showToast("Field notice sent: the eastern loom is ready.");
      });
      byId("toastClose").addEventListener("click", hideToast);

      byId("bindVow").addEventListener("click", () => {
        const vow = vowInput.value.trim();
        const witnessed = byId("witnessVow").checked;
        closeModal();
        showToast(
          vow
            ? `Vow bound${witnessed ? " and witnessed" : ""}: “${vow.slice(0, 48)}${vow.length > 48 ? "…" : ""}”`
            : "The circle stays open until a vow is named."
        );
      });

      const tooltipWrap = byId("tooltipWrap");
      const tooltipTrigger = byId("tooltipTrigger");

      const setTooltipPinned = (pinned) => {
        tooltipWrap.dataset.pinned = String(pinned);
        tooltipTrigger.setAttribute("aria-pressed", String(pinned));
      };

      tooltipTrigger.addEventListener("click", () => {
        setTooltipPinned(tooltipWrap.dataset.pinned !== "true");
      });

      document.addEventListener("keydown", (event) => {
        if (!modalBackdrop.hidden) {
          if (event.key === "Escape") {
            event.preventDefault();
            closeModal();
            return;
          }
          if (event.key === "Tab") {
            const focusable = focusableInDialog();
            const first = focusable[0];
            const last = focusable[focusable.length - 1];
            if (!first || !last) {
              event.preventDefault();
              ritualDialog.focus();
            } else if (event.shiftKey && document.activeElement === first) {
              event.preventDefault();
              last.focus();
            } else if (!event.shiftKey && document.activeElement === last) {
              event.preventDefault();
              first.focus();
            }
          }
          return;
        }

        if (event.key === "Escape") {
          if (!materialList.hidden) {
            event.preventDefault();
            closeMaterial(true);
          } else if (tooltipWrap.dataset.pinned === "true") {
            event.preventDefault();
            setTooltipPinned(false);
            tooltipTrigger.focus();
          } else if (!toast.hidden) {
            event.preventDefault();
            hideToast();
          }
        }
      });

      window.addEventListener("pagehide", persist);
    })();
  </script>
</body>
</html>
