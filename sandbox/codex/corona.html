<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07090c">
  <title data-t="CORONA — Eclipse Glass Observatory"></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --ink: #07090c;
      --ink-soft: #0c1217;
      --glass: rgba(17, 25, 31, 0.7);
      --glass-strong: rgba(12, 18, 23, 0.92);
      --paper: #f2fbfc;
      --muted: #a9c3c6;
      --amber: #ffc653;
      --amber-hot: #ff9c2a;
      --cyan: #58e7eb;
      --cyan-soft: #9df6f3;
      --danger: #ff765f;
      --line: rgba(225, 250, 250, 0.18);
      --line-strong: rgba(225, 250, 250, 0.32);
      --radius: 24px;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.48);
      --focus: 0 0 0 3px var(--ink), 0 0 0 5px var(--cyan);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background: var(--ink);
    }

    body {
      min-width: 0;
      margin: 0;
      overflow-x: hidden;
      color: var(--paper);
      background:
        radial-gradient(circle at 82% 8%, rgba(255, 173, 44, 0.1), transparent 27rem),
        radial-gradient(circle at 14% 31%, rgba(61, 220, 225, 0.08), transparent 30rem),
        linear-gradient(180deg, #050709 0%, #0a0f13 46%, #05080a 100%);
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -2;
      background-image:
        linear-gradient(rgba(117, 208, 212, 0.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(117, 208, 212, 0.022) 1px, transparent 1px);
      background-size: 64px 64px;
      content: "";
      mask-image: radial-gradient(circle at 50% 20%, black, transparent 78%);
      pointer-events: none;
    }

    body::after {
      position: fixed;
      inset: 0;
      z-index: 20;
      border: 1px solid rgba(255, 255, 255, 0.035);
      box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.68);
      content: "";
      pointer-events: none;
    }

    body.modal-open {
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    [hidden] {
      display: none !important;
    }

    [data-t]:empty::before {
      content: attr(data-t);
    }

    .skip-link {
      position: fixed;
      top: 12px;
      left: 16px;
      z-index: 200;
      padding: 10px 14px;
      border-radius: 8px;
      color: #071013;
      background: var(--cyan);
      font-weight: 700;
      transform: translateY(-180%);
      transition: transform 160ms ease;
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    :focus-visible {
      outline: none;
      box-shadow: var(--focus);
    }

    .shell {
      width: min(100%, 1228px);
      margin-inline: auto;
      padding-inline: 24px;
    }

    .topbar {
      position: relative;
      z-index: 30;
      width: 100%;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(5, 8, 10, 0.76);
      backdrop-filter: blur(18px);
    }

    .topbar-inner {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      min-height: 52px;
      gap: 24px;
      font-family: "Orbitron", sans-serif;
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.19em;
      text-transform: uppercase;
    }

    .brand-lockup,
    .site-status,
    .live-lock {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      position: relative;
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      border: 1px solid var(--amber);
      border-radius: 50%;
      box-shadow: 0 0 16px rgba(255, 185, 59, 0.55);
    }

    .brand-mark::before {
      position: absolute;
      inset: 3px;
      border-radius: inherit;
      background: var(--ink);
      box-shadow: 4px -1px 0 -3px var(--amber);
      content: "";
    }

    .brand-code {
      color: var(--paper);
      white-space: nowrap;
    }

    .site-status {
      color: var(--muted);
      justify-content: center;
    }

    .status-divider {
      width: 1px;
      height: 14px;
      background: var(--line-strong);
    }

    .live-lock {
      justify-self: end;
      color: var(--cyan-soft);
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 0 0 rgba(88, 231, 235, 0.5);
      animation: signal-pulse 2.6s ease-out infinite;
    }

    .hero {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1.06fr) minmax(360px, 0.94fr);
      align-items: center;
      min-height: min(820px, calc(100vh - 52px));
      gap: clamp(40px, 6vw, 88px);
      padding-block: clamp(64px, 8vw, 112px);
    }

    .hero::before {
      position: absolute;
      top: 14%;
      left: -18%;
      width: 450px;
      height: 450px;
      border: 1px solid rgba(88, 231, 235, 0.08);
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }

    .hero-copy {
      position: relative;
      z-index: 2;
      min-width: 0;
    }

    .eyebrow,
    .section-kicker,
    .panel-id,
    .control-label,
    .micro-label {
      font-family: "Orbitron", sans-serif;
      font-size: 0.69rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 22px;
      color: var(--cyan);
    }

    .eyebrow::before {
      width: 32px;
      height: 1px;
      background: currentColor;
      box-shadow: 8px 0 12px currentColor;
      content: "";
    }

    .hero-title {
      max-width: 760px;
      margin: 0;
      color: var(--paper);
      font-family: "Orbitron", sans-serif;
      font-size: clamp(3.3rem, 7.2vw, 7.25rem);
      font-weight: 700;
      letter-spacing: -0.045em;
      line-height: 0.86;
      text-transform: uppercase;
      text-wrap: balance;
    }

    .hero-title .halo-word {
      display: block;
      color: transparent;
      background: linear-gradient(105deg, #fff2c8 4%, var(--amber) 45%, #ff9e2c 73%, #9e4d1d);
      background-clip: text;
      -webkit-background-clip: text;
      filter: drop-shadow(0 0 18px rgba(255, 181, 55, 0.16));
    }

    .hero-subtitle {
      max-width: 590px;
      margin: 28px 0 0;
      color: #c7dbdc;
      font-size: clamp(1.02rem, 1.4vw, 1.22rem);
      line-height: 1.7;
    }

    .hero-actions,
    .button-grid,
    .inline-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .hero-actions {
      margin-top: 34px;
    }

    .btn {
      position: relative;
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 19px;
      overflow: hidden;
      border: 1px solid transparent;
      border-radius: 999px;
      cursor: pointer;
      font-family: "Orbitron", sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      line-height: 1;
      text-transform: uppercase;
      transition: transform 160ms ease, color 160ms ease, border-color 160ms ease, background 160ms ease, box-shadow 160ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn::after {
      position: absolute;
      inset: 4px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: inherit;
      content: "";
      pointer-events: none;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .btn:active:not(:disabled) {
      transform: translateY(1px) scale(0.985);
    }

    .btn-primary {
      color: #171006;
      background: linear-gradient(135deg, #ffe39a 0%, var(--amber) 42%, var(--amber-hot) 100%);
      box-shadow: 0 10px 32px rgba(255, 165, 45, 0.2);
    }

    .btn-primary:hover {
      box-shadow: 0 14px 38px rgba(255, 165, 45, 0.34);
    }

    .btn-secondary {
      border-color: rgba(88, 231, 235, 0.54);
      color: var(--cyan-soft);
      background: rgba(35, 113, 118, 0.15);
      box-shadow: inset 0 0 22px rgba(88, 231, 235, 0.06);
    }

    .btn-secondary:hover {
      border-color: var(--cyan);
      background: rgba(35, 113, 118, 0.25);
    }

    .btn-ghost {
      border-color: var(--line);
      color: var(--paper);
      background: rgba(255, 255, 255, 0.035);
    }

    .btn-ghost:hover {
      border-color: rgba(255, 198, 83, 0.58);
      color: var(--amber);
    }

    .btn-icon {
      width: 46px;
      padding: 0;
      border-color: rgba(255, 198, 83, 0.45);
      color: var(--amber);
      background: radial-gradient(circle, rgba(255, 198, 83, 0.13), transparent 72%);
      font-size: 1.1rem;
    }

    .btn-danger {
      border-color: rgba(255, 118, 95, 0.48);
      color: #ffd7d0;
      background: rgba(120, 35, 25, 0.22);
    }

    .btn:disabled,
    .btn-disabled {
      border-color: rgba(255, 255, 255, 0.08);
      color: #6e7c7f;
      background: rgba(255, 255, 255, 0.025);
      box-shadow: none;
      cursor: not-allowed;
      filter: saturate(0.35);
    }

    .btn-small {
      min-height: 38px;
      padding-inline: 15px;
      font-size: 0.61rem;
    }

    .hero-note {
      display: flex;
      flex-wrap: wrap;
      gap: 22px;
      margin-top: 30px;
      color: #8da7aa;
      font-family: "Orbitron", sans-serif;
      font-size: 0.61rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .hero-note span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .hero-note span::before {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--amber);
      content: "";
      box-shadow: 0 0 8px var(--amber);
    }

    .eclipse-observatory {
      position: relative;
      display: grid;
      place-items: center;
      min-width: 0;
      isolation: isolate;
    }

    .eclipse-observatory::before,
    .eclipse-observatory::after {
      position: absolute;
      z-index: -2;
      width: min(40vw, 510px);
      aspect-ratio: 1;
      border: 1px solid rgba(156, 241, 242, 0.13);
      border-radius: 50%;
      content: "";
      animation: orbit-spin 26s linear infinite;
    }

    .eclipse-observatory::before {
      background:
        repeating-conic-gradient(from 0deg, rgba(88, 231, 235, 0.4) 0deg 0.35deg, transparent 0.35deg 7.5deg);
      mask: radial-gradient(transparent 68%, black 68.4%, black 69.5%, transparent 70%);
    }

    .eclipse-observatory::after {
      width: min(34vw, 426px);
      border-style: dashed;
      border-color: rgba(255, 198, 83, 0.2);
      animation-direction: reverse;
      animation-duration: 34s;
    }

    .eclipse-stage {
      --moon-shift: 30px;
      position: relative;
      display: grid;
      width: min(28vw, 350px);
      min-width: 292px;
      aspect-ratio: 1;
      place-items: center;
      border-radius: 50%;
      filter: drop-shadow(0 0 36px rgba(255, 166, 45, 0.14));
    }

    .corona-filaments {
      position: absolute;
      inset: -18%;
      border-radius: 50%;
      background:
        repeating-conic-gradient(
          from 17deg,
          transparent 0deg 3deg,
          rgba(255, 223, 149, 0.76) 3.4deg 3.8deg,
          transparent 4.2deg 9deg
        );
      filter: blur(5px);
      mask-image: radial-gradient(circle, transparent 0 34%, rgba(0, 0, 0, 0.84) 45%, transparent 68%);
      opacity: 0.72;
      animation: filament-breathe 4.8s ease-in-out infinite alternate;
    }

    .corona-filaments::after {
      position: absolute;
      inset: 8%;
      border-radius: 50%;
      background:
        repeating-conic-gradient(
          from 45deg,
          transparent 0deg 6deg,
          rgba(255, 155, 45, 0.8) 6.4deg 6.9deg,
          transparent 7.4deg 14deg
        );
      filter: blur(3px);
      content: "";
      mask-image: radial-gradient(circle, transparent 0 46%, black 54%, transparent 71%);
      animation: orbit-spin 50s linear infinite reverse;
    }

    .sun-disc {
      position: absolute;
      inset: 12%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 40% 36%, #fff8d3 0 2%, transparent 8%),
        radial-gradient(circle, #fff4c3 0 50%, #ffd05f 64%, #ff971f 75%, transparent 76%);
      box-shadow:
        0 0 8px #fff4bd,
        0 0 22px rgba(255, 206, 91, 0.96),
        0 0 54px rgba(255, 161, 34, 0.62),
        0 0 110px rgba(255, 149, 25, 0.25);
      animation: corona-pulse 3.6s ease-in-out infinite;
    }

    .moon-disc {
      position: absolute;
      inset: 12%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 34% 28%, rgba(66, 82, 89, 0.34), transparent 17%),
        radial-gradient(circle at 64% 68%, rgba(42, 54, 60, 0.35), transparent 14%),
        radial-gradient(circle at 45% 45%, #10171c 0, #080c10 70%, #020405 100%);
      box-shadow:
        inset -18px -18px 34px rgba(0, 0, 0, 0.72),
        inset 4px 4px 15px rgba(177, 238, 239, 0.05),
        -2px 0 2px rgba(255, 230, 173, 0.7);
      transform: translateX(var(--moon-shift));
      transition: transform 480ms cubic-bezier(0.2, 0.85, 0.25, 1);
    }

    .phase-crosshair {
      position: absolute;
      inset: 3%;
      border: 1px solid rgba(88, 231, 235, 0.22);
      border-radius: 50%;
      animation: orbit-spin 22s linear infinite;
    }

    .phase-crosshair::before,
    .phase-crosshair::after {
      position: absolute;
      top: 50%;
      left: 50%;
      background: rgba(88, 231, 235, 0.3);
      content: "";
      transform: translate(-50%, -50%);
    }

    .phase-crosshair::before {
      width: 112%;
      height: 1px;
    }

    .phase-crosshair::after {
      width: 1px;
      height: 112%;
    }

    .baily-beads {
      position: absolute;
      inset: 8.5%;
      border-radius: 50%;
      animation: bead-flash 3.2s ease-in-out infinite;
    }

    .baily-beads i {
      --angle: calc(var(--i) * 30deg);
      position: absolute;
      top: calc(50% - 2px);
      left: calc(50% - 2px);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #fff7cf;
      box-shadow: 0 0 8px 2px rgba(255, 183, 53, 0.9);
      transform: rotate(var(--angle)) translateY(-146px);
      transform-origin: 2px 2px;
    }

    .orbital-readout {
      position: absolute;
      inset-inline: 0;
      bottom: -62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      color: #93afb1;
      font-family: "Orbitron", sans-serif;
      font-size: 0.58rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .phase-badge {
      display: inline-flex;
      min-height: 28px;
      align-items: center;
      padding: 0 11px;
      border: 1px solid rgba(255, 198, 83, 0.3);
      border-radius: 999px;
      color: var(--amber);
      background: rgba(255, 181, 47, 0.08);
    }

    .signature-line {
      position: absolute;
      top: 16%;
      right: -8px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--cyan);
      font-family: "Orbitron", sans-serif;
      font-size: 0.55rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transform: rotate(90deg) translateX(100%);
      transform-origin: top right;
    }

    .signature-line::before {
      width: 34px;
      height: 1px;
      background: var(--cyan);
      content: "";
    }

    .control-deck {
      position: relative;
      padding-block: 84px 110px;
    }

    .section-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 0.54fr);
      align-items: end;
      gap: 40px;
      margin-bottom: 38px;
    }

    .section-kicker {
      margin: 0 0 12px;
      color: var(--cyan);
    }

    .section-title {
      max-width: 760px;
      margin: 0;
      font-family: "Orbitron", sans-serif;
      font-size: clamp(2rem, 4vw, 3.8rem);
      line-height: 1.05;
      letter-spacing: -0.035em;
      text-transform: uppercase;
    }

    .section-intro {
      margin: 0;
      color: var(--muted);
      font-size: 0.96rem;
    }

    .panel-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 18px;
    }

    .panel {
      position: relative;
      min-width: 0;
      padding: clamp(22px, 3vw, 34px);
      overflow: visible;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius);
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.052), rgba(255, 255, 255, 0.008) 48%),
        var(--glass);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.035),
        var(--shadow);
      backdrop-filter: blur(24px) saturate(125%);
    }

    .panel::before {
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(255, 255, 255, 0.045);
      border-radius: calc(var(--radius) - 8px);
      content: "";
      pointer-events: none;
    }

    .panel-command {
      grid-column: span 7;
    }

    .panel-optics {
      grid-column: span 5;
    }

    .panel-sequence {
      grid-column: span 12;
    }

    .panel-header {
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 28px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    .panel-id {
      display: block;
      margin-bottom: 6px;
      color: var(--amber);
    }

    .panel-title {
      margin: 0;
      font-family: "Orbitron", sans-serif;
      font-size: clamp(1.05rem, 2vw, 1.35rem);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .panel-glyph {
      position: relative;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      border: 1px solid rgba(88, 231, 235, 0.35);
      border-radius: 50%;
    }

    .panel-glyph::before {
      position: absolute;
      inset: 7px;
      border: 1px solid var(--cyan);
      border-radius: 50%;
      content: "";
      clip-path: inset(0 45% 0 0);
    }

    .button-grid {
      margin-bottom: 30px;
    }

    .field-stack {
      display: grid;
      gap: 24px;
    }

    .field-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .field {
      min-width: 0;
    }

    .control-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 10px;
      color: #bcd0d2;
      line-height: 1.4;
    }

    .control-value {
      color: var(--amber);
      white-space: nowrap;
    }

    .input-shell {
      position: relative;
    }

    .text-input {
      width: 100%;
      min-height: 52px;
      padding: 0 50px 0 18px;
      border: 1px solid var(--line-strong);
      border-radius: 13px;
      outline: none;
      color: var(--paper);
      background:
        radial-gradient(circle at calc(100% - 24px) 50%, rgba(88, 231, 235, 0.2) 0 2px, transparent 3px),
        rgba(2, 7, 9, 0.68);
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.35);
      caret-color: var(--amber);
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .text-input:hover {
      border-color: rgba(88, 231, 235, 0.46);
    }

    .text-input:focus-visible {
      border-color: var(--cyan);
      box-shadow: var(--focus), inset 0 0 24px rgba(88, 231, 235, 0.07);
    }

    .input-placeholder {
      position: absolute;
      top: 50%;
      left: 18px;
      color: #71898c;
      pointer-events: none;
      transform: translateY(-50%);
      transition: opacity 120ms ease;
    }

    .input-shell:focus-within .input-placeholder,
    .input-shell.has-value .input-placeholder {
      opacity: 0;
    }

    .field-status {
      min-height: 1.4em;
      margin: 8px 0 0;
      color: #8eaaad;
      font-family: "Orbitron", sans-serif;
      font-size: 0.58rem;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .radio-group {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .radio-group legend {
      width: 100%;
      margin-bottom: 10px;
    }

    .visually-hidden {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      overflow: hidden !important;
      border: 0 !important;
      clip: rect(0 0 0 0) !important;
      white-space: nowrap !important;
    }

    .radio-orbit {
      position: relative;
      display: grid;
      min-height: 76px;
      place-items: center;
      gap: 4px;
      padding: 12px 8px;
      border: 1px solid var(--line);
      border-radius: 16px;
      color: #a8c0c2;
      background: rgba(255, 255, 255, 0.025);
      cursor: pointer;
      text-align: center;
      transition: border-color 160ms ease, color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .radio-orbit::before {
      width: 19px;
      height: 19px;
      border: 1px solid currentColor;
      border-radius: 50%;
      content: "";
      box-shadow: inset 6px 0 0 transparent;
    }

    .radio-orbit:hover {
      border-color: rgba(88, 231, 235, 0.5);
      transform: translateY(-2px);
    }

    .radio-orbit .radio-name {
      font-family: "Orbitron", sans-serif;
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .radio-group input:checked + .radio-orbit {
      border-color: rgba(255, 198, 83, 0.7);
      color: var(--amber);
      background: rgba(255, 190, 67, 0.09);
      box-shadow: inset 0 0 22px rgba(255, 171, 43, 0.07);
    }

    .radio-group input:checked + .radio-orbit::before {
      background: var(--amber);
      box-shadow:
        inset 6px 0 0 var(--ink),
        0 0 12px rgba(255, 198, 83, 0.5);
    }

    .radio-group input:focus-visible + .radio-orbit {
      box-shadow: var(--focus);
    }

    .check-row,
    .switch-row {
      display: flex;
      min-height: 54px;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 10px 12px 10px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.024);
    }

    .check-label,
    .switch-label {
      color: #c6d8d9;
      font-size: 0.91rem;
      cursor: pointer;
    }

    .check-control {
      position: relative;
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      border: 1px solid rgba(255, 198, 83, 0.48);
      border-radius: 50%;
      background: rgba(255, 198, 83, 0.04);
      cursor: pointer;
    }

    .check-control::before,
    .check-control::after {
      position: absolute;
      content: "";
      opacity: 0;
      transition: opacity 150ms ease, transform 150ms ease;
    }

    .check-control::before {
      top: 7px;
      left: 8px;
      width: 9px;
      height: 5px;
      border-bottom: 2px solid #171006;
      border-left: 2px solid #171006;
      transform: rotate(-45deg) scale(0.5);
    }

    .check-control::after {
      inset: 4px;
      z-index: -1;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 12px rgba(255, 198, 83, 0.52);
      transform: scale(0.5);
    }

    .check-row input:checked + .check-control::before,
    .check-row input:checked + .check-control::after {
      opacity: 1;
      transform: rotate(-45deg) scale(1);
    }

    .check-row input:checked + .check-control::after {
      transform: scale(1);
    }

    .check-row input:focus-visible + .check-control {
      box-shadow: var(--focus);
    }

    .switch-track {
      position: relative;
      width: 62px;
      height: 32px;
      flex: 0 0 auto;
      border: 1px solid rgba(88, 231, 235, 0.35);
      border-radius: 999px;
      background:
        linear-gradient(90deg, rgba(88, 231, 235, 0.12), rgba(255, 198, 83, 0.08)),
        #060a0d;
      cursor: pointer;
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }

    .switch-track::before {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #182329;
      box-shadow: inset 3px -2px 5px #050708, 1px 0 0 rgba(88, 231, 235, 0.38);
      content: "";
      transition: transform 260ms cubic-bezier(0.25, 1.55, 0.55, 1), background 180ms ease, box-shadow 180ms ease;
    }

    .switch-row input:checked + .switch-track {
      border-color: rgba(255, 198, 83, 0.7);
      box-shadow: inset 0 0 18px rgba(255, 177, 47, 0.11);
    }

    .switch-row input:checked + .switch-track::before {
      background: var(--amber);
      box-shadow: 0 0 13px rgba(255, 198, 83, 0.75);
      transform: translateX(30px);
    }

    .switch-row input:focus-visible + .switch-track {
      box-shadow: var(--focus);
    }

    .range-wrap {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 48px;
      align-items: center;
      gap: 14px;
    }

    .range {
      width: 100%;
      height: 28px;
      margin: 0;
      outline: none;
      background: transparent;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }

    .range::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 999px;
      background:
        linear-gradient(90deg, var(--amber) 0 var(--range-fill, 78%), rgba(255, 255, 255, 0.13) var(--range-fill, 78%) 100%);
      box-shadow: 0 0 12px rgba(255, 177, 47, 0.16);
    }

    .range::-moz-range-track {
      height: 4px;
      border-radius: 999px;
      background:
        linear-gradient(90deg, var(--amber) 0 var(--range-fill, 78%), rgba(255, 255, 255, 0.13) var(--range-fill, 78%) 100%);
      box-shadow: 0 0 12px rgba(255, 177, 47, 0.16);
    }

    .range::-webkit-slider-thumb {
      width: 26px;
      height: 26px;
      margin-top: -11px;
      border: 2px solid var(--amber);
      border-radius: 50%;
      background:
        radial-gradient(circle, #0a0f13 0 34%, var(--amber) 36% 42%, #0a0f13 44%);
      box-shadow: 0 0 0 4px rgba(255, 198, 83, 0.08), 0 0 16px rgba(255, 175, 41, 0.35);
      appearance: none;
      -webkit-appearance: none;
    }

    .range::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border: 2px solid var(--amber);
      border-radius: 50%;
      background:
        radial-gradient(circle, #0a0f13 0 34%, var(--amber) 36% 42%, #0a0f13 44%);
      box-shadow: 0 0 0 4px rgba(255, 198, 83, 0.08), 0 0 16px rgba(255, 175, 41, 0.35);
    }

    .range:focus-visible {
      border-radius: 999px;
      box-shadow: var(--focus);
    }

    .phase-readout {
      display: grid;
      width: 48px;
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid rgba(255, 198, 83, 0.4);
      border-radius: 50%;
      color: var(--amber);
      background: rgba(255, 190, 62, 0.06);
      font-family: "Orbitron", sans-serif;
      font-size: 0.62rem;
      font-weight: 700;
    }

    .select {
      position: relative;
    }

    .select-button {
      display: flex;
      width: 100%;
      min-height: 52px;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 16px;
      border: 1px solid var(--line-strong);
      border-radius: 13px;
      color: var(--paper);
      background: rgba(2, 7, 9, 0.72);
      cursor: pointer;
      text-align: left;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .select-button:hover,
    .select-button[aria-expanded="true"] {
      border-color: rgba(88, 231, 235, 0.7);
      box-shadow: inset 0 0 22px rgba(88, 231, 235, 0.06);
    }

    .select-arrow {
      position: relative;
      width: 19px;
      height: 19px;
      flex: 0 0 auto;
      border: 1px solid rgba(255, 198, 83, 0.5);
      border-radius: 50%;
    }

    .select-arrow::after {
      position: absolute;
      top: 5px;
      left: 6px;
      width: 5px;
      height: 5px;
      border-right: 1px solid var(--amber);
      border-bottom: 1px solid var(--amber);
      content: "";
      transform: rotate(45deg);
      transition: transform 160ms ease;
    }

    .select-button[aria-expanded="true"] .select-arrow::after {
      top: 7px;
      transform: rotate(225deg);
    }

    .select-list {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      left: 0;
      z-index: 80;
      margin: 0;
      padding: 7px;
      border: 1px solid rgba(88, 231, 235, 0.34);
      border-radius: 15px;
      background: rgba(8, 14, 18, 0.96);
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.56), inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      list-style: none;
      backdrop-filter: blur(24px);
    }

    .select-option {
      display: flex;
      min-height: 42px;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-radius: 10px;
      color: #b7ccce;
      cursor: pointer;
      outline: none;
    }

    .select-option::after {
      width: 7px;
      height: 7px;
      border: 1px solid rgba(255, 198, 83, 0.5);
      border-radius: 50%;
      content: "";
    }

    .select-option:hover,
    .select-option:focus-visible {
      color: var(--paper);
      background: rgba(88, 231, 235, 0.09);
      box-shadow: inset 0 0 0 1px rgba(88, 231, 235, 0.22);
    }

    .select-option[aria-selected="true"] {
      color: var(--amber);
      background: rgba(255, 190, 62, 0.08);
    }

    .select-option[aria-selected="true"]::after {
      background: var(--amber);
      box-shadow: 0 0 10px var(--amber);
    }

    .tip-wrap {
      position: relative;
      display: inline-flex;
    }

    .tip-button {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(88, 231, 235, 0.36);
      border-radius: 50%;
      color: var(--cyan);
      background: rgba(88, 231, 235, 0.06);
      cursor: help;
      font-family: "Orbitron", sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
    }

    .tooltip {
      position: absolute;
      top: calc(100% + 9px);
      right: 0;
      z-index: 90;
      width: min(260px, calc(100vw - 50px));
      padding: 12px 14px;
      border: 1px solid rgba(88, 231, 235, 0.3);
      border-radius: 12px;
      color: #d6e7e8;
      background: #0a1115;
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.5);
      font-size: 0.78rem;
      line-height: 1.5;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-5px);
      visibility: hidden;
      transition: opacity 140ms ease, transform 140ms ease, visibility 140ms;
    }

    .tooltip::before {
      position: absolute;
      top: -5px;
      right: 10px;
      width: 9px;
      height: 9px;
      border-top: 1px solid rgba(88, 231, 235, 0.3);
      border-left: 1px solid rgba(88, 231, 235, 0.3);
      background: #0a1115;
      content: "";
      transform: rotate(45deg);
    }

    .tip-wrap:hover .tooltip,
    .tip-button:focus-visible + .tooltip,
    .tip-button[aria-expanded="true"] + .tooltip {
      opacity: 1;
      transform: translateY(0);
      visibility: visible;
    }

    .tabs-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(240px, 0.6fr);
      gap: 28px;
    }

    .tablist {
      display: flex;
      gap: 5px;
      margin-bottom: 18px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.24);
    }

    .tab {
      flex: 1;
      min-width: 0;
      min-height: 42px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      color: #8ea8aa;
      background: transparent;
      cursor: pointer;
      font-family: "Orbitron", sans-serif;
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: color 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .tab:hover {
      color: var(--paper);
      background: rgba(255, 255, 255, 0.04);
    }

    .tab[aria-selected="true"] {
      color: #181005;
      background: linear-gradient(135deg, #ffe6a2, var(--amber));
      box-shadow: 0 6px 18px rgba(255, 172, 45, 0.18);
    }

    .tab-panel {
      min-height: 172px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background:
        radial-gradient(circle at 100% 0, rgba(88, 231, 235, 0.06), transparent 45%),
        rgba(2, 7, 9, 0.48);
    }

    .tab-panel:focus-visible {
      box-shadow: var(--focus);
    }

    .telemetry-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .telemetry-cell {
      padding: 14px;
      border-left: 1px solid rgba(88, 231, 235, 0.25);
      background: linear-gradient(90deg, rgba(88, 231, 235, 0.045), transparent);
    }

    .telemetry-cell .micro-label {
      display: block;
      margin-bottom: 8px;
      color: #829ea1;
      font-size: 0.55rem;
    }

    .telemetry-value {
      color: var(--paper);
      font-family: "Orbitron", sans-serif;
      font-size: clamp(0.95rem, 2vw, 1.35rem);
      letter-spacing: 0.02em;
    }

    .tab-note {
      margin: 18px 0 0;
      color: #9eb5b7;
      font-size: 0.86rem;
    }

    .sequence-side {
      display: flex;
      min-width: 0;
      flex-direction: column;
      justify-content: space-between;
      gap: 26px;
    }

    .progress-block {
      min-width: 0;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 10px;
      color: #bfd0d2;
      font-family: "Orbitron", sans-serif;
      font-size: 0.61rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .progress-track {
      position: relative;
      height: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 198, 83, 0.3);
      border-radius: 999px;
      background:
        repeating-linear-gradient(90deg, transparent 0 18px, rgba(255, 255, 255, 0.05) 18px 19px),
        rgba(0, 0, 0, 0.42);
    }

    .progress-fill {
      position: absolute;
      inset: 2px auto 2px 2px;
      width: calc(var(--progress, 64) * 1% - 4px);
      max-width: calc(100% - 4px);
      border-radius: inherit;
      background: linear-gradient(90deg, var(--amber-hot), #ffe8a5);
      box-shadow: 0 0 15px rgba(255, 188, 60, 0.45);
      transition: width 260ms ease;
    }

    .meter-card {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      align-items: center;
      gap: 18px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.025);
    }

    .meter-orbit {
      --meter: 74;
      position: relative;
      display: grid;
      width: 104px;
      aspect-ratio: 1;
      place-items: center;
      border-radius: 50%;
      background: conic-gradient(var(--cyan) calc(var(--meter) * 1%), rgba(255, 255, 255, 0.08) 0);
      box-shadow: 0 0 24px rgba(88, 231, 235, 0.1);
    }

    .meter-orbit::before {
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 50%;
      background: #091015;
      content: "";
    }

    .meter-number {
      position: relative;
      z-index: 1;
      color: var(--cyan-soft);
      font-family: "Orbitron", sans-serif;
      font-size: 1.42rem;
      font-weight: 700;
    }

    .meter-copy {
      min-width: 0;
    }

    .meter-title {
      display: block;
      margin-bottom: 7px;
      color: var(--paper);
      font-family: "Orbitron", sans-serif;
      font-size: 0.67rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .meter-description {
      margin: 0;
      color: #91aaac;
      font-size: 0.82rem;
    }

    .contact-log {
      min-height: 1.5em;
      margin: 13px 0 0;
      color: var(--cyan);
      font-family: "Orbitron", sans-serif;
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .footer {
      width: 100%;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(3, 6, 8, 0.85);
    }

    .footer-inner {
      display: flex;
      min-height: 76px;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      color: #829b9e;
      font-family: "Orbitron", sans-serif;
      font-size: 0.61rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .footer-orbit {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--amber);
    }

    .footer-orbit::before {
      width: 18px;
      height: 18px;
      border: 1px solid currentColor;
      border-radius: 50%;
      content: "";
      box-shadow: inset 5px 0 0 var(--ink);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 150;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(0, 2, 4, 0.78);
      backdrop-filter: blur(16px);
      opacity: 0;
      transition: opacity 180ms ease;
    }

    .modal-backdrop.is-open {
      opacity: 1;
    }

    .modal {
      position: relative;
      width: min(100%, 560px);
      max-height: min(720px, calc(100vh - 48px));
      padding: clamp(26px, 5vw, 46px);
      overflow: auto;
      border: 1px solid rgba(255, 198, 83, 0.36);
      border-radius: 28px;
      background:
        radial-gradient(circle at 80% 10%, rgba(255, 185, 55, 0.11), transparent 38%),
        rgba(8, 14, 18, 0.96);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.07),
        0 40px 120px rgba(0, 0, 0, 0.72),
        0 0 80px rgba(255, 165, 40, 0.08);
      transform: translateY(16px) scale(0.97);
      transition: transform 220ms cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    .modal-backdrop.is-open .modal {
      transform: translateY(0) scale(1);
    }

    .modal::before {
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(255, 255, 255, 0.055);
      border-radius: 18px;
      content: "";
      pointer-events: none;
    }

    .modal-close {
      position: absolute;
      top: 18px;
      right: 18px;
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      padding: 0;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      color: var(--muted);
      background: rgba(0, 0, 0, 0.25);
      cursor: pointer;
      font-size: 1.1rem;
    }

    .modal-close:hover {
      color: var(--paper);
      border-color: var(--amber);
    }

    .modal-eyebrow {
      margin: 0 0 12px;
      color: var(--amber);
      font-family: "Orbitron", sans-serif;
      font-size: 0.63rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .modal-title {
      max-width: 440px;
      margin: 0;
      font-family: "Orbitron", sans-serif;
      font-size: clamp(1.8rem, 5vw, 3.1rem);
      line-height: 1.04;
      text-transform: uppercase;
    }

    .modal-copy {
      margin: 20px 0 0;
      color: #b4c8ca;
      line-height: 1.7;
    }

    .protocol-list {
      display: grid;
      gap: 10px;
      margin: 24px 0 28px;
      padding: 0;
      list-style: none;
    }

    .protocol-list li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 13px;
      border-left: 1px solid rgba(88, 231, 235, 0.42);
      color: #c9d9da;
      background: linear-gradient(90deg, rgba(88, 231, 235, 0.07), transparent);
      font-size: 0.9rem;
    }

    .protocol-list li::before {
      width: 6px;
      height: 6px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--cyan);
      content: "";
      box-shadow: 0 0 8px var(--cyan);
    }

    .toast-region {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 180;
      width: min(390px, calc(100vw - 48px));
      pointer-events: none;
    }

    .toast {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr) 32px;
      align-items: center;
      gap: 12px;
      padding: 13px;
      border: 1px solid rgba(255, 198, 83, 0.42);
      border-radius: 16px;
      color: var(--paper);
      background: rgba(8, 14, 18, 0.95);
      box-shadow: 0 24px 54px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      opacity: 0;
      pointer-events: none;
      transform: translateY(14px);
      visibility: hidden;
      transition: opacity 180ms ease, transform 180ms ease, visibility 180ms;
    }

    .toast.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
      visibility: visible;
    }

    .toast-signal {
      position: relative;
      width: 28px;
      height: 28px;
      border: 1px solid var(--amber);
      border-radius: 50%;
      box-shadow: 0 0 13px rgba(255, 198, 83, 0.32);
    }

    .toast-signal::before {
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      background: var(--amber);
      content: "";
      box-shadow: 0 0 10px var(--amber);
    }

    .toast-message {
      min-width: 0;
      font-family: "Orbitron", sans-serif;
      font-size: 0.61rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      line-height: 1.5;
      text-transform: uppercase;
    }

    .toast-close {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 1rem;
    }

    .toast-close:hover {
      color: var(--paper);
      background: rgba(255, 255, 255, 0.06);
    }

    @keyframes corona-pulse {
      0%,
      100% {
        filter: brightness(0.94);
        transform: scale(0.995);
      }
      50% {
        filter: brightness(1.1);
        transform: scale(1.01);
      }
    }

    @keyframes filament-breathe {
      from {
        opacity: 0.5;
        transform: scale(0.98) rotate(-1deg);
      }
      to {
        opacity: 0.86;
        transform: scale(1.035) rotate(2deg);
      }
    }

    @keyframes orbit-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes bead-flash {
      0%,
      72%,
      100% {
        opacity: 0.35;
      }
      80% {
        opacity: 1;
      }
    }

    @keyframes signal-pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(88, 231, 235, 0.48);
      }
      55%,
      100% {
        box-shadow: 0 0 0 9px rgba(88, 231, 235, 0);
      }
    }

    @media (max-width: 920px) {
      .hero {
        grid-template-columns: minmax(0, 1fr);
        min-height: auto;
        padding-bottom: 130px;
      }

      .hero-copy {
        max-width: 720px;
      }

      .eclipse-observatory {
        min-height: 420px;
      }

      .eclipse-observatory::before {
        width: min(72vw, 500px);
      }

      .eclipse-observatory::after {
        width: min(62vw, 420px);
      }

      .eclipse-stage {
        width: min(56vw, 350px);
      }

      .panel-command,
      .panel-optics {
        grid-column: span 12;
      }

      .panel-optics .field-stack {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      .shell {
        padding-inline: 16px;
      }

      .topbar-inner {
        grid-template-columns: 1fr auto;
        gap: 12px;
        min-height: 50px;
      }

      .site-status {
        display: none;
      }

      .brand-code {
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .hero {
        padding-top: 54px;
      }

      .section-header {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .tabs-layout {
        grid-template-columns: 1fr;
      }

      .panel-optics .field-stack,
      .field-row {
        grid-template-columns: 1fr;
      }

      .telemetry-grid {
        grid-template-columns: 1fr;
      }

      .footer-inner {
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        padding-block: 20px;
      }
    }

    @media (max-width: 520px) {
      .hero-title {
        font-size: clamp(3rem, 16vw, 4.25rem);
      }

      .hero-actions {
        align-items: stretch;
        flex-direction: column;
      }

      .hero-actions .btn:not(.btn-icon) {
        width: 100%;
      }

      .eclipse-observatory {
        min-height: 350px;
      }

      .eclipse-stage {
        width: 286px;
        min-width: 286px;
      }

      .baily-beads i {
        transform: rotate(var(--angle)) translateY(-119px);
      }

      .orbital-readout {
        bottom: -52px;
      }

      .signature-line {
        display: none;
      }

      .control-deck {
        padding-block: 64px 80px;
      }

      .panel {
        padding: 22px 18px;
        border-radius: 20px;
      }

      .button-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .button-grid .btn:not(.btn-icon) {
        width: 100%;
      }

      .radio-group {
        grid-template-columns: 1fr;
      }

      .radio-orbit {
        min-height: 56px;
        grid-template-columns: 22px 1fr;
        justify-items: start;
        text-align: left;
      }

      .tablist {
        width: 100%;
        overflow-x: auto;
        border-radius: 16px;
      }

      .tab {
        min-width: max-content;
      }

      .meter-card {
        grid-template-columns: 1fr;
        justify-items: center;
        text-align: center;
      }

      .inline-actions {
        align-items: stretch;
        flex-direction: column;
      }

      .inline-actions .btn {
        width: 100%;
      }

      .toast-region {
        right: 16px;
        bottom: 16px;
        width: calc(100vw - 32px);
      }

      .modal-backdrop {
        padding: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>

  <script>
    (() => {
      "use strict";

      document.querySelectorAll("[data-t]").forEach((node) => {
        if (!node.textContent) {
          node.textContent = node.dataset.t || "";
        }
      });

      const storageKey = "corona-observatory-state-v1";
      const defaults = {
        callSign: "",
        band: "h-alpha",
        prominences: true,
        atmosphere: true,
        phase: 78,
        exposure: "1/500 s",
        tab: "ephemeris",
        progress: 64
      };
      let state = { ...defaults };
      let sequenceTimer = null;
      let toastTimer = null;
      let modalTrigger = null;

      try {
        const saved = JSON.parse(localStorage.getItem(storageKey));
        if (saved && typeof saved === "object") {
          state = { ...state, ...saved };
        }
      } catch (error) {
        state = { ...defaults };
      }

      const byId = (id) => document.getElementById(id);
      const callSign = byId("callSign");
      const callSignShell = byId("callSignShell");
      const callSignStatus = byId("callSignStatus");
      const prominenceCheck = byId("prominenceCheck");
      const atmosphereSwitch = byId("atmosphereSwitch");
      const phaseRange = byId("phaseRange");
      const phaseValue = byId("phaseValue");
      const phaseOutput = byId("phaseOutput");
      const heroPhase = byId("heroPhase");
      const eclipseStage = byId("eclipseStage");
      const exposureButton = byId("exposureButton");
      const exposureList = byId("exposureList");
      const exposureValue = byId("exposureValue");
      const exposureOptions = Array.from(exposureList.querySelectorAll('[role="option"]'));
      const stabilityMeter = byId("stabilityMeter");
      const meterNumber = byId("meterNumber");
      const meterDescription = byId("meterDescription");
      const progress = byId("sequenceProgress");
      const progressValue = byId("progressValue");
      const runButton = byId("runButton");
      const resetButton = byId("resetButton");
      const activeBand = byId("activeBand");
      const contactLog = byId("contactLog");
      const modalBackdrop = byId("protocolModal");
      const modalClose = byId("modalClose");
      const beginButton = byId("beginButton");
      const engageButton = byId("engageButton");
      const abortButton = byId("abortButton");
      const toast = byId("toast");
      const toastMessage = byId("toastMessage");
      const toastClose = byId("toastClose");
      const tipButton = byId("tipButton");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const bandLabels = {
        "h-alpha": "H-ALPHA / 656.3 NM",
        "white": "WHITE LIGHT / BROADBAND",
        "calcium-k": "CALCIUM-K / 393.4 NM"
      };

      function persist() {
        try {
          localStorage.setItem(storageKey, JSON.stringify(state));
        } catch (error) {
          return;
        }
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function showToast(message) {
        window.clearTimeout(toastTimer);
        toastMessage.textContent = message;
        toast.classList.add("show");
        toastTimer = window.setTimeout(() => {
          toast.classList.remove("show");
        }, 4200);
      }

      function updateInputState(announce) {
        const clean = callSign.value.trim();
        callSignShell.classList.toggle("has-value", callSign.value.length > 0);
        state.callSign = callSign.value;
        callSignStatus.textContent = clean
          ? "OBSERVER LINKED / " + clean.toUpperCase()
          : "AWAITING OBSERVER IDENTITY";
        persist();
        if (announce && clean) {
          showToast("OBSERVER " + clean.toUpperCase() + " LINKED TO LOCAL RECORD");
        }
      }

      function updateMeter() {
        const phase = Number(state.phase);
        const atmosphereBonus = state.atmosphere ? 0.5 : 0;
        const prominencePenalty = state.prominences ? 0.25 : 0;
        const value = clamp(9.4 - Math.abs(84 - phase) * 0.055 + atmosphereBonus - prominencePenalty, 4.2, 9.8);
        const rounded = value.toFixed(1);
        stabilityMeter.style.setProperty("--meter", String(value * 10));
        stabilityMeter.setAttribute("aria-valuenow", rounded);
        meterNumber.textContent = rounded;
        meterDescription.textContent = value >= 8
          ? "FIELD LOCK IS INSIDE THE CAPTURE THRESHOLD."
          : value >= 6
            ? "EDGE DRIFT IS VISIBLE; RECENTER BEFORE C2."
            : "CORONAL FIELD UNSTABLE; HOLD THE SEQUENCE.";
      }

      function updatePhase(value, announce) {
        const normalized = clamp(Number(value) || 0, 0, 100);
        state.phase = normalized;
        phaseRange.value = String(normalized);
        phaseRange.style.setProperty("--range-fill", normalized + "%");
        phaseValue.textContent = normalized + "%";
        phaseOutput.textContent = String(normalized);
        heroPhase.textContent = normalized + "% OCCULTED";
        eclipseStage.style.setProperty("--moon-shift", Math.max(0, (100 - normalized) * 1.38) + "px");
        eclipseStage.setAttribute("aria-label", "Animated solar eclipse instrument showing " + normalized + " percent occultation");
        updateMeter();
        persist();
        if (announce) {
          showToast("OCCULTATION SET / " + normalized + " PERCENT");
        }
      }

      function updateProgress(value) {
        const normalized = clamp(Math.round(Number(value) || 0), 0, 100);
        state.progress = normalized;
        progress.style.setProperty("--progress", String(normalized));
        progress.setAttribute("aria-valuenow", String(normalized));
        progressValue.textContent = normalized + "%";
        persist();
        if (normalized >= 100) {
          stopSequence();
          showToast("TOTALITY PASSAGE COMPLETE / DARK FRAMES SECURED");
        }
      }

      function startSequence() {
        if (sequenceTimer) {
          stopSequence();
          showToast("SEQUENCE HELD / PASSAGE STATE PRESERVED");
          return;
        }
        if (state.progress >= 100) {
          updateProgress(0);
        }
        if (reducedMotion.matches) {
          updateProgress(100);
          return;
        }
        runButton.textContent = "HOLD SEQUENCE";
        sequenceTimer = window.setInterval(() => {
          updateProgress(state.progress + 1);
        }, 90);
        showToast("TOTALITY SEQUENCE RUNNING");
      }

      function stopSequence() {
        if (sequenceTimer) {
          window.clearInterval(sequenceTimer);
          sequenceTimer = null;
        }
        runButton.textContent = "RUN SEQUENCE";
      }

      function updateBand(value, announce) {
        state.band = bandLabels[value] ? value : defaults.band;
        document.querySelectorAll('input[name="band"]').forEach((radio) => {
          radio.checked = radio.value === state.band;
        });
        activeBand.textContent = bandLabels[state.band];
        persist();
        if (announce) {
          showToast("SPECTRAL BAND LOCKED / " + bandLabels[state.band]);
        }
      }

      function setExposure(value, announce) {
        const selected = exposureOptions.find((option) => option.dataset.value === value) || exposureOptions[2];
        state.exposure = selected.dataset.value;
        exposureValue.textContent = state.exposure;
        exposureOptions.forEach((option) => {
          option.setAttribute("aria-selected", String(option === selected));
        });
        persist();
        if (announce) {
          showToast("EXPOSURE STACK SET / " + state.exposure);
        }
      }

      function openSelect(direction) {
        exposureList.hidden = false;
        exposureButton.setAttribute("aria-expanded", "true");
        const selectedIndex = Math.max(0, exposureOptions.findIndex((option) => option.getAttribute("aria-selected") === "true"));
        const index = direction === "up" ? Math.max(0, selectedIndex - 1) : selectedIndex;
        window.requestAnimationFrame(() => exposureOptions[index].focus());
      }

      function closeSelect(restoreFocus) {
        exposureList.hidden = true;
        exposureButton.setAttribute("aria-expanded", "false");
        exposureOptions.forEach((option) => {
          option.tabIndex = -1;
        });
        if (restoreFocus) {
          exposureButton.focus();
        }
      }

      function moveOption(current, delta) {
        const index = exposureOptions.indexOf(current);
        const next = (index + delta + exposureOptions.length) % exposureOptions.length;
        exposureOptions[next].focus();
      }

      function setTab(name, focusTab) {
        const valid = ["ephemeris", "spectra", "capture"].includes(name) ? name : "ephemeris";
        state.tab = valid;
        document.querySelectorAll('[role="tab"]').forEach((tab) => {
          const selected = tab.dataset.tab === valid;
          tab.setAttribute("aria-selected", String(selected));
          tab.tabIndex = selected ? 0 : -1;
          if (selected && focusTab) {
            tab.focus();
          }
        });
        document.querySelectorAll('[role="tabpanel"]').forEach((panel) => {
          panel.hidden = panel.id !== "panel-" + valid;
        });
        persist();
      }

      function setPageInert(value) {
        [document.querySelector(".topbar"), document.querySelector("main"), document.querySelector(".footer")].forEach((node) => {
          if (node) {
            node.inert = value;
          }
        });
      }

      function openModal(trigger) {
        closeSelect(false);
        tipButton.setAttribute("aria-expanded", "false");
        modalTrigger = trigger || document.activeElement;
        modalBackdrop.hidden = false;
        document.body.classList.add("modal-open");
        setPageInert(true);
        window.requestAnimationFrame(() => {
          modalBackdrop.classList.add("is-open");
          modalClose.focus();
        });
      }

      function closeModal(restoreFocus) {
        modalBackdrop.classList.remove("is-open");
        document.body.classList.remove("modal-open");
        setPageInert(false);
        const finish = () => {
          modalBackdrop.hidden = true;
          if (restoreFocus && modalTrigger && typeof modalTrigger.focus === "function") {
            modalTrigger.focus();
          }
        };
        if (reducedMotion.matches) {
          finish();
        } else {
          window.setTimeout(finish, 190);
        }
      }

      function trapModalFocus(event) {
        if (modalBackdrop.hidden) {
          return;
        }
        if (event.key === "Escape") {
          event.preventDefault();
          event.stopPropagation();
          closeModal(true);
          return;
        }
        if (event.key !== "Tab") {
          return;
        }
        const focusable = Array.from(modalBackdrop.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), [tabindex]:not([tabindex="-1"])'))
          .filter((element) => !element.hidden && element.offsetParent !== null);
        if (!focusable.length) {
          return;
        }
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      }

      function updateClock() {
        const now = new Date();
        byId("utcClock").textContent =
          String(now.getUTCHours()).padStart(2, "0") + ":" +
          String(now.getUTCMinutes()).padStart(2, "0") + ":" +
          String(now.getUTCSeconds()).padStart(2, "0") + " UTC";
      }

      callSign.value = typeof state.callSign === "string" ? state.callSign.slice(0, 24) : "";
      prominenceCheck.checked = Boolean(state.prominences);
      atmosphereSwitch.checked = Boolean(state.atmosphere);
      updateInputState(false);
      updateBand(state.band, false);
      updatePhase(state.phase, false);
      setExposure(state.exposure, false);
      setTab(state.tab, false);
      updateProgress(state.progress);
      updateClock();
      window.setInterval(updateClock, 1000);

      callSign.addEventListener("input", () => updateInputState(false));
      callSign.addEventListener("change", () => updateInputState(true));

      document.querySelectorAll('input[name="band"]').forEach((radio) => {
        radio.addEventListener("change", () => {
          if (radio.checked) {
            updateBand(radio.value, true);
          }
        });
      });

      prominenceCheck.addEventListener("change", () => {
        state.prominences = prominenceCheck.checked;
        updateMeter();
        persist();
        showToast(prominenceCheck.checked ? "LIMB PROMINENCES INCLUDED" : "LIMB PROMINENCES MASKED");
      });

      atmosphereSwitch.addEventListener("change", () => {
        state.atmosphere = atmosphereSwitch.checked;
        updateMeter();
        persist();
        showToast(atmosphereSwitch.checked ? "ATMOSPHERE SUPPRESSION ACTIVE" : "ATMOSPHERE SUPPRESSION BYPASSED");
      });

      phaseRange.addEventListener("input", () => updatePhase(phaseRange.value, false));
      phaseRange.addEventListener("change", () => updatePhase(phaseRange.value, true));

      exposureButton.addEventListener("click", () => {
        if (exposureList.hidden) {
          openSelect("current");
        } else {
          closeSelect(true);
        }
      });

      exposureButton.addEventListener("keydown", (event) => {
        if (["ArrowDown", "ArrowUp", "Enter", " "].includes(event.key)) {
          event.preventDefault();
          openSelect(event.key === "ArrowUp" ? "up" : "current");
        }
      });

      exposureOptions.forEach((option) => {
        option.addEventListener("click", () => {
          setExposure(option.dataset.value, true);
          closeSelect(true);
        });
        option.addEventListener("keydown", (event) => {
          if (event.key === "ArrowDown") {
            event.preventDefault();
            moveOption(option, 1);
          } else if (event.key === "ArrowUp") {
            event.preventDefault();
            moveOption(option, -1);
          } else if (event.key === "Home") {
            event.preventDefault();
            exposureOptions[0].focus();
          } else if (event.key === "End") {
            event.preventDefault();
            exposureOptions[exposureOptions.length - 1].focus();
          } else if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            setExposure(option.dataset.value, true);
            closeSelect(true);
          } else if (event.key === "Escape") {
            event.preventDefault();
            event.stopPropagation();
            closeSelect(true);
          } else if (event.key === "Tab") {
            closeSelect(false);
          }
        });
      });

      document.querySelectorAll('[role="tab"]').forEach((tab) => {
        tab.addEventListener("click", () => setTab(tab.dataset.tab, false));
        tab.addEventListener("keydown", (event) => {
          const tabs = Array.from(document.querySelectorAll('[role="tab"]'));
          const current = tabs.indexOf(tab);
          let next = current;
          if (event.key === "ArrowRight" || event.key === "ArrowDown") {
            next = (current + 1) % tabs.length;
          } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
            next = (current - 1 + tabs.length) % tabs.length;
          } else if (event.key === "Home") {
            next = 0;
          } else if (event.key === "End") {
            next = tabs.length - 1;
          } else {
            return;
          }
          event.preventDefault();
          setTab(tabs[next].dataset.tab, true);
        });
      });

      document.querySelectorAll("[data-action]").forEach((button) => {
        button.addEventListener("click", () => {
          const action = button.dataset.action;
          if (action === "lock") {
            updateProgress(state.progress + 8);
            showToast("CORONAL EDGE LOCKED / DRIFT 0.02 DEGREES");
          } else if (action === "mark") {
            const stamp = new Date().toISOString().slice(11, 19);
            contactLog.textContent = "C2 CONTACT MARKED / " + stamp + " UTC";
            showToast("SECOND CONTACT WRITTEN TO LOCAL RECORD");
          } else if (action === "vent") {
            atmosphereSwitch.checked = !atmosphereSwitch.checked;
            atmosphereSwitch.dispatchEvent(new Event("change", { bubbles: true }));
          } else if (action === "recenter") {
            updatePhase(84, true);
            phaseRange.focus();
          }
        });
      });

      runButton.addEventListener("click", startSequence);
      resetButton.addEventListener("click", () => {
        stopSequence();
        updateProgress(0);
        showToast("PASSAGE RESET / CONTACT WINDOW PRESERVED");
      });

      beginButton.addEventListener("click", () => openModal(beginButton));
      byId("alignButton").addEventListener("click", () => {
        byId("control-deck").scrollIntoView({ behavior: reducedMotion.matches ? "auto" : "smooth", block: "start" });
        window.setTimeout(() => phaseRange.focus({ preventScroll: true }), reducedMotion.matches ? 0 : 480);
      });

      modalClose.addEventListener("click", () => closeModal(true));
      abortButton.addEventListener("click", () => {
        closeModal(true);
        showToast("PROTOCOL ABORTED / CURRENT LOCK PRESERVED");
      });
      engageButton.addEventListener("click", () => {
        atmosphereSwitch.checked = true;
        state.atmosphere = true;
        updateMeter();
        stopSequence();
        updateProgress(0);
        closeModal(false);
        startSequence();
      });
      modalBackdrop.addEventListener("mousedown", (event) => {
        if (event.target === modalBackdrop) {
          closeModal(true);
        }
      });

      toastClose.addEventListener("click", () => {
        window.clearTimeout(toastTimer);
        toast.classList.remove("show");
      });

      tipButton.addEventListener("click", () => {
        const open = tipButton.getAttribute("aria-expanded") === "true";
        tipButton.setAttribute("aria-expanded", String(!open));
      });

      document.addEventListener("keydown", trapModalFocus);
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && exposureButton.getAttribute("aria-expanded") === "true") {
          event.preventDefault();
          event.stopPropagation();
          closeSelect(true);
        } else if (event.key === "Escape" && tipButton.getAttribute("aria-expanded") === "true") {
          event.preventDefault();
          event.stopPropagation();
          tipButton.setAttribute("aria-expanded", "false");
          tipButton.focus();
        }
      });

      document.addEventListener("pointerdown", (event) => {
        if (!byId("exposureSelect").contains(event.target) && !exposureList.hidden) {
          closeSelect(false);
        }
        if (!tipButton.parentElement.contains(event.target)) {
          tipButton.setAttribute("aria-expanded", "false");
        }
      });
    })();
  </script>
</body>
</html>
